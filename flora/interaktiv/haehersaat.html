      <div class="level">${LEVEL.map((L, i) => { const d = S[L.id], zu = !offen(i);
        return `<button type="button" class="lv" data-i="${i}" ${zu ? "disabled" : ""}><span class="em">${zu ? "🔒" : `<span style="font-size:44px">${L.em}</span>`}</span>
          <span><span class="nr">${L.zeit}</span><span class="nm">${L.titel}</span><span class="mo">${zu ? "Öffnet sich, wenn du im " + LEVEL[i - 1].titel.replace("Der ", "") + " einen Stern geholt hast." : L.motto}</span>
          ${d && d.n ? `<span class="st">${sterneHTML(d.sterne || 0)} · Rekord: ${d.best || 0} Samen · 🌳 ${d.baeume || 0} junge Bäume</span>` : zu ? "" : `<span class="st">▶ Losfliegen</span>`}</span></button>`; }).join("")}</div>
      <p class="klein">Ein Herbsttag dauert etwa drei Minuten.</p>
    </section>
    <section>
      <h2 class="h-blau">📖 Dein Waldbuch <span class="klein">${kenn.length} von ${B.length}</span></h2>
      <p class="klein">Alles, was du im Wald entdeckst, wird hier eingetragen.</p>
      <div class="buch">${B.map(t => kenn.includes(t) ? `<div class="be"><span>${ORTE[t] ? ortBild(t, 52) : samenBild(t, 52)}</span><span><b>${ORTE[t] ? ORTE[t].n : SAMEN[t].n}</b><br>${ORTE[t] ? ORTE[t].info : SAMEN_TXT[t]}</span></div>` : `<div class="be zu"><span>❓</span><span>Noch nicht entdeckt</span></div>`).join("")}</div>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>„Hähersaat“ ist ein Bonus-Spiel zum Forscherpass Wald. Die Kinder erleben, wie schwere Samen durch Tiere verbreitet werden (Versteckausbreitung) und warum junge Eichen Licht brauchen, Buchen aber Schatten vertragen.</p>
        <ul class="clean">
          <li><b>Eichenwald (Oktober):</b> Eicheln sammeln und verstecken; Eichhörnchen stehlen, wenn sie zusehen.</li>
          <li><b>Buchenwald (November):</b> Bucheckern machen weniger satt; Wildschweine durchwühlen Laub und Moos.</li>
          <li><b>Waldrand (Spätherbst):</b> viele Lichtungen; der Habicht zwingt in die Deckung von Fichte und Hasel.</li>
          <li><b>Frühling:</b> Am Ende vergisst der Häher etwa jedes dritte Versteck. Eicheln und Nüsse wachsen nur im Licht zu jungen Pflanzen heran, Bucheckern auch im Schatten.</li>
          <li><b>Vereinfachung:</b> Ein Häher versteckt pro Herbst einige tausend Eicheln, meist einzeln. Wie viele er wiederfindet, ist von Jahr zu Jahr verschieden.</li>
          <li><b>Gesprächsanlässe:</b> Warum stehen junge Eichen oft weit weg von alten Eichen? Wer hat einen Vorteil – Vogel oder Baum? Warum werden Buchen im Wald so häufig?</li>
        </ul>
        <div class="knopfreihe">${alle ? "" : `<button type="button" class="knopf" id="frei">🔓 Alle Wälder sofort öffnen</button>`}<button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $$(".lv", app).forEach(b => b.onclick = () => { location.hash = LEVEL[+b.dataset.i].id; });
  const f = $("#frei"); if (f) f.onclick = () => { S.frei = true; speichern(); seiteStart(); };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}
const SAMEN_TXT = {
  eichel: "Groß und nahrhaft. Ein Eichelhäher trägt bis zu fünf Eicheln im Kehlsack und eine im Schnabel.",
  buchecker: "Dreikantig, klein und ölig. In einer stacheligen Hülle stecken meist zwei davon.",
  nuss: "Hart und fettreich. Häher, Eichhörnchen und Haselmaus verstecken Haselnüsse als Wintervorrat."
};

/* ============ Ein Herbsttag ============ */
let timer = [];
const spaeter = (f, ms) => { timer.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); };
function seiteSpiel(id) {
  const nr = LEVEL.findIndex(L => L.id === id), L = LEVEL[nr];
  const st = neuesSpiel(L, Math.random);
  let sperre = false, meld = [{ art: "info", t: L.kurz + " · " + L.was, k: L.intro }];
  const X = i => spalte(i) * 100, Y = i => 70 + zeile(i) * 100;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span><b>${L.titel}</b> · ${L.zeit}</span><span id="rest"></span></div></div></div>
    <div class="spiel"><div class="planrahmen" id="rahmen">
      <svg id="plan" viewBox="0 0 700 570" role="group" aria-label="Waldplan mit ${BREIT * HOCH} Feldern">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9cfe6"/><stop offset="1" stop-color="#e4eef2"/></linearGradient>
          <pattern id="gefahr" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="rgba(178,59,46,.30)"/></pattern></defs>
        <g id="himmel"></g><g id="felder"></g><g id="biene" class="biene">${haeherSVG()}</g><g id="fx"></g>
      </svg></div>
      <aside class="pult">
        <div class="anz"><span class="lab">💪 Kraft</span><div class="pips" id="pE"></div></div>
        <div class="anz"><span class="lab">🌰 Im Kehlsack</span><div class="pips sack" id="pL"></div></div>
        <div class="anz nestanz"><span class="lab">🕳️ Versteckt: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div></div>
        <div id="meld" role="status" aria-live="polite"></div>
        <details class="kunde"><summary>📖 Was wächst in diesem Wald?</summary><div id="kunde"></div></details>
      </aside></div>`;
  const vogel = $("#biene"), fx = $("#fx");
  function himmel() {
    const p = Math.min(1, st.zug / L.zuege), sx = 40 + 620 * p, sy = 56 - 36 * Math.sin(Math.PI * p), abend = Math.max(0, (p - .75) * 4), hn = habichtNaht(st);
    const rs = rotteNaht(st) ? -1 : rotteSpalte(st, st.zug + 1);
    $("#himmel").innerHTML = `<rect width="700" height="70" fill="url(#hg)"/><rect width="700" height="70" fill="#f08a3c" opacity="${(abend * .55).toFixed(2)}"/>
      <circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="15" fill="#ffd23f" stroke="#f4a800" stroke-width="2.5"/>
      ${hn ? `<g transform="translate(${(700 - hn * 150).toFixed(0)} 34)"><path d="M-30 0 Q-14 -12 0 -2 Q14 -12 30 0 Q14 -4 0 4 Q-14 -4 -30 0 Z" fill="#4a4036"/></g><text x="${(700 - hn * 150 + 40).toFixed(0)}" y="40" class="plantext rot">Habicht!</text>` : ""}
      ${rotteNaht(st) ? `<text x="8" y="60" font-size="32">🐗</text><text x="50" y="54" class="plantext rot">Wildschweine kommen!</text>` : rs >= 0 ? `<text x="${rs * 100 + 50}" y="62" font-size="34" text-anchor="middle">🐗</text>` : ""}`;
  }
  function felder() {
    const rs = rotteNaht(st) ? -1 : rotteSpalte(st, st.zug + 1);
    $("#felder").innerHTML = st.feld.map((f, i) => { const o = ORTE[f.t], d = weite(st.pos, i), fern = d > st.energie, sicht = o.boden && beobachtet(st, i);
      const name = (f.schlaf ? "Schlafbaum" : o.n) + (o.samen ? (f.vorrat ? ", " + f.vorrat + " " + SAMEN[o.samen].mehr : ", abgeerntet") : "") + (f.versteck.length ? ", " + f.versteck.length + " versteckt" : "") + (sicht ? ", ein Eichhörnchen sieht zu" : "");
      return `<g class="feld${fern ? " fern" : ""}${i === st.pos ? " hier" : ""}" data-i="${i}" transform="translate(${X(i)} ${Y(i)})" tabindex="0" role="button" aria-label="${name}, ${d} Felder entfernt${fern ? ", zu weit" : ""}">
        <rect width="100" height="100" fill="${BODEN[f.t][(spalte(i) + zeile(i)) % 2]}"/>
        <g class="${o.samen && !f.vorrat ? "leer" : ""}">${BILD[f.t](o.samen || f.t === "fichte" ? f : i)}</g>${f.weg ? BILD.gewuehlt(i) : ""}
        ${sicht ? `<rect width="100" height="100" fill="#f2a33a" opacity=".22"/>` : ""}${verstBild(f.versteck.length)}
        ${fern ? `<rect width="100" height="100" fill="#22301c" opacity=".42"/>` : ""}<rect class="treffer" width="100" height="100" fill="transparent"/></g>`; }).join("")
      + st.hoernchen.map(h => { const x1 = Math.max(0, X(h) - 100) + 3, y1 = Math.max(70, Y(h) - 100) + 3, x2 = Math.min(700, X(h) + 200) - 3, y2 = Math.min(570, Y(h) + 200) - 3;
        return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="12" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-dasharray="8 6" pointer-events="none"/>` + hoernchenSVG(X(h) + 50, Y(h) + 46); }).join("")
      + (rs >= 0 ? `<rect x="${rs * 100}" y="70" width="100" height="500" fill="url(#gefahr)" stroke="#B23B2E" stroke-width="4" stroke-dasharray="12 8" pointer-events="none"/>` : "");
  }
  function pult() {
    $("#rest").textContent = vorbei(st) ? "Abend" : "noch " + (L.zuege - st.zug) + (L.zuege - st.zug === 1 ? " Zug" : " Züge");
    $("#pE").innerHTML = Array.from({ length: L.emax }, (x, k) => `<i class="${k < st.energie ? "an" : ""}"></i>`).join(""); $("#pE").classList.toggle("knapp", st.energie <= 2);
    $("#pL").innerHTML = Array.from({ length: L.kap }, (x, k) => st.last[k] ? `<svg viewBox="-7 -8 14 15" width="20" height="20" aria-hidden="true">${SAMEN_BILD[st.last[k]](0, 0)}</svg>` : `<i class="pol"></i>`).join("");
    $("#nZahl").textContent = st.punkte + " Samen" + (sterneFuer(L, st.punkte) ? " · " + "⭐".repeat(sterneFuer(L, st.punkte)) : ""); $("#nBalk").style.width = Math.min(100, Math.max(0, st.punkte) / L.ziel[2] * 100) + "%";
    const rang = { pech: 0, regen: 1, mahd: 1, buch: 3, gut: 2, mies: 2, info: 4 };
    $("#meld").innerHTML = meld.slice().sort((a, b) => rang[a.art] - rang[b.art]).slice(0, 3).map(m => `<div class="folge m-${m.art}"><span class="urteil">${m.t}</span><span>${m.k}</span></div>`).join("");
    const kenn = buch();
    $("#kunde").innerHTML = Object.keys(L.feld).map(t => `<div class="be"><span>${ortBild(t, 40)}</span><span>${kenn.includes(t) ? `<b>${ORTE[t].n}</b><br>${ORTE[t].samen ? SAMEN[ORTE[t].samen].mehr + ", +" + SAMEN[ORTE[t].samen].kraft + " Kraft" : ORTE[t].boden ? (ORTE[t].hell ? "hell – gut für junge Eichen" : "schattig") : "Deckung vor dem Habicht"}` : "<b>?</b><br>noch nicht besucht"}</span></div>`).join("");
    vogel.classList.toggle("beladen", ladung(st) > 0);
  }
  const setzeVogel = () => vogel.setAttribute("style", `transform:translate(${X(st.pos) + 64}px,${Y(st.pos) + 62}px)`);
  function zeichne() { himmel(); felder(); pult(); setzeVogel(); }
  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 30); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }
  function flug(i) {
    if (sperre || vorbei(st)) return;
    if (weite(st.pos, i) > st.energie) { meld = [{ art: "mies", t: "Zu weit!", k: "Für diesen Flug reicht deine Kraft nicht. Die dunklen Felder erreichst du gerade nicht." }]; pult(); return; }
    const vor = { e: st.energie - weite(st.pos, i), l: ladung(st), p: st.punkte }, alt = buch().slice();
    const M = schritt(st, i); if (!M) return;
    sperre = true; setzeVogel();
    st.neu.forEach(t => { if (!alt.includes(t)) { buch().push(t); M.push({ art: "buch", t: "📖 Neu im Waldbuch: " + (ORTE[t] ? ORTE[t].n : SAMEN[t].n), k: ORTE[t] ? ORTE[t].info : SAMEN_TXT[t] }); } }); speichern();
    const pech = M.some(m => m.art === "pech");
    spaeter(() => {
      meld = M; zeichne();
      if (st.energie > vor.e && !pech) schwebe(i, "+" + (st.energie - vor.e) + " 💪", "blau");
      if (ladung(st) > vor.l) spaeter(() => schwebe(i, "+" + (ladung(st) - vor.l) + " 🌰", "gelb"), 250);
      if (st.punkte > vor.p) schwebe(i, "versteckt!", "gruen");
      if (pech) { const r = $("#rahmen"); r.classList.remove("ruck"); void r.offsetWidth; r.classList.add("ruck"); }
      spaeter(() => { sperre = false; if (vorbei(st)) ende(); }, vorbei(st) ? 1900 : pech ? 1100 : 120);
    }, 430);
  }
  $("#plan").addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) flug(+g.dataset.i); });
  $("#plan").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-i]"); if (g) { e.preventDefault(); flug(+g.dataset.i); } } });
  zeichne();

  function ende() {
    const pkt = Math.max(0, st.punkte), n = sterneFuer(L, pkt), alt = S[L.id] || {}, rekord = pkt > (alt.best || 0) && alt.n;
    const fr = fruehling(st, Math.random), zahl = Object.values(fr.baeume).reduce((a, b) => a + b, 0);
    S[L.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.max(alt.best || 0, pkt), baeume: (alt.baeume || 0) + zahl }; speichern();
    const next = LEVEL[nr + 1], neuOffen = n > 0 && next && !alt.sterne && !S.frei, s = st.stat;
    const pannen = [s.geklaut && s.geklaut + " Samen an Eichhörnchen verloren", s.gewuehlt && s.gewuehlt + " Samen an Wildschweine verloren", s.habicht && "vor dem Habicht geflüchtet", s.platt && "vor Erschöpfung liegen geblieben"].filter(Boolean);
    const titel = n === 3 ? "Die Vorratskammer ist voll!" : n === 2 ? "Ein guter Wintervorrat" : n === 1 ? "Es reicht knapp für den Winter" : "Das war zu wenig";
    const keim = Object.entries(fr.baeume).map(([k, v]) => `<div class="kb"><span class="kz">${v}</span><span>${v === 1 ? "junge " + SAMEN[k].baum : "junge " + (k === "nuss" ? "Haselsträucher" : SAMEN[k].baum + "n")}</span></div>`).join("");
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Übersicht</a><span><b>${L.titel}</b> · ${L.zeit}</span><span>Abend</span></div></div></div>
      <div class="huelle"><section><div class="ende">
        <div class="held"><svg viewBox="-40 -40 80 80" width="110" height="110" aria-hidden="true">${haeherSVG()}</svg></div>
        <span class="eyebrow">${L.zeit} geht zu Ende</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p><b>${pkt} Samen</b> liegen gut versteckt im Waldboden.${ladung(st) ? " " + ladung(st) + " hattest du noch im Kehlsack – die zählen nicht." : ""}${rekord ? " Das ist dein neuer Rekord!" : ""}</p>
        <p class="klein">${n < 3 ? "Für " + (n + 1) + (n ? " Sterne" : " Stern") + " brauchst du " + L.ziel[n] + " versteckte Samen. " : ""}${pannen.length ? "Heute hast du " + pannen.join(", ").replace(/, ([^,]*)$/, " und $1") + "." : "Kein Dieb, kein Habicht hat dich erwischt – stark!"}</p>
        ${neuOffen ? `<p><b>🔓 Freigeschaltet:</b> ${next.titel} wartet auf dich.</p>` : ""}
      </div></section>
      <section><div class="fruehjahr">
        <span class="eyebrow">Ein halbes Jahr später …</span><h3 class="h-blau">Frühling im Wald 🌱</h3>
        <p>Den Winter über hast du die meisten Verstecke wiedergefunden. <b>${fr.vergessen} ${fr.vergessen === 1 ? "Samen hast du vergessen" : "Samen hast du vergessen"}</b> – und die keimen jetzt.</p>
        ${zahl ? `<div class="keim">${keim}</div>` : ""}
        <p class="klein">${zahl ? "Ganz ohne Gärtner: Du hast " + zahl + (zahl === 1 ? " Pflanze" : " Pflanzen") + " in den Wald gesetzt. " : fr.vergessen ? "" : "Diesmal hast du alles wiedergefunden – gut für dich, aber kein neuer Baum für den Wald. "}${fr.kuemmer ? fr.kuemmer + (fr.kuemmer === 1 ? " Keimling kümmert" : " Keimlinge kümmern") + " im Schatten: Eichen und Haseln brauchen Licht." : ""}</p>
      </div></section>
      <section><div class="knopfreihe"><button type="button" class="knopf${n ? "" : " prim"}" id="noch">🔁 Noch einmal</button>${n && next ? `<a class="knopf honig" href="#${next.id}">${next.titel} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="../waldpass.html">Zum Waldpass</a></div></section>
      <section><h3 class="h-honig">Was dir der Wald heute gezeigt hat</h3><div class="merk">${MERK[L.id].map(k => `<div>${k}</div>`).join("")}</div></section>${fuss()}</div>`;
    $("#noch").onclick = () => seiteSpiel(id);
    if (n === 3) konfetti(["🌰", "⭐", "🌳", "🍂", "🌱"]);
  }
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
