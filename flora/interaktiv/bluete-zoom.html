<style>
  :root{
    --gruen:#2F4F3E;
    --gruen-hell:#4A6B58;
    --creme:#F7F3E8;
    --karte:#FFFDF6;
    --linie:#D9D0BC;
    --pollen:#E3B23C;
    --pollen-dunkel:#C98A1F;
    --rosa:#E9A6B3;
    --text:#33402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--creme);
    color:var(--text);
    line-height:1.55;
  }
  header{ background:var(--gruen); color:#F4EFE2; padding:18px 16px 16px; text-align:center; }
  header h1{ margin:0; font-size:1.45rem; font-weight:normal; letter-spacing:.5px; }
  header p{ margin:6px 0 0; font-size:.95rem; font-style:italic; opacity:.85; }
  main{ max-width:760px; margin:0 auto; padding:18px 12px 30px; }
  .karte{
    background:var(--karte);
    border:1px solid var(--linie);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(47,79,62,.08);
  }
  .buehne{ display:block; width:100%; height:auto; background:linear-gradient(#FDFBF3 70%, #EFF2E2); }

  .erklaerung{ border-top:1px solid var(--linie); padding:16px 20px 6px; min-height:140px; }
  .erklaerung h2{ margin:0 0 2px; font-size:1.15rem; color:var(--gruen); font-weight:normal; }
  .erklaerung .massstab{ margin:0 0 8px; font-size:.85rem; font-style:italic; color:var(--gruen-hell); }
  .erklaerung p.haupt{ margin:0 0 12px; font-size:1rem; }
  .erklaerung.wechsel{ animation:einblenden .45s ease; }
  @keyframes einblenden{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .steuerung{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 16px 16px;
  }
  .knopf{
    font-family:inherit; font-size:.88rem;
    border:1.5px solid var(--gruen);
    background:var(--gruen); color:#F4EFE2;
    border-radius:999px; padding:7px 14px;
    cursor:pointer; min-width:96px;
  }
  .knopf.heraus{ background:transparent; color:var(--gruen); }
  .knopf:disabled{ opacity:.35; cursor:default; }
  .knopf:focus-visible{ outline:3px solid var(--pollen); outline-offset:2px; }
  .punkte{ display:flex; gap:7px; }
  .punkte button{
    width:13px; height:13px; border-radius:50%;
    border:1.5px solid var(--gruen); background:transparent;
    cursor:pointer; padding:0;
  }
  .punkte button[aria-current="step"]{ background:var(--gruen); }
  .punkte button:focus-visible{ outline:3px solid var(--pollen); outline-offset:2px; }

  footer{ text-align:center; font-size:.85rem; color:var(--gruen-hell); padding:14px 10px 26px; }
  footer > a{ color:inherit; }

  /* Beschriftungs-Ebenen: nur auf der passenden Zoomstufe sichtbar */
  .label-ebene{ opacity:0; transition:opacity .8s ease; }
  [data-ebene="1"] #labels-1{ opacity:1; }
  [data-ebene="2"] #labels-2{ opacity:1; }
  [data-ebene="3"] #labels-3{ opacity:1; }
  [data-ebene="4"] #labels-4{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

<script>
(function(){
  var ebenen = [
    { cx:450, cy:280, w:900,
      titel:"Die ganze Pflanze", mass:"etwa 60 cm",
      text:"Eine blühende Pflanze auf der Wiese. Von außen sehen wir Stängel, Blätter und die Blüte. Doch das Spannendste spielt sich im Verborgenen ab — tippe auf „Näher heran“ und schau hinein." },
    { cx:450, cy:195, w:430,
      titel:"Die Blüte im Querschnitt", mass:"etwa 8 cm",
      text:"Aufgeschnitten zeigt die Blüte ihren Bauplan: Bunte Blütenblätter locken Insekten an, die Staubblätter tragen den gelben Pollen — und in der Mitte steht der Stempel, das Herzstück der Blüte." },
    { cx:450, cy:202, w:330,
      titel:"Der Stempel", mass:"etwa 5 cm",
      text:"Der Stempel besteht aus drei Teilen: Oben die klebrige Narbe, auf der die Pollenkörner landen. Darunter der Griffel — durch ihn wächst später der Pollenschlauch. Und ganz unten der bauchige Fruchtknoten." },
    { cx:450, cy:252, w:150,
      titel:"Im Fruchtknoten", mass:"etwa 2 cm",
      text:"Im Inneren des Fruchtknotens liegen die Samenanlagen, fest angewachsen an der Mittelwand. Jede einzelne kann nach der Befruchtung zu einem Samen werden — und der Fruchtknoten selbst zur Frucht." },
    { cx:437, cy:248, w:48,
      titel:"Die Samenanlage", mass:"etwa 3 mm",
      text:"Kaum einen Millimeter groß und doch perfekt ausgestattet: Schutzhüllen umgeben den Embryosack, darin wartet die Eizelle. Eine winzige Öffnung weist dem Pollenschlauch den Weg — trifft er ein, kommt es zur Befruchtung, und ein neues Pflanzenleben beginnt." }
  ];

  var svg = document.getElementById("svg");
  var wrapper = document.getElementById("wrapper");
  var erkl = document.getElementById("erklaerung");
  var titelEl = document.getElementById("ebene-titel");
  var textEl = document.getElementById("ebene-text");
  var massEl = document.getElementById("massstab");
  var btnH = document.getElementById("btn-heraus");
  var btnR = document.getElementById("btn-hinein");
  var punkte = document.getElementById("punkte");
  var SEITEN = 900 / 560; /* Seitenverhältnis bleibt fest */
  var aktuell = 0;
  var animId = null;
  var ruhig = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  ebenen.forEach(function(s, i){
    var p = document.createElement("button");
    p.type = "button";
    p.setAttribute("aria-label", "Zoomstufe " + (i+1) + ": " + s.titel);
    p.addEventListener("click", function(){ gehe(i); });
    punkte.appendChild(p);
  });

  function setzeViewBox(cx, cy, w){
    var h = w / SEITEN;
    svg.setAttribute("viewBox", (cx - w/2) + " " + (cy - h/2) + " " + w + " " + h);
  }

  function fahreZu(ziel){
    if (animId) cancelAnimationFrame(animId);
    var start = ebenen[aktuellAlt], ende = ebenen[ziel];
    if (ruhig){ setzeViewBox(ende.cx, ende.cy, ende.w); return; }
    var dauer = 1500, t0 = null;
    function schritt(zeit){
      if (!t0) t0 = zeit;
      var t = Math.min(1, (zeit - t0) / dauer);
      var e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; /* sanft rein und raus */
      /* Breite geometrisch mischen — fühlt sich beim Zoomen natürlich an */
      var w = start.w * Math.pow(ende.w / start.w, e);
      var cx = start.cx + (ende.cx - start.cx) * e;
      var cy = start.cy + (ende.cy - start.cy) * e;
      setzeViewBox(cx, cy, w);
      if (t < 1) animId = requestAnimationFrame(schritt);
    }
    animId = requestAnimationFrame(schritt);
  }

  var aktuellAlt = 0;
  function gehe(n){
    n = Math.max(0, Math.min(ebenen.length - 1, n));
    aktuellAlt = aktuell;
    aktuell = n;
    wrapper.dataset.ebene = n;
    fahreZu(n);

    titelEl.textContent = ebenen[n].titel;
    textEl.textContent = ebenen[n].text;
    massEl.textContent = ebenen[n].mass;
    erkl.classList.remove("wechsel");
    void erkl.offsetWidth;
    erkl.classList.add("wechsel");

    btnH.disabled = (n === 0);
    btnR.textContent = (n === ebenen.length - 1) ? "Zur Übersicht" : "Näher heran";
    /* Letzte Zoomstufe erreicht → Flora-Forscherpass: volle 3 Blätter */
    if (n === ebenen.length - 1) { try{var _K="mibaso.flora.expedition",_d=JSON.parse(localStorage.getItem(_K)||"{}");if(!_d.bluete||!_d.bluete.done){_d.bluete={blaetter:3,done:true,ts:Date.now()};localStorage.setItem(_K,JSON.stringify(_d));}}catch(e){} }

    var dots = punkte.children;
    for (var i = 0; i < dots.length; i++){
      if (i === n) dots[i].setAttribute("aria-current", "step");
      else dots[i].removeAttribute("aria-current");
    }
  }

  btnH.addEventListener("click", function(){ gehe(aktuell - 1); });
  btnR.addEventListener("click", function(){
    gehe(aktuell === ebenen.length - 1 ? 0 : aktuell + 1);
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") gehe(aktuell + 1);
    if (e.key === "ArrowLeft") gehe(aktuell - 1);
  });

  setzeViewBox(ebenen[0].cx, ebenen[0].cy, ebenen[0].w);
  gehe(0);
})();
</script>
