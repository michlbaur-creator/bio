<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5d6f7b">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flora Mibaso">
<title>Pflanzen ordnen – eine kleine Systematik</title>
<link rel="stylesheet" href="../assets/style.css">
<meta name="description" content="Drill-Down durch die Pflanzensystematik: Moose, Farne, Nacktsamer, Bedecktsamer – bis hinunter zu den Familien.">
<style>
  :root{
    --ordnen:#5d6f7b;
    --ordnen-tief:#3f4d57;
    --ordnen-bg:#e8edf1;
    --ordnen-rand:#cdd6dd;
  }

  body{ background:var(--beige-hell, #f8f3e7); }

  #sys-root{
    max-width:760px;
    margin:0 auto;
    padding:18px 14px 80px;
  }

  /* Page-Header */
  .sys-titel{
    font-family:Georgia, serif;
    text-align:center;
    color:var(--ordnen-tief);
    margin:6px 0 4px;
    font-size:1.55rem;
    line-height:1.2;
    letter-spacing:.01em;
  }
  .sys-untertitel{
    text-align:center;
    color:#6b5340;
    font-style:italic;
    margin:0 0 18px;
    font-size:.97rem;
  }

  /* Breadcrumb + Zurück */
  .sys-nav{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 14px;
    padding:10px 12px;
    background:#fff;
    border:1px solid var(--ordnen-rand);
    border-radius:12px;
    font-size:.92rem;
  }
  .sys-zurueck{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--ordnen-bg);
    border:1px solid var(--ordnen-rand);
    color:var(--ordnen-tief);
    padding:6px 12px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    font-size:inherit;
  }
  .sys-zurueck:hover{ background:#d9e1e8; }
  .sys-zurueck[disabled]{ opacity:.4; cursor:default; }

  .sys-crumb{
    color:var(--ordnen-tief);
    line-height:1.4;
  }
  .sys-crumb .pfeil{ color:#9aa7b1; margin:0 4px; }
  .sys-crumb a{
    color:var(--ordnen);
    text-decoration:none;
    border-bottom:1px dotted var(--ordnen);
    cursor:pointer;
  }
  .sys-crumb a:hover{ color:var(--ordnen-tief); border-bottom-style:solid; }
  .sys-crumb b{ color:var(--ordnen-tief); }

  /* Steckbrief-Karte oben */
  .sys-info{
    background:#fff;
    border:1px solid var(--ordnen-rand);
    border-radius:14px;
    padding:16px 18px;
    margin:0 0 18px;
    box-shadow:0 1px 4px rgba(63,77,87,.05);
  }
  .sys-info h2{
    margin:0 0 4px;
    color:var(--ordnen-tief);
    font-size:1.25rem;
    font-family:Georgia, serif;
    line-height:1.2;
  }
  .sys-info .latein{
    color:#8b97a0;
    font-style:italic;
    font-size:.92rem;
    margin:0 0 8px;
  }
  .sys-info p{
    margin:8px 0 0;
    color:#3a3a3a;
    line-height:1.5;
    font-size:.98rem;
  }
  .sys-info .arten-zahl{
    display:inline-block;
    margin-top:10px;
    background:var(--ordnen-bg);
    color:var(--ordnen-tief);
    border-radius:8px;
    padding:4px 10px;
    font-size:.88rem;
    font-weight:600;
  }

  /* Aufforderung „Tippe …" */
  .sys-hinweis{
    text-align:center;
    color:#7a6d5c;
    font-style:italic;
    margin:0 4px 12px;
    font-size:.95rem;
  }

  /* Kachelraster */
  .sys-kacheln{
    display:grid;
    gap:12px;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  }
  .sys-kachel{
    background:#fff;
    border:1px solid var(--ordnen-rand);
    border-radius:14px;
    padding:14px 14px 12px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
    font:inherit;
    color:inherit;
  }
  .sys-kachel:hover, .sys-kachel:focus-visible{
    transform:translateY(-2px);
    border-color:var(--ordnen);
    box-shadow:0 6px 16px rgba(93,111,123,.18);
    outline:none;
  }
  .sys-kachel .emoji{
    font-size:2.2rem;
    line-height:1;
    margin-bottom:6px;
  }
  .sys-kachel .foto{
    width:84px;
    height:84px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:8px;
    border:1px solid var(--ordnen-rand);
    background:#f4f0e8;
  }
  .sys-kachel .label{
    color:var(--ordnen-tief);
    font-weight:600;
    font-size:.86rem;
    line-height:1.2;
    overflow-wrap:anywhere;
    hyphens:auto;
    -webkit-hyphens:auto;
  }
  .sys-kachel .latein{
    color:#8b97a0;
    font-style:italic;
    font-size:.74rem;
    margin-top:2px;
    line-height:1.15;
    overflow-wrap:anywhere;
  }

  /* Tool-Link auf Familien-Ebene */
  .sys-tool-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ordnen);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    margin-top:14px;
    font:inherit;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(93,111,123,.25);
  }
  .sys-tool-link:hover{ background:var(--ordnen-tief); }
  .sys-tool-link .arrow{ font-size:1.05rem; line-height:1; }

  /* Wenn ein Knoten keine Kinder hat, Hinweis ausblenden */
  .keine-kinder .sys-hinweis{ display:none; }

  @media (max-width:380px){
    .sys-kacheln{ grid-template-columns:repeat(2, 1fr); }
    .sys-kachel{ padding:12px 10px 10px; }
    .sys-kachel .foto{ width:64px; height:64px; }
    .sys-kachel .label{ font-size:.82rem; }
    .sys-kachel .latein{ font-size:.70rem; }
  }

  /* Zurück-zur-Startseite-Link */
  .sys-home{
    display:inline-flex;
    align-items:center;
    gap:4px;
    color:var(--braun-mittel, #6b5340);
    text-decoration:none;
    font-size:.92rem;
    margin:8px 0 6px;
  }
  .sys-home:hover{ color:var(--braun-dunkel, #3a2a1b); }
</style>
</head>

<header class="top">

  <div class="sys-info" id="sys-info"></div>

</main>

/* ---------- Rendering ---------- */

const elNav      = document.getElementById('sys-nav');
const elZurueck  = document.getElementById('sys-zurueck');
const elCrumb    = document.getElementById('sys-crumb');
const elInfo     = document.getElementById('sys-info');
const elKacheln  = document.getElementById('sys-kacheln');
const elHinweis  = document.getElementById('sys-hinweis');
const elMain     = document.getElementById('sys-root');

function pfad(id){
  // Liste aller Vorfahren von root bis id
  const aufwaerts = [];
  let cur = id;
  while (cur){
    aufwaerts.unshift(cur);
    cur = TREE[cur] && TREE[cur].parent;
  }
  return aufwaerts;
}

function render(id){
  const node = TREE[id] || TREE.root;
  const p = pfad(id);

  // Breadcrumb
  elCrumb.innerHTML = '';
  p.forEach((nid, i) => {
    const n = TREE[nid];
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'pfeil';
      sep.textContent = '›';
      elCrumb.appendChild(sep);
    }
    if (i === p.length - 1) {
      const b = document.createElement('b');
      b.textContent = n.label;
      elCrumb.appendChild(b);
    } else {
      const a = document.createElement('a');
      a.textContent = n.label;
      a.addEventListener('click', () => navigiere(nid));
      elCrumb.appendChild(a);
    }
  });

  // Zurück-Button
  if (p.length > 1) {
    elZurueck.removeAttribute('disabled');
    elZurueck.onclick = () => navigiere(p[p.length - 2]);
  } else {
    elZurueck.setAttribute('disabled', 'disabled');
    elZurueck.onclick = null;
  }

  // Steckbrief-Box
  elInfo.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = node.titel || node.label;
  elInfo.appendChild(h2);
  if (node.latein){
    const lat = document.createElement('div');
    lat.className = 'latein';
    lat.textContent = node.latein;
    elInfo.appendChild(lat);
  }
  if (node.text){
    const p_ = document.createElement('p');
    p_.textContent = node.text;
    elInfo.appendChild(p_);
  }

  // Familien-Link ins Bestimmungstool
  if (node.familie){
    const link = document.createElement('a');
    link.className = 'sys-tool-link';
    link.href = '../bestimmen.html?familie=' + encodeURIComponent(node.familie);
    link.innerHTML = '<span>Arten dieser Familie im Bestimmungstool zeigen</span><span class="arrow">›</span>';
    elInfo.appendChild(link);
  }

  // Kacheln
  elKacheln.innerHTML = '';
  const kids = node.children || [];
  if (kids.length === 0){
    elMain.classList.add('keine-kinder');
  } else {
    elMain.classList.remove('keine-kinder');
    kids.forEach(kid => {
      const k = TREE[kid];
      if (!k) return;
      const btn = document.createElement('button');
      btn.className = 'sys-kachel';
      btn.type = 'button';
      btn.onclick = () => navigiere(kid);

      if (k.foto){
        const img = document.createElement('img');
        img.className = 'foto';
        img.src = k.foto;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = () => {
          // Foto nicht vorhanden → durch Emoji ersetzen
          const em = document.createElement('div');
          em.className = 'emoji';
          em.textContent = k.emoji || '🌿';
          img.replaceWith(em);
        };
        btn.appendChild(img);
      } else if (k.emoji){
        const em = document.createElement('div');
        em.className = 'emoji';
        em.textContent = k.emoji;
        btn.appendChild(em);
      }
      const lab = document.createElement('div');
      lab.className = 'label';
      lab.textContent = k.label;
      btn.appendChild(lab);

      if (k.latein){
        const lat = document.createElement('div');
        lat.className = 'latein';
        lat.textContent = k.latein;
        btn.appendChild(lat);
      }
      elKacheln.appendChild(btn);
    });
  }

  // Nach oben scrollen
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function navigiere(id, push = true){
  if (push) {
    history.pushState({ id }, '', '#' + id);
  }
  render(id);
}

// Browser-Back/Forward
window.addEventListener('popstate', (e) => {
  const id = (e.state && e.state.id) || (location.hash ? location.hash.slice(1) : 'root');
  if (TREE[id]) render(id);
  else render('root');
});

// Erstaufruf — Hash beachten, falls jemand direkt verlinkt
const start = location.hash ? location.hash.slice(1) : 'root';
const initial = TREE[start] ? start : 'root';
history.replaceState({ id: initial }, '', '#' + initial);
render(initial);
</script>
