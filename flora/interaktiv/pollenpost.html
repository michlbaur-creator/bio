<script>
"use strict";
/* ============ Spielregeln (ohne Anzeige) ============
   Wiesenplan mit 7 × 5 Feldern. Ein Flug kostet so viel Nektar, wie er Felder weit ist.
   Pollen trägt man immer nur von EINER Art. Er bestäubt nur eine andere Blüte derselben Art,
   deren Narbe bereit ist. Gewertet wird jede bestäubte Blüte – daraus werden Samen. */
const BREIT = 7, HOCH = 5, NACHWUCHS = 7, STREIFEN = 5;   // Spalten 5 und 6 sind der Wegrand: Dort wird nicht gemäht
const NEST = 2 * BREIT + 6;
const BLUETEN = {
  loewe:       { n: "Löwenzahn",          nektar: 2, info: "Ein Korb aus über hundert Einzelblüten. Wer ihn besucht, bestäubt viele auf einmal." },
  schaum:      { n: "Wiesen-Schaumkraut", nektar: 1, info: "Blüht im April zartlila auf feuchten Wiesen. Der Aurorafalter legt hier seine Eier ab." },
  hahn:        { n: "Hahnenfuß",          nektar: 1, info: "Die glänzenden Blütenblätter spiegeln das Licht. So leuchtet er Bestäubern schon von Weitem entgegen." },
  gaense:      { n: "Gänseblümchen",      nektar: 1, info: "Schließt sich nachts und bei Regen – so bleibt der Pollen trocken." },
  schluessel:  { n: "Schlüsselblume",     nektar: 2, info: "Eine der ersten Nektarquellen im Jahr. Hummelköniginnen tanken hier nach dem Winter auf." },
  glocke:      { n: "Glockenblume",       nektar: 2, wechsel: true, info: "Erst Pollen, dann Narbe: Zuerst gibt sie Pollen ab, ein paar Tage später öffnet sich die Narbe. So bestäubt sie sich nicht selbst." },
  witwe:       { n: "Witwenblume",        nektar: 2, wechsel: true, info: "Auch sie ist erst Pollen-Spender und dann Pollen-Empfänger. Ihre lila Köpfchen sind ein Magnet für Falter und Hummeln." },
  storch:      { n: "Storchschnabel",     nektar: 2, wechsel: true, info: "Erst reifen die Staubblätter, dann spreizt sich die Narbe. Die Früchte sehen aus wie ein Storchenschnabel." },
  salbei:      { n: "Wiesensalbei",       nektar: 3, info: "Hebel-Trick: Drückt die Hummel gegen eine kleine Platte, klappen die Staubblätter herunter und tupfen ihr Pollen auf den Rücken." },
  rotklee:     { n: "Rotklee",            nektar: 3, info: "Der Nektar liegt tief in langen Röhren. Vor allem Hummeln bestäuben ihn – ohne sie gibt es kaum Kleesamen." },
  marg:        { n: "Margerite",          nektar: 1, info: "Ein Körbchen aus vielen Blüten: Landeplatz für Käfer, Fliegen und Bienen. Nachts klappt sie die weißen Strahlen hoch." },
  nachtkerze:  { n: "Nachtkerze",         nektar: 3, nacht: true, info: "Öffnet sich in der Abenddämmerung – in nur wenigen Minuten. Hell und duftend lockt sie Nachtfalter an." },
  lichtnelke:  { n: "Weiße Lichtnelke",   nektar: 2, nacht: true, getrennt: true, info: "Es gibt Pflanzen mit nur Pollen und Pflanzen mit nur Narben. Pollen muss also immer von Pflanze zu Pflanze getragen werden." },
  seifenkraut: { n: "Seifenkraut",        nektar: 2, nacht: true, wechsel: true, info: "Duftet abends besonders stark. Den Nektar tief in der Röhre erreichen nur Falter mit langem Rüssel." }
};
const LEVEL = [
  { id: "fruehling", tier: "hummel", em: "🌼", titel: "Die Frühlingswiese", kurz: "Hummelkönigin", zeit: "Ein Apriltag", was: "Pollen bestäubt nur die eigene Art",
    motto: "Fünf Blumen blühen um die Wette – aber Pollen hilft nur der eigenen Art.",
    intro: "Du bist eine Hummelkönigin. Wo du landest, bleibt Pollen an deinem Pelz hängen. Trag ihn zu einer anderen Blüte derselben Art – dann ist sie bestäubt und bildet Samen. Tippe auf ein Feld, um hinzufliegen.",

        <div class="anz"><span class="lab">🟡 Pollen: <b id="pArt">keiner</b></span><div class="pips" id="pL"></div></div>
        <div class="anz nestanz"><span class="lab">✅ Bestäubt: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div></div>

  const biene = $("#biene"), fx = $("#fx");
  function himmel() {

    const sx = falter ? 40 + 620 * Math.min(1, st.zug / (L.dunkel + 1)) : 40 + 620 * p, sy = falter ? 30 + 50 * Math.min(1, st.zug / (L.dunkel + 1)) : 56 - 36 * Math.sin(Math.PI * p);
    const abend = falter ? Math.min(1, st.zug / L.dunkel) : Math.max(0, (p - .75) * 4);

      ${rn || regenZeigen ? `<g transform="translate(${(sx + (regenZeigen ? 0 : rn * 46)).toFixed(0)} ${(sy + 4).toFixed(0)})"><ellipse cx="0" cy="6" rx="34" ry="13" fill="#5b6675"/><circle cx="-14" cy="-2" r="13" fill="#6a7686"/><circle cx="8" cy="-7" r="16" fill="#5b6675"/><circle cx="24" cy="2" r="10" fill="#6a7686"/></g>` : ""}

  function pult() {

    $("#pE").innerHTML = Array.from({ length: L.emax }, (x, k) => `<i class="${k < st.energie ? "an" : ""}"></i>`).join(""); $("#pE").classList.toggle("knapp", st.energie <= 2);

  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 30); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }

  function ende() {

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
