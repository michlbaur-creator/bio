<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flora Mibaso">
<title>Ein Jahr im Apfelbaum — Schritt 4 des Kreislaufs</title>
<style>
  :root{
    --gruen:#2F4F3E;
    --gruen-hell:#4A6B58;
    --creme:#F7F3E8;
    --karte:#FFFDF6;
    --linie:#D9D0BC;
    --text:#33402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--creme);
    color:var(--text);
    line-height:1.55;
  }
  header{
    background:var(--gruen);
    color:#F4EFE2;
    padding:18px 16px 16px;
    text-align:center;
  }
  header h1{ margin:0; font-size:1.45rem; font-weight:normal; letter-spacing:.5px; }
  header p{ margin:6px 0 0; font-size:.95rem; font-style:italic; opacity:.85; }
  main{ max-width:760px; margin:0 auto; padding:18px 12px 30px; }
  .karte{
    background:var(--karte);
    border:1px solid var(--linie);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(47,79,62,.08);
  }
  .buehne{ display:block; width:100%; height:auto; }

  /* ---------- Schieberegler ---------- */
  .regler{ padding:16px 22px 4px; border-top:1px solid var(--linie); }
  .monat{
    text-align:center;
    font-size:1.05rem;
    color:var(--gruen);
    margin:0 0 6px;
  }
  .monat strong{ font-weight:normal; font-size:1.2rem; }
  /* Gut sichtbarer Regler-Knopf in warmem Rotbraun */
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:34px;
    background:transparent;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    margin-top:-9px;
    cursor:grab;
  }
  input[type="range"]::-webkit-slider-thumb:active{ cursor:grabbing; }
  input[type="range"]::-moz-range-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-moz-range-thumb{
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    cursor:grab;
  }
  input[type="range"]:focus-visible{ outline:3px solid #E3B23C; outline-offset:2px; border-radius:6px; }
  .jahreszeiten{
    display:flex;
    justify-content:space-between;
    margin-top:2px;
  }
  /* Jahreszeiten als direkte Sprungmarken */
  .jz-link{
    background:none;
    border:none;
    padding:2px 4px;
    font-family:inherit;
    font-size:.85rem;
    color:var(--gruen-hell);
    font-style:italic;
    cursor:pointer;
    border-bottom:1px dotted var(--gruen-hell);
    transition:color .15s;
  }
  .jz-link:hover, .jz-link:focus-visible{ color:#9c3b2a; border-bottom-color:#9c3b2a; outline:none; }

  /* ---------- Textfeld ---------- */
  .erklaerung{ padding:12px 22px 18px; min-height:108px; }
  .erklaerung h2{ margin:0 0 6px; font-size:1.15rem; color:var(--gruen); font-weight:normal; }
  .erklaerung p{ margin:0; font-size:1rem; }
  .erklaerung.wechsel{ animation:einblenden .4s ease; }
  @keyframes einblenden{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }

  footer{ text-align:center; font-size:.85rem; color:var(--gruen-hell); padding:14px 10px 26px; }
  footer > a{ color:inherit; }

  /* fallende Blätter */
  .fallblatt{ animation:fallen 5s linear infinite; }
  @keyframes fallen{
    0%   { transform:translate(0,0) rotate(0deg); }
    25%  { transform:translate(-18px,60px) rotate(70deg); }
    50%  { transform:translate(14px,125px) rotate(150deg); }
    75%  { transform:translate(-12px,190px) rotate(230deg); }
    100% { transform:translate(8px,255px) rotate(320deg); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="titelblock">
      <h1><a href="../index.html">Flora Mibaso</a></h1>
      <div class="untertitel">Michael Baurs digitale Naturwerkstatt für die Hosentasche.</div>
    </div>
  </div>
</header>
<a class="back" href="kreislauf.html" style="display:inline-block;margin:12px 14px 0;color:#6b5340;text-decoration:none;font-size:.95rem;">‹ Zurück zum Kreislauf</a>

<main>
  <div class="karte">
    <svg class="buehne" id="svg" viewBox="0 0 900 560" role="img"
         aria-label="Grafik eines Apfelbaums, der sich mit dem Schieberegler durch das Jahr verändert: Knospen, Blüten, Blätter, Früchte und Laubfall.">
      <rect id="himmel" x="0" y="0" width="900" height="480" fill="#EDF2F0"/>
      <circle id="sonne" cx="780" cy="90" r="38" fill="#F2D98B" opacity=".8"/>
      <rect id="boden" x="0" y="480" width="900" height="80" fill="#A8BC8A"/>
      <line x1="0" y1="480" x2="900" y2="480" stroke="#8FA876" stroke-width="3"/>

      <!-- Stamm und Äste -->
      <g stroke="#6E513B" fill="none" stroke-linecap="round">
        <path d="M450,482 C 446,420 452,380 448,330" stroke-width="26"/>
        <path d="M448,360 C 410,330 370,300 340,265" stroke-width="13"/>
        <path d="M448,345 C 490,310 530,290 575,265" stroke-width="13"/>
        <path d="M448,332 C 440,290 435,250 430,215" stroke-width="11"/>
        <path d="M340,265 C 320,250 305,240 330,250" stroke-width="7"/>
        <path d="M430,215 C 410,195 470,200 490,185" stroke-width="7"/>
        <path d="M575,265 C 595,255 605,250 600,268" stroke-width="7"/>
      </g>

      <!-- vom Skript gefüllte Ebenen -->
      <g id="g-blaetter"></g>
      <g id="g-knospen"></g>
      <g id="g-blueten"></g>
      <g id="g-fruechte"></g>
      <g id="g-fallend" opacity="0"></g>
      <g id="g-schnee" opacity="0">
        <ellipse cx="450" cy="484" rx="240" ry="10" fill="#FFFFFF" opacity=".85"/>
        <ellipse cx="150" cy="492" rx="120" ry="8" fill="#FFFFFF" opacity=".7"/>
        <ellipse cx="760" cy="492" rx="110" ry="8" fill="#FFFFFF" opacity=".7"/>
      </g>
    </svg>

    <div class="regler">
      <p class="monat">Monat: <strong id="monat">Januar</strong></p>
      <input type="range" id="slider" min="0" max="100" value="0" step="0.5"
             aria-label="Jahresverlauf von Januar bis Dezember">
      <div class="jahreszeiten">
        <button class="jz-link" data-pos="3"  type="button">Winter</button>
        <button class="jz-link" data-pos="33" type="button">Frühling</button>
        <button class="jz-link" data-pos="66" type="button">Sommer</button>
        <button class="jz-link" data-pos="85" type="button">Herbst</button>
        <button class="jz-link" data-pos="98" type="button">Winter</button>
      </div>
    </div>

    <div class="erklaerung" id="erklaerung" aria-live="polite">
      <h2 id="phase-titel"></h2>
      <p id="phase-text"></p>
    </div>
  </div>
</main>

<script>
(function(){
  /* ---------- Hilfsfunktionen ---------- */
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function rampe(t, a, b){ return clamp01((t - a) / (b - a)); }
  function mischeFarbe(h1, h2, t){
    var a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    var r = Math.round(((a>>16)&255) + (((b>>16)&255) - ((a>>16)&255)) * t);
    var g = Math.round(((a>>8)&255)  + (((b>>8)&255)  - ((a>>8)&255))  * t);
    var bl= Math.round((a&255)       + ((b&255)       - (a&255))       * t);
    return "rgb(" + r + "," + g + "," + bl + ")";
  }
  var NS = "http://www.w3.org/2000/svg";
  function el(name, attrs, parent){
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  /* ---------- Positionen in der Baumkrone ---------- */
  var krone = [
    [330,255],[300,232],[365,205],[420,180],[470,168],[520,182],
    [575,210],[610,255],[585,305],[535,330],[480,345],[425,340],
    [370,318],[335,290],[455,300],[505,280],[400,250],[545,250],
    [445,220],[355,260]
  ];
  var zweigspitzen = [
    [302,238],[332,250],[368,208],[428,185],[490,172],[548,196],
    [600,250],[605,270],[455,200],[395,225],[520,235],[350,275]
  ];
  var fruchtplaetze = [
    [350,270],[415,235],[480,205],[545,240],[580,290],[455,310],
    [385,300],[515,310]
  ];

  /* ---------- Elemente erzeugen ---------- */
  var blaetter = krone.map(function(p, i){
    return el("ellipse", {
      cx:p[0], cy:p[1], rx:40, ry:30,
      transform:"rotate(" + ((i*37)%50 - 25) + " " + p[0] + " " + p[1] + ")"
    }, document.getElementById("g-blaetter"));
  });

  var knospen = zweigspitzen.map(function(p){
    return el("circle", { cx:p[0], cy:p[1], r:4, fill:"#9C4A3C", stroke:"#6E2F26", "stroke-width":1 },
      document.getElementById("g-knospen"));
  });

  var blueten = zweigspitzen.map(function(p){
    var g = el("g", { transform:"translate(" + p[0] + " " + p[1] + ")" },
      document.getElementById("g-blueten"));
    for (var w = 0; w < 5; w++){
      var a = w / 5 * Math.PI * 2;
      el("circle", { cx:Math.cos(a)*6, cy:Math.sin(a)*6, r:5, fill:"#FBE6EA", stroke:"#E2A7B4", "stroke-width":1 }, g);
    }
    el("circle", { cx:0, cy:0, r:3, fill:"#E3B23C" }, g);
    return g;
  });

  var fruechte = fruchtplaetze.map(function(p, i){
    var g = el("g", {}, document.getElementById("g-fruechte"));
    var apfel = el("circle", { cx:p[0], cy:p[1], r:5 }, g);
    el("line", { x1:p[0], y1:p[1]-5, x2:p[0], y2:p[1]-11, stroke:"#6E513B", "stroke-width":2 }, g);
    return { g:g, apfel:apfel, x:p[0], y:p[1], d:(i%4) * 2.2 };
  });

  /* fallende Blätter */
  var fallend = document.getElementById("g-fallend");
  [[360,260],[430,230],[500,210],[555,260],[470,300],[395,290]].forEach(function(p, i){
    var L = el("ellipse", { cx:p[0], cy:p[1], rx:9, ry:5, fill:"#C77A35", "class":"fallblatt" }, fallend);
    L.style.animationDelay = (i * 0.8) + "s";
    L.style.animationDuration = (4.4 + i * 0.5) + "s";
  });

  /* ---------- Texte ---------- */
  var phasen = [
    { bis:10,  titel:"Winterruhe",
      text:"Der Baum ruht. Kein Blatt, keine Blüte — aber er lebt: In Stamm und Wurzeln sind Vorräte gespeichert, und an den Zweigen sitzen schon die Knospen für das neue Jahr." },
    { bis:24,  titel:"Die Knospen schwellen",
      text:"Es wird wärmer, die Tage werden länger. Die rotbraunen Knospen schwellen an — gut verpackt warten darin Blüten und Blätter auf ihren Auftritt." },
    { bis:42,  titel:"Blütezeit",
      text:"Die Knospen brechen auf: Der Baum steht in voller Blüte. Jetzt sind Bienen und andere Insekten gefragt — sie tragen den Pollen von Blüte zu Blüte und sorgen für die Bestäubung." },
    { bis:58,  titel:"Junge Früchte",
      text:"Die Blütenblätter sind gefallen, dafür ist die Krone jetzt dicht belaubt. Aus den bestäubten Blüten wachsen kleine grüne Äpfel heran — noch hart und sauer." },
    { bis:76,  titel:"Sommer und Reife",
      text:"Die Blätter arbeiten auf Hochtouren: Mit Sonnenlicht stellen sie Zucker her, den der Baum in die Früchte schickt. Die Äpfel werden größer, süßer — und langsam rot." },
    { bis:93,  titel:"Ernte und Laubfall",
      text:"Die reifen Äpfel fallen zu Boden oder werden gepflückt. Der Baum holt die letzten Nährstoffe aus den Blättern zurück — sie färben sich gelb und braun und segeln davon." },
    { bis:100, titel:"Zurück zur Ruhe",
      text:"Kahl steht der Baum im ersten Schnee. Was nach Stillstand aussieht, ist kluges Energiesparen — und an den Zweigen sitzen längst wieder die Knospen fürs nächste Frühjahr." }
  ];
  var monate = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

  var slider = document.getElementById("slider");
  var erkl = document.getElementById("erklaerung");
  var titelEl = document.getElementById("phase-titel");
  var textEl = document.getElementById("phase-text");
  var monatEl = document.getElementById("monat");
  var letztePhase = -1;

  /* ---------- Alles aus dem Reglerwert ableiten ---------- */
  function male(){
    var t = parseFloat(slider.value);

    /* Winteranteil (Anfang und Ende des Jahres) */
    var winter = Math.max(1 - rampe(t, 4, 14), rampe(t, 90, 99));

    /* Himmel, Sonne, Boden, Schnee */
    document.getElementById("himmel").setAttribute("fill", mischeFarbe("#F4F8EA", "#EDF2F0", winter));
    document.getElementById("sonne").setAttribute("opacity", 0.35 + 0.55 * (1 - winter));
    document.getElementById("boden").setAttribute("fill", mischeFarbe("#A8BC8A", "#E9EDE6", winter));
    document.getElementById("g-schnee").setAttribute("opacity", rampe(winter, 0.55, 1));

    /* Knospen: erscheinen im Vorfrühling, gehen in Blüten über */
    var kAuf = rampe(t, 8, 16), kZu = 1 - rampe(t, 26, 34);
    knospen.forEach(function(k, i){
      var o = Math.min(kAuf, kZu);
      k.setAttribute("opacity", o);
      k.setAttribute("r", 2.5 + 3 * rampe(t, 8, 24) );
    });

    /* Blüten: kurze, prächtige Phase */
    var bAuf = rampe(t, 24, 31), bZu = 1 - rampe(t, 40, 48);
    blueten.forEach(function(b, i){
      var vers = (i % 3) * 1.5;
      var o = Math.min(rampe(t, 24 + vers, 31 + vers), bZu);
      b.setAttribute("opacity", o);
    });

    /* Blätter: Farbe und Deckkraft */
    var frisch = "#8AB868", sommer = "#4F7E3E", herbst1 = "#D9913C", herbst2 = "#B65C2B";
    blaetter.forEach(function(b, i){
      var vers = (i % 5) - 2; /* leichte Streuung */
      var auf = rampe(t, 30 + vers, 42 + vers);
      var ab  = 1 - rampe(t, 84 + vers, 95 + vers);
      b.setAttribute("opacity", Math.min(auf, ab));
      var farbe;
      if (t < 58){
        farbe = mischeFarbe(frisch, sommer, rampe(t, 34, 58));
      } else {
        var h = rampe(t, 70 + vers, 88 + vers);
        farbe = mischeFarbe(sommer, (i % 2 ? herbst1 : herbst2), h);
      }
      b.setAttribute("fill", farbe);
    });

    /* Früchte: wachsen, färben sich, fallen */
    fruechte.forEach(function(f){
      var auf = rampe(t, 44 + f.d * 0.5, 52 + f.d * 0.5);
      var weg = 1 - rampe(t, 90, 96);
      f.g.setAttribute("opacity", Math.min(auf, weg));
      f.apfel.setAttribute("r", 4 + 8 * rampe(t, 46, 76));
      f.apfel.setAttribute("fill", mischeFarbe("#7FA85A", "#C84B3A", rampe(t, 56, 76)));
      f.apfel.setAttribute("stroke", "#7E3A2D");
      f.apfel.setAttribute("stroke-width", 1);
      /* Fallen im Herbst */
      var fall = rampe(t, 78 + f.d, 86 + f.d);
      var dy = (472 - f.y) * fall * fall; /* beschleunigt nach unten */
      f.g.setAttribute("transform", "translate(0 " + dy.toFixed(1) + ")");
    });

    /* fallende Blätter nur im Herbst zeigen */
    var laubfall = Math.min(rampe(t, 80, 85), 1 - rampe(t, 93, 97));
    fallend.setAttribute("opacity", laubfall);

    /* Monat */
    monatEl.textContent = monate[Math.min(11, Math.floor(t / 100 * 12))];

    /* Phasentext */
    var p = 0;
    while (phasen[p].bis < t) p++;
    if (p !== letztePhase){
      letztePhase = p;
      titelEl.textContent = phasen[p].titel;
      textEl.textContent = phasen[p].text;
      erkl.classList.remove("wechsel");
      void erkl.offsetWidth;
      erkl.classList.add("wechsel");
    }
  }

  slider.addEventListener("input", male);
  document.addEventListener("keydown", function(e){
    if (document.activeElement === slider) return; /* Regler regelt selbst */
    if (e.key === "ArrowRight") { slider.value = Math.min(100, parseFloat(slider.value) + 2); male(); }
    if (e.key === "ArrowLeft")  { slider.value = Math.max(0, parseFloat(slider.value) - 2); male(); }
  });

  /* Jahreszeiten-Sprungmarken: Klick springt zur passenden Stelle im Jahr */
  document.querySelectorAll(".jz-link").forEach(function(knopf){
    knopf.addEventListener("click", function(){
      slider.value = knopf.dataset.pos;
      male();
    });
  });

  male();
})();
</script>

<style>
  /* Embed-Modus: Wenn als iframe geladen, Flora-Header + Footer + Zurück-Link ausblenden */
  body.embed > header.top, body.embed > footer.bottom, body.embed > a.back { display:none !important; }
  body.embed { background:transparent; }
</style>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const isEmbed = params.get('embed') === '1' || window.self !== window.top;
  if (isEmbed) {
    document.body.classList.add('embed');
    // Höhe regelmäßig an Parent posten
    const sende = () => {
      const h = document.body.scrollHeight;
      window.parent.postMessage({ kreislaufHoehe: h }, '*');
    };
    window.addEventListener('load', sende);
    window.addEventListener('resize', sende);
    new MutationObserver(sende).observe(document.body, { childList:true, subtree:true, attributes:true });
    setInterval(sende, 800);
  }
})();
</script>
<footer class="bottom" style="margin-top:24px;">
  <div class="wrap footer-text">
    <p class="lizenz">© 2026 <a href="../ueber/">Michael Baur</a> · Flora Mibaso</p>
  </div>
</footer>

<script src="../assets/app.js" defer></script>
</body>
</html>
