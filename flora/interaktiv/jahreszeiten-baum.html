<style>
  :root{
    --gruen:#2F4F3E;
    --gruen-hell:#4A6B58;
    --creme:#F7F3E8;
    --karte:#FFFDF6;
    --linie:#D9D0BC;
    --text:#33402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--creme);
    color:var(--text);
    line-height:1.55;
  }
  header{
    background:var(--gruen);
    color:#F4EFE2;
    padding:18px 16px 16px;
    text-align:center;
  }
  header h1{ margin:0; font-size:1.45rem; font-weight:normal; letter-spacing:.5px; }
  header p{ margin:6px 0 0; font-size:.95rem; font-style:italic; opacity:.85; }
  main{ max-width:760px; margin:0 auto; padding:18px 12px 30px; }
  .karte{
    background:var(--karte);
    border:1px solid var(--linie);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(47,79,62,.08);
  }
  .buehne{ position:relative; width:100%; aspect-ratio:4/3; background:#26312b; }
  .buehne img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- Schieberegler ---------- */
  .regler{ padding:16px 22px 4px; border-top:1px solid var(--linie); }
  .monat{
    text-align:center;
    font-size:1.05rem;
    color:var(--gruen);
    margin:0 0 6px;
  }
  .monat strong{ font-weight:normal; font-size:1.2rem; }
  /* Gut sichtbarer Regler-Knopf in warmem Rotbraun */
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:34px;
    background:transparent;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    margin-top:-9px;
    cursor:grab;
  }
  input[type="range"]::-webkit-slider-thumb:active{ cursor:grabbing; }
  input[type="range"]::-moz-range-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-moz-range-thumb{
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    cursor:grab;
  }
  input[type="range"]:focus-visible{ outline:3px solid #E3B23C; outline-offset:2px; border-radius:6px; }
  .jahreszeiten{
    display:flex;
    justify-content:space-between;
    margin-top:2px;
  }
  /* Jahreszeiten als direkte Sprungmarken */
  .jz-link{
    background:none;
    border:none;
    padding:2px 4px;
    font-family:inherit;
    font-size:.85rem;
    color:var(--gruen-hell);
    font-style:italic;
    cursor:pointer;
    border-bottom:1px dotted var(--gruen-hell);
    transition:color .15s;
  }
  .jz-link:hover, .jz-link:focus-visible{ color:#9c3b2a; border-bottom-color:#9c3b2a; outline:none; }

  /* ---------- Textfeld ---------- */
  .erklaerung{ padding:12px 22px 18px; min-height:108px; }
  .erklaerung h2{ margin:0 0 6px; font-size:1.15rem; color:var(--gruen); font-weight:normal; }
  .erklaerung p{ margin:0; font-size:1rem; }
  .erklaerung.wechsel{ animation:einblenden .4s ease; }
  @keyframes einblenden{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }

  footer{ text-align:center; font-size:.85rem; color:var(--gruen-hell); padding:14px 10px 26px; }
  footer > a{ color:inherit; }

  /* fallende Blätter */
  .fallblatt{ animation:fallen 5s linear infinite; }
  @keyframes fallen{
    0%   { transform:translate(0,0) rotate(0deg); }
    25%  { transform:translate(-18px,60px) rotate(70deg); }
    50%  { transform:translate(14px,125px) rotate(150deg); }
    75%  { transform:translate(-12px,190px) rotate(230deg); }
    100% { transform:translate(8px,255px) rotate(320deg); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

<main>
  <div class="karte">
    <div class="buehne" id="buehne" role="img"
         aria-label="Ein Apfelbaum im Lauf des Jahres — mit dem Schieberegler von Winter über Frühling und Sommer bis zum Herbst.">

  <style>
    .jz-quiz{margin-top:16px;padding:18px 20px 20px;}
    .jz-quiz h2{margin:0 0 6px;color:var(--gruen);font-weight:normal;font-size:1.25rem;}
    .jz-quiz p{margin:0 0 12px;font-size:.98rem;}
    .jzq-start,.jzq-btn{font-family:Georgia,serif;font-size:1rem;font-weight:bold;color:#fff;background:var(--gruen);
      border:none;border-radius:22px;padding:10px 22px;cursor:pointer;}
    .jzq-start:hover,.jzq-btn:hover{background:#3f6b52;}
    .jzq-kopf{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;font-size:.85rem;color:#7a7360;

<script>
(function(){
  /* ---------- Hilfsfunktion ---------- */
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  /* ---------- Jahreszeiten-Fotos (Cross-Fade mit dem Schieber) ---------- */
  var fotos = Array.prototype.slice.call(document.querySelectorAll("#buehne img"));
  /* Chronologische Mittelpunkte im Jahr (0–100):
     Winter → Frühling → Sommer → Herbst → Winter (fünf Bilder, Winter am Anfang und Ende) */
  var zentren = [0, 33, 62, 85, 100];

  /* ---------- Texte ---------- */
  var phasen = [
    { bis:10,  titel:"Winterruhe",
      text:"Der Baum ruht. Kein Blatt, keine Blüte — aber er lebt: In Stamm und Wurzeln sind Vorräte gespeichert, und an den Zweigen sitzen schon die Knospen für das neue Jahr." },
    { bis:24,  titel:"Die Knospen schwellen",
      text:"Es wird wärmer, die Tage werden länger. Die rotbraunen Knospen schwellen an — gut verpackt warten darin Blüten und Blätter auf ihren Auftritt." },
    { bis:42,  titel:"Blütezeit",
      text:"Die Knospen brechen auf: Der Baum steht in voller Blüte. Jetzt sind Bienen und andere Insekten gefragt — sie tragen den Pollen von Blüte zu Blüte und sorgen für die Bestäubung." },
    { bis:58,  titel:"Junge Früchte",
      text:"Die Blütenblätter sind gefallen, dafür ist die Krone jetzt dicht belaubt. Aus den bestäubten Blüten wachsen kleine grüne Äpfel heran — noch hart und sauer." },
    { bis:76,  titel:"Sommer und Reife",
      text:"Die Blätter arbeiten auf Hochtouren: Mit Sonnenlicht stellen sie Zucker her, den der Baum in die Früchte schickt. Die Äpfel werden größer, süßer — und langsam rot." },
    { bis:93,  titel:"Ernte und Laubfall",
      text:"Die reifen Äpfel fallen zu Boden oder werden gepflückt. Der Baum holt die letzten Nährstoffe aus den Blättern zurück — sie färben sich gelb und braun und segeln davon." },
    { bis:100, titel:"Zurück zur Ruhe",
      text:"Kahl steht der Baum im ersten Schnee. Was nach Stillstand aussieht, ist kluges Energiesparen — und an den Zweigen sitzen längst wieder die Knospen fürs nächste Frühjahr." }
  ];
  var monate = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

  var slider = document.getElementById("slider");
  var erkl = document.getElementById("erklaerung");
  var titelEl = document.getElementById("phase-titel");
  var textEl = document.getElementById("phase-text");
  var monatEl = document.getElementById("monat");
  var letztePhase = -1;

  /* ---------- Alles aus dem Reglerwert ableiten ---------- */
  function male(){
    var t = parseFloat(slider.value);

    /* Die zwei benachbarten Jahreszeiten-Fotos ineinander überblenden.
       seg = linkes Bild, seg+1 = rechtes Bild, f = Übergang 0…1. Bilder bis
       einschließlich seg bleiben voll deckend (liegen darunter), seg+1 wird
       mit f eingeblendet, spätere Bilder sind unsichtbar. */
    var seg = 0;
    while (seg < zentren.length - 2 && t > zentren[seg + 1]) seg++;
    var f = clamp01((t - zentren[seg]) / (zentren[seg + 1] - zentren[seg]));
    fotos.forEach(function(img, i){
      img.style.opacity = (i <= seg) ? 1 : (i === seg + 1 ? f : 0);
    });

    /* Monat */
    monatEl.textContent = monate[Math.min(11, Math.floor(t / 100 * 12))];

    /* Phasentext */
    var p = 0;
    while (phasen[p].bis < t) p++;
    if (p !== letztePhase){
      letztePhase = p;
      /* Blätter kommen jetzt aus dem Abschluss-Quiz weiter unten (nicht mehr fürs bloße Durchziehen). */
      titelEl.textContent = phasen[p].titel;
      textEl.textContent = phasen[p].text;
      erkl.classList.remove("wechsel");
      void erkl.offsetWidth;
      erkl.classList.add("wechsel");
    }
  }

  slider.addEventListener("input", male);
  document.addEventListener("keydown", function(e){
    if (document.activeElement === slider) return; /* Regler regelt selbst */
    if (e.key === "ArrowRight") { slider.value = Math.min(100, parseFloat(slider.value) + 2); male(); }
    if (e.key === "ArrowLeft")  { slider.value = Math.max(0, parseFloat(slider.value) - 2); male(); }
  });

  /* Jahreszeiten-Sprungmarken: Klick springt zur passenden Stelle im Jahr */
  document.querySelectorAll(".jz-link").forEach(function(knopf){
    knopf.addEventListener("click", function(){
      slider.value = knopf.dataset.pos;
      male();
    });
  });

  male();
})();
</script>

<script>
/* ---- Abschluss-Quiz „Ein Jahr im Apfelbaum" → schreibt die Blätter in den Forscherpass ---- */
(function(){
  var FRAGEN=[
    {f:"Wann sind im Apfelbaum-Jahr die Bienen besonders wichtig?",
     a:["Zur Blütezeit im Frühling","Im tiefsten Winter","Beim Laubfall im Herbst"], r:0,
     fb:"Zur Blüte tragen Bienen den Pollen von Blüte zu Blüte – das ist die Bestäubung."},
    {f:"Wie werden die Äpfel im Sommer süß?",
     a:["Die Blätter stellen mit Sonnenlicht Zucker her","Der Regen spült Zucker hinein","Die Wurzeln saugen Zucker aus dem Boden"], r:0,
     fb:"In den Blättern entsteht aus Sonnenlicht Zucker, den der Baum in die Früchte schickt."},
    {f:"Was macht der Baum im Herbst mit den Blättern, bevor sie fallen?",
     a:["Er holt sich wertvolle Nährstoffe zurück","Er färbt sie noch einmal grün","Er lässt sie weiterwachsen"], r:0,
     fb:"Der Baum zieht Nährstoffe zurück – die Blätter färben sich gelb-braun und fallen."},
    {f:"Was sitzt schon im Winter an den kahlen Zweigen?",
     a:["Die Knospen fürs nächste Frühjahr","Reife Äpfel","Offene Blüten"], r:0,
     fb:"In den gut verpackten Knospen warten Blüten und Blätter auf das neue Jahr."},
    {f:"In welcher Reihenfolge läuft das Jahr ab?",
     a:["Blüte → junge Früchte → reife Äpfel → Ernte","Ernte → Blüte → junge Früchte → reife Äpfel","Reife Äpfel → Blüte → Ernte → junge Früchte"], r:0,
     fb:"Erst die Blüte, dann kleine grüne Früchte, die reifen und schließlich geerntet werden."},
    {f:"Warum ist der kahle Baum im Winter nicht „tot“?",
     a:["Er spart Energie und lebt von Vorräten in Stamm und Wurzeln","Er ist wirklich abgestorben","Er wächst im Winter am schnellsten"], r:0,
     fb:"Die Winterruhe ist kluges Energiesparen – Vorräte stecken in Stamm und Wurzeln."}
  ];
  var host=document.getElementById("jzqLauf"), intro=document.getElementById("jzqIntro"), startBtn=document.getElementById("jzqStart");
  if(!host||!startBtn) return;
  function misch(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}return a;}
  startBtn.addEventListener("click",function(){ intro.hidden=true; host.hidden=false; starte(); });
  function starte(){
    var fragen=misch(FRAGEN), q=0, score=0, sperre=false;
    function zeige(){
      sperre=false;
      var f=fragen[q];
      var opts=misch(f.a.map(function(txt,idx){return {txt:txt,idx:idx};}));
      host.innerHTML='<div class="jzq-kopf">Frage <b>'+(q+1)+'</b> / '+fragen.length+' · ✓ '+score+'</div>'+
        '<div class="jzq-balken"><div style="width:'+(q/fragen.length*100)+'%"></div></div>'+
        '<p class="jzq-frage">'+f.f+'</p><div class="jzq-wahl" id="jzqWahl"></div><div class="jzq-fb" id="jzqFb"></div>';
      var wrap=document.getElementById("jzqWahl"), fb=document.getElementById("jzqFb");
      opts.forEach(function(o){
        var b=document.createElement("button"); b.type="button"; b.textContent=o.txt;
        b.addEventListener("click",function(){
          if(sperre) return; sperre=true;
          var richtig=(o.idx===f.r);
          Array.prototype.forEach.call(wrap.children,function(x,ix){ x.disabled=true; if(opts[ix].idx===f.r) x.classList.add("ok"); });
          if(richtig){ score++; fb.textContent="✓ Richtig! "+f.fb; } else { b.classList.add("no"); fb.textContent="✗ "+f.fb; }
          setTimeout(function(){ q++; if(q<fragen.length) zeige(); else ende(); }, richtig?1100:1900);
        });
        wrap.appendChild(b);
      });
    }
    function ende(){
      var perfekt=(score===fragen.length);
      var blaetter = perfekt?3 : (score>=Math.ceil(fragen.length*0.6)?2:1);
      try{var _K="mibaso.flora.expedition",_d=JSON.parse(localStorage.getItem(_K)||"{}");
        if(!_d.jahr||blaetter>(_d.jahr.blaetter||0)){_d.jahr={blaetter:blaetter,done:true,ts:Date.now()};localStorage.setItem(_K,JSON.stringify(_d));}}catch(e){}
      var voll="🍃".repeat(blaetter), leer='<span class="leer">'+"🍃".repeat(3-blaetter)+'</span>';
      var sprueche=perfekt?["Alles richtig – du kennst den Jahreslauf des Apfelbaums! 🍎","Volltreffer! Ein echter Baum-Kenner."]
        :(score>=Math.ceil(fragen.length*0.6)?["Stark! Fast alles sitzt.","Gut gemacht – das Jahr hast du drauf."]
        :["Schieb ruhig nochmal durchs Jahr – dann sitzt es.","Ein guter Anfang! Noch eine Runde?"]);
      host.innerHTML='<div class="jzq-ende"><p style="font-family:-apple-system,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#9a9384;margin:0;">Ergebnis</p>'+
        '<p class="jzq-score">'+score+'<small> / '+fragen.length+'</small></p>'+
        '<p class="jzq-blaetter">'+voll+leer+'</p>'+
        '<p class="jzq-spruch">'+sprueche[Math.floor(Math.random()*sprueche.length)]+'</p>'+
        '<div><button class="jzq-btn" id="jzqNochmal" type="button">Nochmal</button>'+
        '<a class="jzq-btn" href="../pflanzenpass.html">🌿 Forscherpass</a></div></div>';
      document.getElementById("jzqNochmal").addEventListener("click",starte);
    }
    zeige();
  }
})();
</script>

<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const isEmbed = params.get('embed') === '1' || window.self !== window.top;
  if (isEmbed) {
    document.body.classList.add('embed');
    // Höhe regelmäßig an Parent posten
    const sende = () => {
      const h = document.body.scrollHeight;
      window.parent.postMessage({ kreislaufHoehe: h }, '*');
    };
    window.addEventListener('load', sende);
    window.addEventListener('resize', sende);
    new MutationObserver(sende).observe(document.body, { childList:true, subtree:true, attributes:true });
    setInterval(sende, 800);
  }
})();
</script>
<script src="../assets/app.js" defer></script>
