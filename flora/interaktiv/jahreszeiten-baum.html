<title>Ein Jahr im Apfelbaum — Schritt 4 des Kreislaufs</title>
<style>
  :root{
    --gruen:#2F4F3E;
    --gruen-hell:#4A6B58;
    --creme:#F7F3E8;
    --karte:#FFFDF6;
    --linie:#D9D0BC;
    --text:#33402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--creme);
    color:var(--text);
    line-height:1.55;
  }
  header{
    background:var(--gruen);
    color:#F4EFE2;
    padding:18px 16px 16px;
    text-align:center;
  }
  header h1{ margin:0; font-size:1.45rem; font-weight:normal; letter-spacing:.5px; }
  header p{ margin:6px 0 0; font-size:.95rem; font-style:italic; opacity:.85; }
  main{ max-width:760px; margin:0 auto; padding:18px 12px 30px; }
  .karte{
    background:var(--karte);
    border:1px solid var(--linie);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(47,79,62,.08);
  }
  .buehne{ position:relative; width:100%; aspect-ratio:4/3; background:#26312b; }
  .buehne img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- Schieberegler ---------- */
  .regler{ padding:16px 22px 4px; border-top:1px solid var(--linie); }
  .monat{
    text-align:center;
    font-size:1.05rem;
    color:var(--gruen);
    margin:0 0 6px;
  }
  .monat strong{ font-weight:normal; font-size:1.2rem; }
  /* Gut sichtbarer Regler-Knopf in warmem Rotbraun */
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:34px;
    background:transparent;
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    margin-top:-9px;
    cursor:grab;
  }
  input[type="range"]::-webkit-slider-thumb:active{ cursor:grabbing; }
  input[type="range"]::-moz-range-track{
    height:8px;
    border-radius:4px;
    background:#cfd9cd;
  }
  input[type="range"]::-moz-range-thumb{
    width:26px; height:26px;
    border-radius:50%;
    background:#9c3b2a;
    border:3px solid #fff;
    box-shadow:0 1px 6px rgba(0,0,0,.35);
    cursor:grab;
  }
  input[type="range"]:focus-visible{ outline:3px solid #E3B23C; outline-offset:2px; border-radius:6px; }
  .jahreszeiten{
    display:flex;
    justify-content:space-between;
    margin-top:2px;
  }
  /* Jahreszeiten als direkte Sprungmarken */
  .jz-link{
    background:none;
    border:none;
    padding:2px 4px;
    font-family:inherit;
    font-size:.85rem;
    color:var(--gruen-hell);
    font-style:italic;
    cursor:pointer;
    border-bottom:1px dotted var(--gruen-hell);
    transition:color .15s;
  }
  .jz-link:hover, .jz-link:focus-visible{ color:#9c3b2a; border-bottom-color:#9c3b2a; outline:none; }

  /* ---------- Textfeld ---------- */
  .erklaerung{ padding:12px 22px 18px; min-height:108px; }
  .erklaerung h2{ margin:0 0 6px; font-size:1.15rem; color:var(--gruen); font-weight:normal; }
  .erklaerung p{ margin:0; font-size:1rem; }
  .erklaerung.wechsel{ animation:einblenden .4s ease; }
  @keyframes einblenden{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;} }

  footer{ text-align:center; font-size:.85rem; color:var(--gruen-hell); padding:14px 10px 26px; }
  footer > a{ color:inherit; }

  /* fallende Blätter */
  .fallblatt{ animation:fallen 5s linear infinite; }
  @keyframes fallen{
    0%   { transform:translate(0,0) rotate(0deg); }
    25%  { transform:translate(-18px,60px) rotate(70deg); }
    50%  { transform:translate(14px,125px) rotate(150deg); }
    75%  { transform:translate(-12px,190px) rotate(230deg); }
    100% { transform:translate(8px,255px) rotate(320deg); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<style>
.pfad-intro{position:fixed;inset:0;z-index:9000;background:#F7F3E8;display:flex;align-items:center;
  justify-content:center;padding:26px 20px;overflow-y:auto;transition:opacity .5s ease;}

.pi-inner{max-width:440px;text-align:center;font-family:Georgia,'Times New Roman',serif;}

</style><div class="pfad-intro" id="pfadIntro"><div class="pi-inner"><img class="pi-foto" src="../images/fotos/apfelbaum-intro.jpg" alt="" onerror="this.style.display='none'"><div class="pi-eyebrow">🌼 Flora Mibaso · Lernpfad</div><h1 class="pi-titel">Ein Jahr im Apfelbaum</h1><p class="pi-lead">Frühling, Sommer, Herbst, Winter — ein Jahr im Leben eines Apfelbaums.</p><button class="pi-los" onclick="var e=document.getElementById('pfadIntro');e.classList.add('weg');setTimeout(function(){e.style.display='none';},500);">Los geht’s →</button></div></div>
<a class="back" href="../pflanzenpass.html" style="display:inline-block;margin:12px 14px 0;color:#6b5340;text-decoration:none;font-size:.95rem;">‹ Zurück zur Übersicht</a>

<main>
  <div class="karte">
    <div class="buehne" id="buehne" role="img"
         aria-label="Ein Apfelbaum im Lauf des Jahres — mit dem Schieberegler von Winter über Frühling und Sommer bis zum Herbst.">
      <img src="../images/apfelbaum/winter.jpg"    alt="Apfelbaum im Winter, kahl" style="opacity:1"  onerror="this.style.display='none'">
      <img src="../images/apfelbaum/fruehling.jpg" alt="Apfelbaum in der Blüte im Frühling" style="opacity:0" onerror="this.style.display='none'">
      <img src="../images/apfelbaum/sommer.jpg"    alt="Apfelbaum mit Blättern und Äpfeln im Sommer" style="opacity:0" onerror="this.style.display='none'">
      <img src="../images/apfelbaum/herbst.jpg"    alt="Apfelbaum im Herbst mit buntem Laub und Fallobst" style="opacity:0" onerror="this.style.display='none'">
      <img src="../images/apfelbaum/winter.jpg"    alt="Apfelbaum im Winter, kahl" style="opacity:0" onerror="this.style.display='none'">
    </div>

    <div class="regler">
      <p class="monat">Monat: <strong id="monat">Januar</strong></p>
      <input type="range" id="slider" min="0" max="100" value="0" step="0.5"
             aria-label="Jahresverlauf von Januar bis Dezember">
      <div class="jahreszeiten">
        <button class="jz-link" data-pos="3"  type="button">Winter</button>
        <button class="jz-link" data-pos="33" type="button">Frühling</button>
        <button class="jz-link" data-pos="66" type="button">Sommer</button>
        <button class="jz-link" data-pos="85" type="button">Herbst</button>
        <button class="jz-link" data-pos="98" type="button">Winter</button>
      </div>
    </div>

    <div class="erklaerung" id="erklaerung" aria-live="polite">
      <h2 id="phase-titel"></h2>
      <p id="phase-text"></p>
    </div>
  </div>
</main>

<script>
(function(){
  /* ---------- Hilfsfunktion ---------- */
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  /* ---------- Jahreszeiten-Fotos (Cross-Fade mit dem Schieber) ---------- */
  var fotos = Array.prototype.slice.call(document.querySelectorAll("#buehne img"));
  /* Chronologische Mittelpunkte im Jahr (0–100):
     Winter → Frühling → Sommer → Herbst → Winter (fünf Bilder, Winter am Anfang und Ende) */
  var zentren = [0, 33, 62, 85, 100];

  /* ---------- Texte ---------- */
  var phasen = [
    { bis:10,  titel:"Winterruhe",
      text:"Der Baum ruht. Kein Blatt, keine Blüte — aber er lebt: In Stamm und Wurzeln sind Vorräte gespeichert, und an den Zweigen sitzen schon die Knospen für das neue Jahr." },
    { bis:24,  titel:"Die Knospen schwellen",
      text:"Es wird wärmer, die Tage werden länger. Die rotbraunen Knospen schwellen an — gut verpackt warten darin Blüten und Blätter auf ihren Auftritt." },
    { bis:42,  titel:"Blütezeit",
      text:"Die Knospen brechen auf: Der Baum steht in voller Blüte. Jetzt sind Bienen und andere Insekten gefragt — sie tragen den Pollen von Blüte zu Blüte und sorgen für die Bestäubung." },
    { bis:58,  titel:"Junge Früchte",
      text:"Die Blütenblätter sind gefallen, dafür ist die Krone jetzt dicht belaubt. Aus den bestäubten Blüten wachsen kleine grüne Äpfel heran — noch hart und sauer." },
    { bis:76,  titel:"Sommer und Reife",
      text:"Die Blätter arbeiten auf Hochtouren: Mit Sonnenlicht stellen sie Zucker her, den der Baum in die Früchte schickt. Die Äpfel werden größer, süßer — und langsam rot." },
    { bis:93,  titel:"Ernte und Laubfall",
      text:"Die reifen Äpfel fallen zu Boden oder werden gepflückt. Der Baum holt die letzten Nährstoffe aus den Blättern zurück — sie färben sich gelb und braun und segeln davon." },
    { bis:100, titel:"Zurück zur Ruhe",
      text:"Kahl steht der Baum im ersten Schnee. Was nach Stillstand aussieht, ist kluges Energiesparen — und an den Zweigen sitzen längst wieder die Knospen fürs nächste Frühjahr." }
  ];
  var monate = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

  var slider = document.getElementById("slider");
  var erkl = document.getElementById("erklaerung");
  var titelEl = document.getElementById("phase-titel");
  var textEl = document.getElementById("phase-text");
  var monatEl = document.getElementById("monat");
  var letztePhase = -1;

  /* ---------- Alles aus dem Reglerwert ableiten ---------- */
  function male(){
    var t = parseFloat(slider.value);

    /* Die zwei benachbarten Jahreszeiten-Fotos ineinander überblenden.
       seg = linkes Bild, seg+1 = rechtes Bild, f = Übergang 0…1. Bilder bis
       einschließlich seg bleiben voll deckend (liegen darunter), seg+1 wird
       mit f eingeblendet, spätere Bilder sind unsichtbar. */
    var seg = 0;
    while (seg < zentren.length - 2 && t > zentren[seg + 1]) seg++;
    var f = clamp01((t - zentren[seg]) / (zentren[seg + 1] - zentren[seg]));
    fotos.forEach(function(img, i){
      img.style.opacity = (i <= seg) ? 1 : (i === seg + 1 ? f : 0);
    });

    /* Monat */
    monatEl.textContent = monate[Math.min(11, Math.floor(t / 100 * 12))];

    /* Phasentext */
    var p = 0;
    while (phasen[p].bis < t) p++;
    if (p !== letztePhase){
      letztePhase = p;
      /* Letzte Jahresphase erreicht → Flora-Forscherpass: volle 3 Blätter */
      if (p === phasen.length - 1) { try{var _K="mibaso.flora.expedition",_d=JSON.parse(localStorage.getItem(_K)||"{}");if(!_d.jahr||!_d.jahr.done){_d.jahr={blaetter:3,done:true,ts:Date.now()};localStorage.setItem(_K,JSON.stringify(_d));}}catch(e){} }
      titelEl.textContent = phasen[p].titel;
      textEl.textContent = phasen[p].text;
      erkl.classList.remove("wechsel");
      void erkl.offsetWidth;
      erkl.classList.add("wechsel");
    }
  }

  slider.addEventListener("input", male);
  document.addEventListener("keydown", function(e){
    if (document.activeElement === slider) return; /* Regler regelt selbst */
    if (e.key === "ArrowRight") { slider.value = Math.min(100, parseFloat(slider.value) + 2); male(); }
    if (e.key === "ArrowLeft")  { slider.value = Math.max(0, parseFloat(slider.value) - 2); male(); }
  });

  /* Jahreszeiten-Sprungmarken: Klick springt zur passenden Stelle im Jahr */
  document.querySelectorAll(".jz-link").forEach(function(knopf){
    knopf.addEventListener("click", function(){
      slider.value = knopf.dataset.pos;
      male();
    });
  });

  male();
})();
</script>

  const isEmbed = params.get('embed') === '1' || window.self !== window.top;
  if (isEmbed) {
    document.body.classList.add('embed');
    // Höhe regelmäßig an Parent posten
    const sende = () => {
      const h = document.body.scrollHeight;
      window.parent.postMessage({ kreislaufHoehe: h }, '*');
    };
    window.addEventListener('load', sende);
    window.addEventListener('resize', sende);
    new MutationObserver(sende).observe(document.body, { childList:true, subtree:true, attributes:true });
    setInterval(sende, 800);
  }
})();
</script>
