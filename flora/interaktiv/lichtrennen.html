<script>
"use strict";
/* ============ Spielregeln (ohne Anzeige) ============
   Waldboden mit 7 × 5 Feldern. Über jedem Feld steht ein Baum (oder eine Lücke). Mit jedem Zug vergehen ein paar Frühlingstage.
   Jedes eigene Feld sammelt Licht und füllt den Vorrat im Wurzelstock – bis sich das Blätterdach darüber schließt.
   Pro Zug darf man EINE Sache tun: auf ein Nachbarfeld wachsen (kostet Vorrat) oder auf einem eigenen Feld blühen.
   Gewertet wird der Vorrat am Ende plus die Samen. */
const BREIT = 7, HOCH = 5;
const DACH = {
  hasel: { n: "Hasel",   zu: 9,  info: "Haselsträucher treiben früh aus. Unter ihnen wird es schon im März schattig." },
  ahorn: { n: "Ahorn",   zu: 13, info: "Der Bergahorn bekommt seine Blätter Mitte April." },
  buche: { n: "Buche",   zu: 16, info: "Buchen treiben Ende April aus. Ihr Blätterdach ist so dicht, dass am Boden kaum Licht ankommt." },
  eiche: { n: "Eiche",   zu: 20, info: "Eichen treiben spät aus, und ihre Krone lässt immer etwas Licht durch." , rest: 1 },
  luecke:{ n: "Lichtung", zu: 99, info: "Über der Lichtung ist kein Baum. Hier bleibt es hell – aber im Sommer wuchern Gräser und Brombeeren." },
  bach:  { n: "Bach",    zu: 99, wasser: true, info: "Am Bach ist der Boden feucht. Hier wächst nichts, was Wurzeln im trockenen Boden braucht." }
};
const LEVEL = [
  { id: "windroeschen", em: "🤍", titel: "Das Buschwindröschen", kurz: "Buschwindröschen", zeit: "März bis Mai", was: "wächst mit dem Wurzelstock",
    motto: "Ein weißer Teppich im Buchenwald – aber nur, bis die Buchen ihre Blätter bekommen.",
    intro: "Du bist ein Buschwindröschen. Dein Wurzelstock kriecht unter dem Laub und treibt neue Blätter. Tippe auf ein Nachbarfeld, um dorthin zu wachsen, oder auf ein eigenes Feld, um zu blühen. Sammle Licht, bevor sich das Blätterdach schließt!",
    zuege: 22, start: 4, wachsen: 4, reichweite: 1, licht: 1, ziel: [35, 60, 90],
    dach: { buche: 14, hasel: 6, ahorn: 5, eiche: 6, luecke: 4 } },
  { id: "scharbock", em: "💛", titel: "Das Scharbockskraut", kurz: "Scharbockskraut", zeit: "März bis April", was: "Brutknöllchen, Wildschweine",
    motto: "Glänzend gelbe Sterne am Bach. Deine Brutknöllchen kullern weit – doch Wildschweine wühlen im feuchten Boden.",
    intro: "Du bist Scharbockskraut. Aus kleinen Brutknöllchen wachsen neue Pflanzen – sie können bis zu zwei Felder weit getragen werden. Achtung: Wildschweine graben nach deinen Knöllchen!",
    zuege: 20, start: 4, wachsen: 4, reichweite: 2, licht: 1, rotte: [9, 13], ziel: [30, 50, 72],
    dach: { buche: 8, hasel: 7, ahorn: 7, eiche: 4, luecke: 3, bach: 6 } },
  { id: "baerlauch", em: "🌿", titel: "Der Bärlauch", kurz: "Bärlauch", zeit: "März bis Mai", was: "große Blätter, Sammler",
    motto: "Große Blätter sammeln viel Licht. Doch die Leute kommen mit Körben, um dich zu pflücken.",
    intro: "Du bist Bärlauch. Deine großen Blätter sammeln besonders viel Licht – aber neue Zwiebeln zu bilden ist teuer. Und: Wo Sammler pflücken, bekommst du für eine Weile kein Licht. Sie sind am Wanderweg oben unterwegs!",
    zuege: 22, start: 6, wachsen: 7, reichweite: 1, licht: 2, sammler: true, ziel: [35, 70, 110],
    dach: { buche: 12, ahorn: 8, eiche: 6, hasel: 4, luecke: 5 } }
];
const spalte = i => i % BREIT, zeile = i => Math.floor(i / BREIT);
const weite = (a, b) => Math.max(Math.abs(spalte(a) - spalte(b)), Math.abs(zeile(a) - zeile(b)));

    </section>
    ${fuss()}
  </div>`;
  $$(".lv", app).forEach(b => b.onclick = () => { location.hash = LEVEL[+b.dataset.i].id; });
  const f = $("#frei"); if (f) f.onclick = () => { S.frei = true; speichern(); seiteStart(); };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Ein Frühling ============ */
let timer = [];
const spaeter = (f, ms) => { timer.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); };
function seiteSpiel(id) {
  const nr = LEVEL.findIndex(L => L.id === id), L = LEVEL[nr];
  const st = neuesSpiel(L, Math.random);
  let sperre = false, meld = [{ art: "info", t: L.kurz + " · " + L.was, k: L.intro }];
  const X = i => spalte(i) * 100, Y = i => 70 + zeile(i) * 100;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span><b>${L.kurz}</b> · <span id="datum"></span></span><span id="rest"></span></div></div></div>
    <div class="spiel"><div class="planrahmen" id="rahmen">
      <svg id="plan" viewBox="0 0 700 570" role="group" aria-label="Waldboden mit ${BREIT * HOCH} Feldern">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0f2"/><stop offset="1" stop-color="#dff0fb"/></linearGradient>
          <pattern id="gefahr" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="rgba(178,59,46,.30)"/></pattern></defs>
        <g id="himmel"></g><g id="felder"></g><g id="fx"></g>
      </svg></div>
      <aside class="pult">
        <div class="anz"><span class="lab">🥔 Vorrat im Boden: <b id="vZahl"></b></span><span class="lab">🌱 Samen: <b id="sZahl"></b></span></div>
        <div class="anz nestanz"><span class="lab">⭐ Punkte: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div></div>
        <button type="button" class="knopf" id="warten">⏳ Abwarten und Licht sammeln</button>
        <div id="meld" role="status" aria-live="polite"></div>
      </aside></div>`;
  const fx = $("#fx");
  function himmel() {
    const p = Math.min(1, st.zug / L.zuege), sx = 40 + 620 * p, sy = 50 - 26 * Math.sin(Math.PI * p);
    $("#himmel").innerHTML = `<rect width="700" height="70" fill="url(#hg)"/>${st.sonne ? `<circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="15" fill="#ffd23f" stroke="#f4a800" stroke-width="2.5"/>`
      : `<rect width="700" height="70" fill="#8a96a6" opacity=".35"/><g transform="translate(${sx.toFixed(0)} ${sy.toFixed(0)})"><ellipse cx="0" cy="6" rx="34" ry="13" fill="#9aa4b2"/><circle cx="-14" cy="-2" r="13" fill="#a8b2bf"/><circle cx="8" cy="-7" r="16" fill="#9aa4b2"/></g>`}
      <text x="690" y="60" text-anchor="end" class="plantext">${st.sonne ? "morgen sonnig" : "morgen bewölkt"}</text>
      ${L.sammler ? `<path d="M0 66 H700" stroke="#c9a46a" stroke-width="6"/><text x="10" y="58" class="plantext">Wanderweg</text>` : ""}`;
  }
  function felder() {
    const rz = st.rotteAb > 0 && st.zug >= st.rotteAb - 2 && st.zug < st.rotteAb ? st.rotteZeile : -1;
    $("#felder").innerHTML = st.feld.map((f, i) => { const D = DACH[f.d], l = lichtAuf(st, f), kann = erreichbar(st, i);
      const name = (f.mein ? "Dein Feld" : "Waldboden") + " unter " + D.n + ", " + (D.wasser ? "Wasser" : l >= L.licht ? "hell" : l > 0 ? "dämmrig" : "dunkel") + (f.bluete ? ", blüht" : "") + (kann ? ", hier kannst du hinwachsen" : "");
      const grund = D.wasser ? ((spalte(i) + zeile(i)) % 2 ? "#6f9cc0" : "#7aa6c8") : (spalte(i) + zeile(i)) % 2 ? "#a88a5e" : "#b09264";
      const dunkel = D.wasser ? 0 : l >= L.licht ? 0 : l > 0 ? .25 : .5;
      return `<g class="feld${kann ? " kann" : ""}${f.mein ? " mein" : ""}" data-i="${i}" transform="translate(${X(i)} ${Y(i)})" tabindex="0" role="button" aria-label="${name}">
        <rect width="100" height="100" fill="${grund}"/>${D.wasser ? `<path d="M10 40 q10 -6 20 0 t20 0 t20 0 t20 0 M10 66 q10 -6 20 0 t20 0 t20 0 t20 0" stroke="#d6ebf7" stroke-width="2" fill="none"/>` : streu(i)}
        ${f.mein ? `<g class="${f.gepflueckt ? "leer" : ""}">${PFLANZE[L.id](f.bluete)}</g>` : f.weg ? `<ellipse cx="50" cy="66" rx="30" ry="14" fill="#6b4a2a" opacity=".7"/>` : ""}
        ${dunkel ? `<rect width="100" height="100" fill="#14240f" opacity="${dunkel}"/>` : ""}${krone(st, f)}${f.samen ? SAMEN : ""}
        ${D.wasser ? "" : `<text x="6" y="94" ${SCHRIFT} font-size="11" font-weight="bold" fill="#fff" stroke="#3d2c1a" stroke-width="2.6" paint-order="stroke">${D.n}</text>`}
        ${kann ? `<rect x="4" y="4" width="92" height="92" rx="8" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 6" opacity=".9"/>` : ""}
        <rect class="treffer" width="100" height="100" fill="transparent"/></g>`; }).join("")
      + (rz >= 0 ? `<rect x="0" y="${70 + rz * 100}" width="700" height="100" fill="url(#gefahr)" stroke="#B23B2E" stroke-width="4" stroke-dasharray="12 8" pointer-events="none"/><text x="350" y="${70 + rz * 100 + 62}" font-size="40" text-anchor="middle" pointer-events="none">🐗</text>` : "")
      + (L.sammler && st.sammler >= 0 && !vorbei(st) ? `<rect x="${X(st.sammler) + 3}" y="${Y(st.sammler) + 3}" width="94" height="94" rx="10" fill="none" stroke="#e08a1e" stroke-width="3.5" stroke-dasharray="8 6" pointer-events="none"/>` + markeSVG(X(st.sammler) + 50, Y(st.sammler) + 46, "🧺") : "");
  }
  function pult() {
    $("#datum").textContent = datum(L, st.zug);
    $("#rest").textContent = vorbei(st) ? "Sommer" : "noch " + (L.zuege - st.zug) + (L.zuege - st.zug === 1 ? " Zug" : " Züge");
    $("#vZahl").textContent = st.vorrat; $("#sZahl").textContent = st.samen;
    const p = punkte(st); $("#nZahl").textContent = p + (sterneFuer(L, p) ? " · " + "⭐".repeat(sterneFuer(L, p)) : ""); $("#nBalk").style.width = Math.min(100, p / L.ziel[2] * 100) + "%";
    const rang = { pech: 0, regen: 1, mahd: 1, buch: 3, gut: 2, mies: 2, info: 4 };
    $("#meld").innerHTML = meld.slice().sort((a, b) => rang[a.art] - rang[b.art]).slice(0, 3).map(m => `<div class="folge m-${m.art}"><span class="urteil">${m.t}</span><span>${m.k}</span></div>`).join("");
    $("#warten").disabled = vorbei(st);
  }
  function zeichne() { himmel(); felder(); pult(); }
  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 40); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }
  function zug(i) {
    if (sperre || vorbei(st)) return;
    const vorS = st.samen, alt = buch().slice(), z0 = st.zug;
    const M = schritt(st, i); if (!M) return;
    st.neu.forEach(t => { if (!alt.includes(t)) { buch().push(t); M.push({ art: "buch", t: "📖 Neu im Waldboden-Buch: " + DACH[t].n, k: DACH[t].info }); } }); speichern();
    meld = M; zeichne();
    if (st.zug === z0) return;   // ungültiger Tipp: nur Hinweis
    sperre = true;
    if (i >= 0 && st.feld[i].mein) schwebe(i, st.feld[i].bluete && M[0].t === "Du blühst!" ? "🌼" : "🌱", "gruen");
    if (M.some(m => m.art === "pech")) { const r = $("#rahmen"); r.classList.remove("ruck"); void r.offsetWidth; r.classList.add("ruck"); }
    spaeter(() => { sperre = false; if (vorbei(st)) ende(); }, vorbei(st) ? 1800 : 250);
  }
  $("#plan").addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) zug(+g.dataset.i); });
  $("#plan").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-i]"); if (g) { e.preventDefault(); zug(+g.dataset.i); } } });
  $("#warten").onclick = () => zug(-1);
  zeichne();

  function ende() {
    const pkt = punkte(st), n = sterneFuer(L, pkt), alt = S[L.id] || {}, rekord = pkt > (alt.best || 0) && alt.n;
    S[L.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.max(alt.best || 0, pkt) }; speichern();
    const next = LEVEL[nr + 1], neuOffen = n > 0 && next && !alt.sterne && !S.frei, s = st.stat, felderN = st.feld.filter(f => f.mein).length;
    const titel = n === 3 ? "Ein prall gefüllter Vorrat!" : n === 2 ? "Gut gerüstet fürs nächste Jahr" : n === 1 ? "Es reicht für den nächsten Frühling" : "Ein magerer Frühling";
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Übersicht</a><span><b>${L.kurz}</b></span><span>Sommer</span></div></div></div>
      <div class="huelle"><section><div class="ende">
        <div class="held">${kopfBild(L.id, 110)}</div>
        <span class="eyebrow">Der Frühling ist vorbei</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p>Du bist auf <b>${felderN} ${felderN === 1 ? "Feld" : "Felder"}</b> gewachsen. Im Boden stecken <b>${st.vorrat} Vorrat</b>${st.samen ? `, dazu <b>${st.samen / 2} Samen</b> (+${st.samen})` : ""}: zusammen <b>${pkt} Punkte</b>.${rekord ? " Das ist dein neuer Rekord!" : ""}</p>
        <p class="klein">${n < 3 ? "Für " + (n + 1) + (n ? " Sterne" : " Stern") + " brauchst du " + L.ziel[n] + " Punkte. " : ""}${s.bluete && !s.bestaeubt ? "Deine Blüten wurden nicht bestäubt – an sonnigen Tagen fliegen mehr Insekten. " : ""}${s.gewuehlt ? s.gewuehlt + " Felder haben die Wildschweine umgegraben. " : ""}${s.gepflueckt ? s.gepflueckt + "-mal wurdest du gepflückt. " : ""}</p>
        ${neuOffen ? `<p><b>🔓 Freigeschaltet:</b> ${next.titel} wartet auf dich.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf${n ? "" : " prim"}" id="noch">🔁 Noch einmal</button>${n && next ? `<a class="knopf honig" href="#${next.id}">${next.titel} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="../waldpass.html">Zum Waldpass</a></div>
      </div></section>
      <section><h3 class="h-honig">Was dir der Waldboden gezeigt hat</h3><div class="merk">${MERK[L.id].map(k => `<div>${k}</div>`).join("")}</div></section>${fuss()}</div>`;
    $("#noch").onclick = () => seiteSpiel(id);
    if (n === 3) konfetti(["🌸", "⭐", "🌼", "✨", "🌿"]);
  }
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
