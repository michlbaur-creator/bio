<title>Bestäubung Schritt für Schritt — Schritt 3 des Kreislaufs</title>
<style>
  :root{
    --gruen:#2F4F3E;
    --gruen-hell:#4A6B58;
    --creme:#F7F3E8;
    --karte:#FFFDF6;
    --linie:#D9D0BC;
    --pollen:#E3B23C;
    --pollen-dunkel:#C98A1F;
    --rosa:#E48FAB;
    --rosa-hell:#F4C0D2;
    --rosa-ader:#CC6F8C;
    --kelch:#7BA05B;
    --text:#33402F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--creme);
    color:var(--text);
    line-height:1.55;
  }
  header{
    background:var(--gruen);
    color:#F4EFE2;
    padding:18px 16px 16px;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:1.45rem;
    font-weight:normal;
    letter-spacing:.5px;
  }
  header p{
    margin:6px 0 0;
    font-size:.95rem;
    font-style:italic;
    opacity:.85;
  }
  main{
    max-width:760px;
    margin:0 auto;
    padding:18px 12px 30px;
  }
  .karte{
    background:var(--karte);
    border:1px solid var(--linie);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(47,79,62,.08);
  }
  .buehne{ display:block; width:100%; height:auto; background:linear-gradient(#FDFBF3 70%, #EFF2E2); }

  /* ---------- Textfeld ---------- */
  .erklaerung{
    border-top:1px solid var(--linie);
    padding:16px 20px 6px;
    min-height:130px;
  }
  .erklaerung h2{
    margin:0 0 6px;
    font-size:1.15rem;
    color:var(--gruen);
    font-weight:normal;
  }
  .erklaerung h2 .nr{
    display:inline-block;
    background:var(--gruen);
    color:#F4EFE2;
    border-radius:50%;
    width:1.6em;height:1.6em;
    line-height:1.6em;
    text-align:center;
    font-size:.8em;
    margin-right:8px;
  }
  .erklaerung p{ margin:0 0 12px; font-size:1rem; }
  .erklaerung.wechsel{ animation:einblenden .45s ease; }
  @keyframes einblenden{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- Steuerung ---------- */
  .steuerung{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 16px 16px;
  }
  .knopf{
    font-family:inherit;
    font-size:.88rem;
    border:1.5px solid var(--gruen);
    background:var(--gruen);
    color:#F4EFE2;
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    min-width:96px;
  }
  .knopf.zurueck{ background:transparent; color:var(--gruen); }
  .knopf:disabled{ opacity:.35; cursor:default; }
  .knopf:focus-visible{ outline:3px solid var(--pollen); outline-offset:2px; }
  .punkte{ display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .punkte button{
    width:13px;height:13px;
    border-radius:50%;
    border:1.5px solid var(--gruen);
    background:transparent;
    cursor:pointer;
    padding:0;
  }
  .punkte button[aria-current="step"]{ background:var(--gruen); }
  .punkte button:focus-visible{ outline:3px solid var(--pollen); outline-offset:2px; }

  footer{
    text-align:center;
    font-size:.85rem;
    color:var(--gruen-hell);
    padding:14px 10px 26px;
  }
  footer > a{ color:inherit; }

  /* ============================================================
     SVG-Animationen — gesteuert über data-step am Bühnen-Wrapper
     ============================================================ */
  .anim{ transition:transform 1.4s ease-in-out, opacity .9s ease; }
  .leise{ transition:opacity .9s ease; }

  /* Beschriftungen: nur in Schritt 0 sichtbar */
  #beschriftungen{ opacity:1; }
  [data-step]:not([data-step="0"]) #beschriftungen{ opacity:0; }

  /* Biene: Position je Schritt */
  #biene{ opacity:0; transform:translate(450px,30px); }
  [data-step="1"] #biene{ opacity:1; transform:translate(243px,138px); }
  [data-step="2"] #biene{ opacity:1; transform:translate(450px,70px); }
  [data-step="3"] #biene{ opacity:1; transform:translate(658px,138px); }
  [data-step="4"] #biene,
  [data-step="5"] #biene,
  [data-step="6"] #biene{ opacity:0; transform:translate(900px,20px); }

  /* Flügelschlag während des Flugs */
  #fluegel{ transform-box:fill-box; transform-origin:center bottom; }
  [data-step="2"] #fluegel{ animation:flattern .25s linear infinite alternate; }
  @keyframes flattern{ from{transform:scaleY(1);} to{transform:scaleY(.55);} }

  /* Pollen am Bienenpelz: ab Schritt 1 */
  #bienen-pollen{ opacity:0; }
  [data-step="1"] #bienen-pollen,
  [data-step="2"] #bienen-pollen,
  [data-step="3"] #bienen-pollen{ opacity:1; }

  /* Pollenkörner auf der Narbe von Blüte B: ab Schritt 3 */
  #narben-pollen{ opacity:0; }
  [data-step="3"] #narben-pollen,
  [data-step="4"] #narben-pollen,
  [data-step="5"] #narben-pollen{ opacity:1; }

  /* Pollenschlauch: wächst in Schritt 4, bleibt in 5 */
  #pollenschlauch{
    stroke-dasharray:100;
    stroke-dashoffset:100;
    opacity:0;
    transition:stroke-dashoffset 2.4s ease-in-out, opacity .4s ease;
  }
  [data-step="4"] #pollenschlauch,
  [data-step="5"] #pollenschlauch{ opacity:1; stroke-dashoffset:0; }

  /* Befruchtung: Samenanlage leuchtet in Schritt 5 */
  #samenanlage-b1{ transition:fill 1s ease; }
  [data-step="5"] #samenanlage-b1{ fill:var(--pollen); animation:pulsieren 1.6s ease-in-out infinite; }
  @keyframes pulsieren{ 0%,100%{opacity:1;} 50%{opacity:.55;} }

  /* Schritt 6: Aus Blüte B wird Frucht */
  .blatt-b{ transform-box:fill-box; transform-origin:bottom center; transition:transform 1.6s ease, opacity 1.6s ease; }
  [data-step="6"] .blatt-b{ opacity:.22; }
  [data-step="6"] #blatt-b-links{ transform:rotate(-32deg); opacity:.2; }
  [data-step="6"] #blatt-b-rechts{ transform:rotate(32deg); opacity:.2; }
  [data-step="6"] #blatt-b-mitte{ opacity:.15; }
  [data-step="6"] #staub-b{ opacity:.15; }
  [data-step="6"] #stempel-b-oben{ opacity:.25; }
  #fruchtknoten-b{ transform-box:fill-box; transform-origin:center; transition:transform 1.6s ease, fill 1.6s ease; }
  [data-step="6"] #fruchtknoten-b{ transform:scale(1.8); fill:#D88A3F; }
  .samenanlage-b{ transition:fill 1.6s ease, transform 1.6s ease; transform-box:fill-box; transform-origin:center; }
  [data-step="6"] .samenanlage-b{ fill:#5B4316; transform:scale(1.4); }
  [data-step="6"] #samenanlage-b1{ animation:none; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01s !important; animation:none !important; }
  }
</style>

<script>
(function(){
  var schritte = [
    { titel:"Die Blüte von innen",
      text:"So sieht eine Blüte im Querschnitt aus. In der Mitte sitzt der Stempel mit Narbe, Griffel und Fruchtknoten — darin warten die Samenanlagen. Außen herum stehen die Staubblätter mit dem gelben Pollen. Tippe auf „Weiter“ und verfolge die Reise eines Pollenkorns." },
    { titel:"Besuch mit Folgen",
      text:"Eine Biene landet in der linken Blüte, um Nektar zu trinken. Dabei streift sie die Staubblätter — und etliche Pollenkörner bleiben in ihrem Pelz hängen. Die Biene merkt davon nichts." },
    { titel:"Pollen auf Reisen",
      text:"Satt geworden fliegt die Biene weiter — zur nächsten Blüte derselben Art. Den Pollen nimmt sie als blinden Passagier mit." },
    { titel:"Ankunft auf der Narbe",
      text:"In der neuen Blüte streift die Biene die klebrige Narbe, und einige Pollenkörner bleiben dort haften. Die Bestäubung ist geschafft — aber die eigentliche Arbeit beginnt jetzt erst." },
    { titel:"Der Pollenschlauch wächst",
      text:"Auf der Narbe keimt das Pollenkorn. Ein hauchfeiner Schlauch wächst durch den Griffel hinab — zielsicher bis zu einer Samenanlage im Fruchtknoten." },
    { titel:"Die Befruchtung",
      text:"Durch den Pollenschlauch wandert eine Zelle des Pollenkorns nach unten und verschmilzt in der Samenanlage mit der Eizelle. Erst jetzt sprechen wir von Befruchtung — Bestäubung und Befruchtung sind also zwei verschiedene Schritte." },
    { titel:"Aus Blüte wird Frucht",
      text:"Die Blütenblätter haben ihre Aufgabe erfüllt und welken. Der Fruchtknoten wächst zur Frucht heran, und aus der befruchteten Samenanlage wird ein Samen — der Anfang einer neuen Pflanze." }
  ];

  var wrapper = document.getElementById("wrapper");
  var erkl = document.getElementById("erklaerung");
  var nr = document.getElementById("schritt-nr");
  var titel = document.getElementById("schritt-titel");
  var text = document.getElementById("schritt-text");
  var btnZ = document.getElementById("btn-zurueck");
  var btnW = document.getElementById("btn-weiter");
  var punkte = document.getElementById("punkte");
  var aktuell = 0;

  schritte.forEach(function(s, i){
    var p = document.createElement("button");
    p.type = "button";
    p.setAttribute("aria-label", "Schritt " + (i+1) + ": " + s.titel);
    p.addEventListener("click", function(){ zeige(i); });
    punkte.appendChild(p);
  });

  function zeige(n){
    aktuell = Math.max(0, Math.min(schritte.length - 1, n));
    wrapper.dataset.step = aktuell;
    nr.textContent = aktuell + 1;
    titel.textContent = schritte[aktuell].titel;
    text.textContent = schritte[aktuell].text;
    erkl.classList.remove("wechsel");
    void erkl.offsetWidth; /* Animation neu starten */
    erkl.classList.add("wechsel");

    btnZ.disabled = (aktuell === 0);
    btnW.textContent = (aktuell === schritte.length - 1) ? "Von vorn" : "Weiter";

    var dots = punkte.children;
    for (var i = 0; i < dots.length; i++){
      if (i === aktuell) dots[i].setAttribute("aria-current", "step");
      else dots[i].removeAttribute("aria-current");
    }
  }

  btnZ.addEventListener("click", function(){ zeige(aktuell - 1); });
  btnW.addEventListener("click", function(){
    zeige(aktuell === schritte.length - 1 ? 0 : aktuell + 1);
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") zeige(aktuell + 1);
    if (e.key === "ArrowLeft") zeige(aktuell - 1);
  });

  zeige(0);
})();
</script>

<style>
  /* Embed-Modus: Wenn als iframe geladen, Flora-Header + Footer + Zurück-Link ausblenden */
  body.embed > header.top, body.embed > footer.bottom, body.embed > a.back { display:none !important; }
  body.embed { background:transparent; }
</style>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const isEmbed = params.get('embed') === '1' || window.self !== window.top;
  if (isEmbed) {
    document.body.classList.add('embed');
    // Höhe an Parent posten — ganzzahlige Layout-Höhe der Karte
    // (offsetHeight, unbeeinflusst von der laufenden Bienen-Animation).
    // Kein Dauerintervall: das verhinderte langsames „Hochratschen".
    const sende = () => {
      const karte = document.querySelector('.karte');
      const h = karte ? karte.offsetTop + karte.offsetHeight + 24 : document.body.offsetHeight;
      window.parent.postMessage({ kreislaufHoehe: h }, '*');
    };
    window.addEventListener('load', sende);
    window.addEventListener('resize', sende);
    // einmalige Nachmessungen, falls SVG/Bilder verzögert layouten
    [200, 600, 1500].forEach(t => setTimeout(sende, t));
  }
})();
</script>
