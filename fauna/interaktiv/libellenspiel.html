<style>
/* Vom Wasser in die Luft – Farben und Schrift wie die Forscherpässe von Fauna Mibaso */
:root{
  --blau:#233D5C; --blau-tief:#1a2f47; --blau-mittel:#33587c; --blau-hell:#bcd0e2;

  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--blau-tief);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100vh}
a{color:var(--blau)}
button{font:inherit;color:inherit}

.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
section{padding-top:24px;display:grid;gap:14px}
.app-head{background:linear-gradient(180deg,var(--blau-tief) 0%,var(--blau-mittel) 100%);color:var(--creme);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) 24px;border-bottom:4px double var(--blau-hell);position:relative}
.app-head .zurueck-kopf{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);color:#dce8f3;font-family:var(--sans);font-size:14px;text-decoration:none;padding:6px}
.app-head .logo{font-size:40px;line-height:1;margin:14px 0 6px;letter-spacing:6px}
.app-head h1{font-size:clamp(30px,9vw,44px);letter-spacing:.02em}
.app-head .untertitel{font-style:italic;color:#dce8f3;margin-top:8px;font-size:clamp(14px,3.8vw,17px)}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:19px}
.klein{font-size:15px;color:var(--ink-soft)}
.h-blau{color:var(--blau);font-size:26px} .h-honig{color:var(--honig-tief);font-size:22px}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:5px}
.knopf{display:inline-block;border:1px solid var(--blau);background:var(--tile);color:var(--blau);border-radius:12px;padding:11px 18px;font-family:var(--sans);font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--blau);color:#fff;box-shadow:0 2px 0 var(--blau-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fuss{margin-top:34px;padding-top:16px;border-top:1px solid var(--linie);font-family:var(--sans);font-size:13px;color:var(--ink-soft);text-align:center;display:grid;gap:6px}
details.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 16px;font-size:16px}

.regeln{display:grid;gap:8px;font-family:var(--sans);font-size:15px}

.lv .em{font-size:44px;text-align:center;line-height:1}

.lv .mo{font-size:15px;color:var(--ink-soft);display:block;line-height:1.35;margin-top:2px}

/* Spiel */
.spielkopf{position:sticky;top:0;z-index:6;background:var(--creme);border-bottom:1px solid var(--linie);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.spielkopf .innen{max-width:860px;margin:0 auto}
.sk-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:14px}
.sk-zeile a{color:var(--blau);text-decoration:none;padding:4px 2px}
.sk-zeile b{color:var(--blau)}
.huelle.breit{max-width:860px}
.karte{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden}
.tisch{display:grid;gap:12px;padding:12px}
@media (min-width:640px){.tisch{grid-template-columns:minmax(0,52%) 1fr;gap:18px;align-items:start;padding:16px}}
.brett{display:block;width:100%;height:auto}
.feld circle{stroke:#fff;stroke-width:2}
.feld.tor circle{stroke:#233D5C;stroke-width:3}
.feld.war circle{opacity:.55}
.fn{font-family:var(--sans);font-size:12px;font-weight:bold;fill:#4f5d4a;text-anchor:middle}
.fe{font-size:17px;text-anchor:middle}
.ff{font-size:18px;text-anchor:middle}
#figur{transition:transform .22s ease-in-out}
.legende{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-family:var(--sans);font-size:12px;color:var(--ink-soft);padding-top:6px}
.legende i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tafel{display:grid;gap:10px;align-content:start;min-height:230px}
.tafel p{font-size:17px;line-height:1.45}
.tk{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.tk h2{font-size:22px;color:var(--blau)}
.tb{width:72px;height:72px;object-fit:cover;border-radius:12px;background:#fff;border:1px solid var(--linie)}
.tb.rund{object-fit:cover;border-radius:50%;border:3px solid var(--bad)}
.wahl{display:grid;gap:8px}
.wahl button{text-align:left;background:var(--creme);border:2px solid var(--blau-hell);border-radius:12px;padding:11px 13px;font-family:var(--sans);font-size:16px;line-height:1.35;cursor:pointer;color:var(--ink);touch-action:manipulation}
@media (hover:hover){.wahl button:not(:disabled):hover{border-color:var(--blau);background:#fff}}
.wahl button:disabled{cursor:default;opacity:.45}
.wahl button.gewaehlt{opacity:1;border-color:var(--ink);background:#fff;font-weight:bold}
.folge{border-radius:14px;padding:11px 14px;display:grid;gap:6px;font-family:var(--sans);font-size:15px;line-height:1.45;animation:rein .3s ease-out}
@keyframes rein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.folge.r2{background:#e3f0e7;border:1px solid #b9d8c4}
.folge.r1{background:#fbf3e2;border:1px solid #ead9b5}
.folge.r0{background:#f7e3df;border:1px solid #e6bdb5}
.folge .urteil{font-weight:bold;font-size:16px}
.folge.r2 .urteil{color:var(--ok)} .folge.r1 .urteil{color:var(--honig-tief)} .folge.r0 .urteil{color:var(--bad)}
.chip{display:inline-block;margin-left:6px;background:rgba(255,255,255,.8);border-radius:999px;padding:2px 10px;font-size:14px;color:var(--bad)}
.chip.gut{color:var(--ok)}
.weiter{display:flex;justify-content:center}
.gross-knopf{font-size:18px;padding:13px 26px}
.wuerfel{display:grid;justify-items:center;gap:8px;padding:26px 0;font-family:var(--sans);color:var(--ink-soft)}
.wuerfel .auge{width:78px;height:78px;border-radius:18px;background:#fff;border:3px solid var(--blau);display:grid;place-items:center;font-size:42px;font-weight:bold;color:var(--blau);animation:wurf .35s ease-out}
@keyframes wurf{from{transform:rotate(-200deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.vier{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.vier figure{margin:0;background:#fff;border:1px solid var(--linie);border-radius:12px;padding:4px 4px 6px;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.vier img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.ende{background:var(--tile);border:1px solid var(--linie);border-radius:18px;text-align:center;display:grid;gap:10px;padding:16px 16px 20px}
.ende h2{font-size:30px;color:var(--blau)}
.ende .gross{font-size:42px;letter-spacing:6px;line-height:1}
.falter{width:min(420px,100%);height:auto;margin:0 auto;border-radius:14px}
.konffeld{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.konf{position:absolute;top:-40px;font-size:22px;animation:fall 3.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (max-width:420px){body{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";

/* ============ Das Spielfeld: 24 Felder vom Ei zur Libelle (Große Pechlibelle) ============
   art: fakt (nur lesen) · leiter/rutsche (d Felder vor/zurück) · frage (w = Antworten)
   Antwort: ok = richtig (plus = Bonusfelder) · sonst d = Felder zurück, ei = zurück zum Ei
   tor: An diesen Feldern hält man immer an (Häutung, Landgang, Jungfernflug, Eiablage).
   Die Felder 1 bis 18 liegen unter Wasser, 19 bis 24 in der Luft – eine Puppe gibt es nicht. */
const TORE = [8, 18, 20, 24];
const STADIEN = [
  { bis: 2, n: "Ei", em: "🥚", bild: "pl-2-eiablage.jpg", farbe: "#e9d98a" },
  { bis: 17, n: "Larve", em: "larve", bild: "pl-3-larve-klein.jpg", farbe: "#8fc0d6" },
  { bis: 20, n: "Schlupf", em: "✨", bild: "pl-6-frisch.jpg", farbe: "#d9c79a" },
  { bis: 24, n: "Libelle", em: "libelle", bild: "pl-7-imago.jpg", farbe: "#9fd0a8" }
];
const stadium = pos => STADIEN.find(s => pos <= s.bis);
const FELD = {
  1: { art: "fakt", em: "🥚", t: "Ein Ei im Stängel", x: "Du bist ein winziges Ei. Deine Mutter hat dich mit ihrem Legebohrer in den Stängel einer Wasserpflanze geschoben, knapp unter der Wasseroberfläche. Würfle los!" },
  2: { art: "fakt", em: "💧", t: "Geschlüpft – ins Wasser!", x: "Nach ein paar Wochen schlüpfst du. Du bist jetzt eine Larve: ohne Flügel, mit sechs Beinen und drei Blättchen am Hinterende. Dein Zuhause ist der Teich." },
  3: { art: "frage", em: "🌊", t: "Luft holen?", x: "Du lebst unter Wasser. Wie atmest du?",
    w: [{ l: "Mit den drei Blättchen am Hinterende", ok: true, plus: 1, k: "Die drei Blättchen sind Kiemen. Damit holst du den Sauerstoff direkt aus dem Wasser – auftauchen musst du nie." },
      { l: "Auftauchen und eine Luftblase mitnehmen", d: -1, k: "Das machen Wasserkäfer und Rückenschwimmer. Du brauchst das nicht: Du hast Kiemen." },
      { l: "Durch ein Atemrohr, das bis zur Oberfläche reicht", d: -1, k: "So atmen Stechmückenlarven. Du hast etwas Besseres: Kiemen." }] },
  4: { art: "fakt", em: "🌿", t: "Lauern", x: "Du sitzt reglos zwischen den Wasserpflanzen und wartest. Du bist ein Räuber – vom ersten Tag an." },
  5: { art: "frage", em: "🎯", t: "Beute!", x: "Ein Wasserfloh zuckt dicht an dir vorbei. Wie fängst du ihn?",
    w: [{ l: "Die Fangmaske vorschnellen lassen", ok: true, k: "Deine Unterlippe ist zu einem Greifarm umgebaut. Sie liegt zusammengeklappt unter dem Kopf und schießt blitzschnell nach vorn. So etwas haben nur Libellenlarven." },
      { l: "Hinterherschwimmen und zubeißen", d: -2, k: "Dafür bist du zu langsam – und wer herumschwimmt, wird selbst gesehen. Du gehst leer aus." },
      { l: "Mit den Vorderbeinen zupacken", d: -2, k: "Deine Beine sind zum Festhalten an Pflanzen da. Der Wasserfloh ist längst weg." }] },
  6: { art: "frage", em: "🐟", tod: "als Larve von einem Fisch gefressen", t: "Ein Fisch!", x: "Ein Fisch schwimmt langsam auf dich zu. Was tust du?",
    w: [{ l: "Dich reglos an den Stängel schmiegen", ok: true, k: "Braun und grün gefleckt bist du zwischen den Pflanzen kaum zu sehen. Fische schnappen vor allem nach dem, was sich bewegt." },
      { l: "Ins freie Wasser davonschwimmen", ei: true, k: "Im freien Wasser bist du ein Leckerbissen ohne Deckung. Der Fisch ist viel schneller." },
      { l: "Nach oben zur Wasseroberfläche flüchten", ei: true, k: "Bewegung verrät dich – und oben gibt es kein Versteck." }] },
  7: { art: "fakt", em: "😣", t: "Es zwickt", x: "Du bist gewachsen – aber deine Haut nicht. Sie spannt überall." },
  8: { art: "fakt", em: "🧥", tor: true, t: "Häutung!", x: "Deine alte Haut platzt auf, und du schlüpfst in einer größeren heraus. Das passiert dir im Wasser etwa zehnmal. Jedes Mal sind die kleinen Flügelanlagen auf deinem Rücken etwas länger." },
  9: { art: "frage", em: "🤏", tod: "vom Rückenschwimmer erbeutet", t: "Gepackt!", x: "Ein Rückenschwimmer hat dich an einem deiner drei Kiemenblättchen erwischt. Was tust du?",
    w: [{ l: "Das Blättchen abwerfen und verschwinden", ok: true, k: "Wie eine Eidechse ihren Schwanz kannst du ein Kiemenblättchen opfern. Bei den nächsten Häutungen wächst es nach." },
      { l: "Dich umdrehen und mit der Fangmaske zuschnappen", ei: true, k: "Der Rückenschwimmer ist stärker und sticht mit seinem Rüssel zu." },
      { l: "Dich tot stellen", ei: true, k: "Das beeindruckt ihn nicht. Er hat dich ja schon." }] },
  10: { art: "leiter", em: "🦟", d: 2, t: "Mückenlarven in Massen", x: "Der Teich wimmelt von Mückenlarven. Du frisst dich satt und wächst wie von selbst." },
  11: { art: "frage", em: "❄️", tod: "im Winter an Land erfroren", t: "Der Teich friert zu", x: "Es ist Winter geworden. Auf dem Teich liegt eine Eisdecke. Was tust du?",
    w: [{ l: "Am Grund zwischen den Pflanzen ausharren", ok: true, plus: 1, k: "Unter dem Eis bleibt das Wasser am Grund flüssig und etwa vier Grad kalt. Dort überwinterst du fast regungslos – als Larve." },
      { l: "An Land kriechen und dich im Laub verkriechen", ei: true, k: "An der Luft kannst du mit deinen Kiemen nicht atmen, und im Laub erfrierst du." },
      { l: "Dich im Eis einfrieren lassen", d: -2, k: "Das würdest du nicht überleben. Im letzten Moment rettest du dich in tieferes Wasser. Libellenlarven brauchen Teiche, die nicht bis zum Grund durchfrieren." }] },
  12: { art: "fakt", em: "🎒", t: "Flügel im Rucksack", x: "Auf deinem Rücken liegen jetzt deutlich sichtbar vier kleine Flügelscheiden. Darin wachsen die Flügel heran. Eine Puppe wirst du nie." },
  13: { art: "rutsche", em: "🧹", d: -2, t: "Teichputz", x: "Jemand reißt die Wasserpflanzen aus dem Teich, damit er „ordentlich“ aussieht. Dein Versteck ist weg – du musst dir ein neues suchen." },
  14: { art: "frage", em: "😬", tod: "von einer großen Libellenlarve gefressen", t: "Eine Riesin", x: "Vor dir lauert eine Libellenlarve, die viermal so groß ist wie du. Was tust du?",
    w: [{ l: "Einen weiten Bogen um sie machen", ok: true, k: "Klug. Die Larven der großen Libellen fressen alles, was sie überwältigen können – auch kleinere Libellenlarven." },
      { l: "Einfach vorbeikrabbeln – Libellen fressen doch keine Libellen", ei: true, k: "Doch, das tun sie. Ihre Fangmaske schnellt vor, und das war es." }] },
  15: { art: "fakt", em: "👀", t: "Etwas verändert sich", x: "Du frisst nicht mehr. Deine Augen werden größer, und du sitzt immer öfter dicht unter der Wasseroberfläche." },
  16: { art: "frage", em: "🌤️", tod: "beim Schlüpfen von Regen und Wind erwischt", t: "Der große Tag", x: "Du bist ausgewachsen. Wann kletterst du aus dem Wasser?",
    w: [{ l: "An einem warmen, windstillen Morgen", ok: true, k: "Zum Schlüpfen brauchst du Ruhe und Wärme: Deine neuen Flügel sind zuerst weich wie nasses Papier." },
      { l: "Bei Regen – dann sind keine Vögel unterwegs", ei: true, k: "Regentropfen und Wind zerknittern die weichen Flügel für immer. Schlechtes Wetter ist beim Schlüpfen die größte Gefahr." },
      { l: "Sofort – das Wetter ist doch gleichgültig", d: -2, k: "Ist es nicht! Du hast Glück im Unglück: Eine Welle spült dich vom Halm, bevor deine Haut aufplatzt. Neuer Anlauf bei besserem Wetter." }] },
  17: { art: "fakt", em: "🎋", t: "Der richtige Halm", x: "Du suchst dir einen kräftigen Halm, der aus dem Wasser ragt, und kletterst langsam nach oben." },
  18: { art: "fakt", em: "🧗", tor: true, land: true, t: "Raus aus dem Wasser!", x: "Zum ersten Mal in deinem Leben bist du an der Luft. Du krallst dich am Halm fest. Jetzt geschieht die ganze Verwandlung in einer einzigen, letzten Häutung – ohne Puppe." },
  19: { art: "frage", em: "✨", tod: "mit weichen Flügeln abgestürzt", t: "Geschlüpft!", x: "Deine Larvenhaut platzt am Rücken auf, und du ziehst dich heraus: blass, weich, mit zerknitterten Flügeln. Was tust du?",
    w: [{ l: "Still hängen bleiben und Flügel und Hinterleib aufpumpen", ok: true, k: "Du pumpst Körperflüssigkeit in die Flügel, bis sie glatt und hart sind. Die leere Larvenhaut bleibt am Halm hängen – man kann sie im Sommer am Teich finden." },
      { l: "Sofort losfliegen, bevor ein Vogel kommt", ei: true, k: "Weiche Flügel tragen nicht. Du stürzt ins Wasser." },
      { l: "Zurück ins Wasser – dort kennst du dich aus", ei: true, tod: "als frisch geschlüpfte Libelle ertrunken", k: "Du hast keine Kiemen mehr. Als Libelle atmest du Luft – im Wasser ertrinkst du." }] },
  20: { art: "frage", em: "🛫", tor: true, tod: "beim ersten Flug vom Frosch geschnappt", t: "Jungfernflug", x: "Nach einer guten Stunde sind die Flügel fest. Wohin geht dein erster Flug?",
    w: [{ l: "Weg vom Teich – in eine Wiese oder Hecke", ok: true, k: "Frisch geschlüpfte Libellen fliegen erst einmal vom Wasser fort. Abseits vom Teich jagen sie und färben sich aus. Erst nach Tagen kehren sie zurück." },
      { l: "Dicht über das Wasser zu den anderen Libellen", ei: true, k: "Du fliegst noch unsicher und langsam. Am Ufer sitzt ein Frosch und wartet genau auf so etwas." }] },
  21: { art: "frage", em: "🍽️", t: "Hunger!", x: "Wie jagst du jetzt?",
    w: [{ l: "Mücken im Flug mit den Beinen greifen", ok: true, plus: 1, k: "Deine sechs Beine bilden einen Fangkorb. Damit fischst du Mücken und Fliegen aus der Luft und frisst sie oft noch im Flug." },
      { l: "Mit der Fangmaske, wie früher", d: -1, k: "Die Fangmaske ist mit der Larvenhaut am Halm geblieben. Als Libelle jagst du ganz anders." },
      { l: "Mit dem Giftstachel zustechen", d: -1, k: "Libellen haben keinen Stachel und können nicht stechen – auch wenn das viele Menschen glauben." }] },
  22: { art: "frage", em: "🐦", feind: "../images/durchsjahr/47.jpg?v=5", tod: "als Libelle von der Rauchschwalbe gefangen", t: "Die Rauchschwalbe!", x: "Ein Schatten schießt über die Wiese auf dich zu: eine Rauchschwalbe auf Insektenjagd. Was tust du?",
    w: [{ l: "Einen Haken schlagen und ins Schilf abtauchen", ok: true, k: "Du kannst jeden deiner vier Flügel einzeln bewegen: in der Luft stehen, rückwärts fliegen, blitzschnell wenden. Im dichten Schilf kommt die Schwalbe nicht hinterher." },
      { l: "Geradeaus davonfliegen, so schnell es geht", ei: true, k: "Auf gerader Strecke ist die Schwalbe schneller als du." },
      { l: "In der Luft stehen bleiben und drohen", ei: true, k: "Eine Schwalbe lässt sich nicht einschüchtern. Für sie bist du ein fetter Happen." }] },
  23: { art: "fakt", em: "💙", bild: "pl-1-paarung.jpg", t: "Ein Herz aus zwei Libellen", x: "Du bist zum Teich zurückgekehrt und hast einen Partner gefunden. Zusammen bildet ihr das Paarungsrad – es sieht aus wie ein Herz." },
  24: { art: "frage", em: "🏁", tor: true, bild: "pl-2-eiablage.jpg", t: "Der Kreis schließt sich", x: "Wohin legst du deine Eier?",
    w: [{ l: "In die Stängel von Wasserpflanzen, knapp unter der Oberfläche", ok: true, k: "Genau dort hat alles angefangen. Mit dem Legebohrer schiebst du jedes Ei einzeln in das Pflanzengewebe." },
      { l: "Auf die Unterseite von Blättern am Ufer, wie ein Schmetterling", d: -2, k: "Deine Larven brauchen Wasser. An Land würden sie vertrocknen." },
      { l: "Einfach über dem offenen Wasser fallen lassen", d: -2, k: "Manche großen Libellen machen das. Die Pechlibelle nicht: Sie sticht ihre Eier in Wasserpflanzen." }] }
};

/* ============ Spielregeln (ohne Anzeige) ============ */
const mische = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const neuerStand = () => ({ pos: 1, versuch: 1, opfer: [] });
// Würfeln: ein bis drei Felder, aber nie über das nächste Tor hinaus
function ziehe(st, rnd) { const w = 1 + Math.floor(rnd() * 3), tor = TORE.find(t => t > st.pos) || 24; return { w, ziel: Math.min(st.pos + w, tor) }; }
function zumEi(st, grund) { st.opfer.push(grund); st.pos = 1; st.versuch++; }
const sterne = st => st.versuch === 1 ? 3 : st.versuch <= 3 ? 2 : 1;
if (typeof module !== "undefined") module.exports = { FELD, TORE, neuerStand, ziehe, zumEi, sterne };

/* ============ Helfer und Speicher (nur auf diesem Gerät) ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEY = "mibaso.fauna.libellenspiel", BILD = "../assets/verwandlung/";
function laden() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
let S = laden();
function speichern() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const app = $("#app");
const sterneHTML = n => `<span aria-label="${n} von 3 Sternen">${[0, 1, 2].map(k => `<span class="${k < n ? "" : "stern-leer"}">⭐</span>`).join("")}</span>`;
const fuss = () => `<footer class="fuss">
  <div>Dein Spielstand wird nur auf diesem Gerät gespeichert. Keine Anmeldung, keine Datensammlung.</div>
  <div><a href="../../index.html">⌂ Bio Mibaso</a> · <a href="../../ueber/">Über mich</a> · <a href="../../impressum/">Impressum &amp; Datenschutz</a></div>
  <div>© 2026 Michael Baur · Vom Wasser in die Luft</div></footer>`;
function konfetti() {
  if (reduce) return;
  const f = document.createElement("div"); f.className = "konffeld"; const z = ["💧", "⭐", "🌿", "✨", "💙"];
  for (let k = 0; k < 40; k++) { const e = document.createElement("span"); e.className = "konf"; e.textContent = z[k % z.length]; e.style.cssText = `left:${Math.random() * 100}%;animation-delay:${(Math.random() * .9).toFixed(2)}s`; f.appendChild(e); }
  document.body.appendChild(f); setTimeout(() => f.remove(), 4800);
}

/* ============ Spielbrett: vier Reihen, von unten nach oben ============ */
const xy = n => { const r = Math.floor((n - 1) / 6), c = (n - 1) % 6, x = 32 + (r % 2 ? 5 - c : c) * 55.2; return [x, 232 - r * 64]; };
function brettSVG(st, gesehen) {
  let weg = ""; for (let n = 1; n < 24; n++) { const a = xy(n), b = xy(n + 1); weg += `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`; }
  const felder = Array.from({ length: 24 }, (_, i) => { const n = i + 1, p = xy(n), F = FELD[n], S2 = stadium(n), zeig = F.tor || gesehen[n] || n === 1;
    return `<g class="feld${F.tor ? " tor" : ""}${n < st.pos ? " war" : ""}"><circle cx="${p[0]}" cy="${p[1]}" r="${F.tor ? 21 : 18}" fill="${S2.farbe}"/>
      <text x="${p[0]}" y="${p[1] + (zeig ? 6 : 4.5)}" class="${zeig ? "fe" : "fn"}">${zeig ? F.em : n}</text></g>`; }).join("");
  const p = xy(st.pos);
  return `<svg viewBox="0 0 340 264" class="brett" role="img" aria-label="Spielbrett mit 24 Feldern: vom Ei unten im Teich bis zur Libelle oben in der Luft">
    <clipPath id="rund"><rect width="340" height="264" rx="14"/></clipPath>
    <g clip-path="url(#rund)"><rect width="340" height="264" fill="#e9f3fb"/>
      <path d="M0 72 Q20 66 40 72 T80 72 T120 72 T160 72 T200 72 T240 72 T280 72 T320 72 T360 72 V264 H0 Z" fill="#cfe6f1"/>
      <g stroke="#7fa66b" stroke-width="3" stroke-linecap="round" fill="none"><path d="M322 150 Q326 90 320 18"/><path d="M330 160 Q336 110 334 44"/><path d="M12 264 Q8 200 14 150"/><path d="M22 264 Q26 220 20 176"/></g></g>
    <g stroke="#9db7c4" stroke-width="7" stroke-linecap="round">${weg}</g>${felder}
    <g id="figur" style="transform:translate(${p[0]}px,${p[1]}px)"><circle r="15" fill="#fff" stroke="#233D5C" stroke-width="3"/>${figur(stadium(st.pos).em)}</g>
  </svg>`;
}
// Für Larve und Libelle gibt es kein passendes Emoji – deshalb zwei kleine Zeichnungen
const figur = em => em === "larve" ? `<g stroke="#5b4a34" stroke-width="1.4" stroke-linecap="round" fill="#7a6648"><path d="M-3 -3 L-9 -6 M3 -3 L9 -6 M-3 0 L-9 1 M3 0 L9 1 M-3 3 L-8 7 M3 3 L8 7" fill="none"/><ellipse cx="0" cy="1" rx="3.2" ry="7"/><circle cx="0" cy="-8" r="3.4"/><path d="M0 7 L-4 12 M0 7 L0 13 M0 7 L4 12" fill="none" stroke-width="2"/></g>`
  : em === "libelle" ? `<g><path d="M0 -5 L-12 -9 Q-14 -5 -2 -3 Z M0 -5 L12 -9 Q14 -5 2 -3 Z M0 -2 L-11 2 Q-12 5 -1 0 Z M0 -2 L11 2 Q12 5 1 0 Z" fill="#bcd9ee" stroke="#4f7fa3" stroke-width=".8"/><rect x="-1.3" y="-6" width="2.6" height="17" rx="1.3" fill="#2f6f9f"/><circle cx="0" cy="-8.5" r="3" fill="#1c3f5c"/></g>`
  : `<text y="6.5" class="ff">${em}</text>`;
const zeichen = s => s.em.length > 3 ? `<svg viewBox="-16 -16 32 32" width="1.2em" height="1.2em" style="vertical-align:-.25em">${figur(s.em)}</svg>` : s.em;
const legende = () => `<div class="legende">${STADIEN.map(s => `<span><i style="background:${s.farbe}"></i>${s.n}</span>`).join("")}</div>`;

/* ============ Startseite ============ */
function seiteStart() {
  const d = S.spiel;
  app.innerHTML = `<header class="app-head">
    <a class="zurueck-kopf" href="verwandlung.html">‹ Wie wird man Insekt?</a>
    <div class="logo">🥚💧🎋💙</div><h1>Vom Wasser in die Luft</h1><div class="untertitel">Das Libellen-Leiterspiel – Verwandlung ohne Puppe</div></header>
  <div class="huelle">
    <section>
      <div class="vier">${STADIEN.map(s => `<figure><img src="${BILD}${s.bild}" alt=""><figcaption>${s.n}</figcaption></figure>`).join("")}</div>
      <p class="lead">Du bist eine Pechlibelle – noch nicht ganz: Du bist ein Ei in einer Wasserpflanze. Fast dein ganzes Leben verbringst du unter Wasser. Schaffst du es bis in die Luft? Im Teich lauern Fische, Rückenschwimmer und größere Libellenlarven, darüber die Rauchschwalbe.</p>
      <div class="regeln">
        <div class="regel"><span class="e">🎲</span><span><b>Würfeln:</b> Du rückst ein bis drei Felder vor. An Häutung, Landgang und Jungfernflug kommt niemand vorbei – dort hältst du immer an.</span></div>
        <div class="regel"><span class="e">❓</span><span><b>Entscheiden:</b> Auf vielen Feldern musst du wählen. Wer richtig liegt, kommt oft schneller voran.</span></div>
        <div class="regel"><span class="e">💥</span><span><b>Erwischt:</b> Wer gefressen wird oder abstürzt, fängt als neues Ei wieder ganz unten an.</span></div>
      </div>
      <div class="knopfreihe"><button type="button" class="knopf prim gross-knopf" id="los">▶ Los geht’s</button></div>
      ${d && d.n ? `<p class="klein" style="text-align:center">${d.sterne ? sterneHTML(d.sterne) + " · " : ""}${d.n}× gespielt${d.best ? " · bestes Ergebnis: geschafft als Ei Nr. " + d.best : ""}</p>` : `<p class="klein" style="text-align:center">Ein Durchgang dauert drei bis fünf Minuten.</p>`}
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>Das Libellen-Leiterspiel gehört zum Lernpfad „Wie wird man Insekt?“ und zeigt die unvollständige Verwandlung am Beispiel der Großen Pechlibelle: Ei, Larve im Wasser mit vielen Häutungen, Schlupf an der Luft – ohne Puppe. Es ist das Gegenstück zum Spiel „Vom Ei zum Falter“.</p>
        <ul class="clean">
          <li><b>Inhalte:</b> Eiablage in Wasserpflanzen, Kiemenblättchen, Fangmaske, Tarnung, Häutungen und Flügelscheiden, Überwinterung als Larve, Schlupf am Halm und Larvenhaut, Aufpumpen der Flügel, Jungfernflug, Fangkorb aus Beinen, Flugkunst, Paarungsrad.</li>
          <li><b>Feinde und Gefahren:</b> Fisch, Rückenschwimmer, große Libellenlarven, schlechtes Wetter beim Schlüpfen, Frosch, Rauchschwalbe; dazu der „aufgeräumte“ Teich.</li>
          <li><b>Vergleich:</b> Beide Leiterspiele nacheinander spielen und vergleichen lassen: Wo ist die Puppe? Was frisst die Larve, was das erwachsene Tier? Wer lebt wo?</li>
          <li><b>Querverbindung:</b> Im Spiel „Durchs Jahr!“ ist man selbst die Rauchschwalbe und jagt Insekten im Flug.</li>
          <li><b>Zeit:</b> drei bis fünf Minuten je Durchgang; ohne Ton, ohne Anmeldung.</li>
        </ul>
        <div class="knopfreihe"><button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $("#los").onclick = () => { location.hash = "spiel"; };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Das Spiel ============ */
function seiteSpiel() {
  const st = neuerStand(), gesehen = {}; let laeuft = false, timer = 0;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span id="status"></span></div></div></div>
    <div class="huelle breit"><section><div class="karte"><div class="tisch"><div class="links"><div id="brett"></div>${legende()}</div><div id="tafel" class="tafel"></div></div></div></section>${fuss()}</div>`;
  const brett = $("#brett"), tafel = $("#tafel");
  const kopf = () => { $("#status").innerHTML = `<b>${st.versuch === 1 ? "Erster Versuch" : "Versuch " + st.versuch}</b> · ${stadium(st.pos).n} · Feld ${st.pos} von 24`; };
  const zeichne = () => { brett.innerHTML = brettSVG(st, gesehen); kopf(); };
  const wuerfelKnopf = text => `<div class="weiter"><button type="button" class="knopf prim gross-knopf" id="wurf">🎲 ${text || "Würfeln"}</button></div>`;
  const kopfBild = (F, pos) => F.feind ? `<img class="tb rund" src="${F.feind}" alt="Rauchschwalbe">` : `<img class="tb" src="${BILD}${F.bild || (F.land ? "pl-4-larve-gross.jpg" : pos >= 9 && pos <= 17 ? "pl-4-larve-gross.jpg" : stadium(pos).bild)}" alt="${stadium(pos).n}">`;
  // Figur Feld für Feld ziehen lassen, dann weiter
  function laufe(von, nach, dann) {
    const schritt = nach > von ? 1 : -1; let p = von; laeuft = true;
    const tick = () => { p += schritt; const f = $("#figur"), q = xy(p); if (f) f.style.transform = `translate(${q[0]}px,${q[1]}px)`;
      if (p === nach) { timer = setTimeout(() => { laeuft = false; st.pos = nach; zeichne(); dann(); }, reduce ? 0 : 260); } else timer = setTimeout(tick, reduce ? 0 : Math.abs(nach - von) > 6 ? 70 : 240); };
    if (von === nach) { laeuft = false; dann(); } else tick();
  }
  function wuerfeln() {
    if (laeuft) return;
    const z = ziehe(st, Math.random);
    tafel.innerHTML = `<div class="wuerfel" aria-live="polite"><span class="auge">${z.w}</span><span>${z.w === 1 ? "ein Feld" : z.w + " Felder"} vor${z.ziel - st.pos < z.w ? " – bis zum nächsten Halt" : ""}</span></div>`;
    laufe(st.pos, z.ziel, () => lande());
  }
  function zurueckZumEi(grund, knopf) {
    tafel.insertAdjacentHTML("beforeend", `<div class="weiter"><button type="button" class="knopf honig gross-knopf" id="neu">🥚 ${knopf || "Als neues Ei beginnen"}</button></div>`);
    $("#neu").onclick = () => { if (laeuft) return; $("#neu").disabled = true; const von = st.pos; zumEi(st, grund); st.pos = von; kopf();
      laufe(von, 1, () => { tafel.innerHTML = `<div class="tk">${kopfBild(FELD[1], 1)}<div><span class="eyebrow">Versuch ${st.versuch}</span><h2>Ein neues Ei</h2></div></div>
        <p>Zum Glück warst du nicht das einzige Ei. Jetzt bist du Nummer ${st.versuch} – und weißt schon ein bisschen mehr.</p>${wuerfelKnopf()}`; $("#wurf").onclick = wuerfeln; }); };
  }
  function lande() {
    const pos = st.pos, F = FELD[pos]; gesehen[pos] = true; zeichne();
    const titel = `<div class="tk">${kopfBild(F, pos)}<div><span class="eyebrow">Feld ${pos} · ${stadium(pos).n}</span><h2>${F.em} ${F.t}</h2></div></div>`;
    if (F.art === "fakt") { tafel.innerHTML = `${titel}<p>${F.x}</p>${wuerfelKnopf()}`; $("#wurf").onclick = wuerfeln; return; }
    if (F.art === "leiter" || F.art === "rutsche") {
      tafel.innerHTML = `${titel}<p>${F.x}</p><div class="folge ${F.d > 0 ? "r2" : "r0"}" role="status"><span class="urteil">${F.d > 0 ? "🪜 " + F.d + " Felder vor!" : "↩ " + (-F.d) + " Felder zurück!"}</span></div>`;
      return laufe(pos, pos + F.d, () => { tafel.insertAdjacentHTML("beforeend", wuerfelKnopf()); $("#wurf").onclick = wuerfeln; });
    }
    const w = mische(F.w);
    tafel.innerHTML = `${titel}<p>${F.x}</p><div class="wahl">${w.map((o, i) => `<button type="button" data-i="${i}">${o.l}</button>`).join("")}</div><div id="folge"></div>`;
    $$(".wahl button", tafel).forEach(b => b.onclick = () => {
      const o = w[+b.dataset.i];
      $$(".wahl button", tafel).forEach(x => { x.disabled = true; x.classList.toggle("gewaehlt", x === b); });
      const zusatz = o.ok ? (o.plus ? `<span class="chip gut">🪜 ${o.plus === 1 ? "ein Feld" : o.plus + " Felder"} vor</span>` : "") : o.d ? `<span class="chip">↩ ${-o.d === 1 ? "ein Feld" : (-o.d) + " Felder"} zurück</span>` : o.ei ? `<span class="chip">💥 zurück zum Ei</span>` : "";
      $("#folge").innerHTML = `<div class="folge ${o.ok ? "r2" : "r0"}" role="status"><span class="urteil">${o.ok ? "Richtig!" : o.ei ? "Erwischt!" : "Falsch gedacht."} ${zusatz}</span><span>${o.k}</span></div>`;
      if (o.ei) return zurueckZumEi(o.tod || F.tod);
      if (o.ok && pos === 24) { tafel.insertAdjacentHTML("beforeend", `<div class="weiter"><button type="button" class="knopf prim gross-knopf" id="fertig">Geschafft ›</button></div>`); $("#fertig").onclick = ende; return; }
      const nach = pos + (o.ok ? (o.plus || 0) : (o.d || 0));
      laufe(pos, nach, () => { const zielTor = pos === 24 && !o.ok;
        tafel.insertAdjacentHTML("beforeend", wuerfelKnopf(zielTor ? "Noch einmal würfeln" : "")); $("#wurf").onclick = wuerfeln; $("#wurf").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" }); });
    });
  }
  function ende() {
    const n = sterne(st), alt = S.spiel || {};
    S.spiel = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.min(alt.best || 99, st.versuch) }; speichern();
    window.scrollTo(0, 0);
    $(".huelle section").innerHTML = `<div class="ende">
        <img class="falter" src="${BILD}pl-7-imago.jpg" alt="Große Pechlibelle">
        <span class="eyebrow">Vom Wasser in die Luft</span><h2>Du fliegst!</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p>${st.versuch === 1 ? "Gleich beim ersten Versuch vom Ei zur Libelle – das schaffen in der Natur nur ganz wenige." : "Geschafft als Ei Nummer " + st.versuch + ". Deine Vorgänger hatten weniger Glück: " + [...new Set(st.opfer)].join(", ") + "."}</p>
        <p class="klein">Fast ihr ganzes Leben verbringt eine Libelle als Larve im Wasser – als fliegendes Insekt lebt sie nur wenige Wochen. Und eine Puppe gab es auf dem ganzen Weg nicht: Das nennt man unvollständige Verwandlung.</p>
        <div class="knopfreihe"><button type="button" class="knopf prim" id="noch">🔁 Noch einmal</button><a class="knopf" href="falterspiel.html">Zum Vergleich: Vom Ei zum Falter</a><a class="knopf" href="verwandlung.html">Zum Lernpfad</a><a class="knopf honig" href="durchs-jahr.html">Seitenwechsel: Spiel die Rauchschwalbe ›</a></div>
      </div>`;
    $("#noch").onclick = seiteSpiel; konfetti();
  }
  zeichne();
  tafel.innerHTML = `<div class="tk">${kopfBild(FELD[1], 1)}<div><span class="eyebrow">Feld 1 · Ei</span><h2>${FELD[1].em} ${FELD[1].t}</h2></div></div><p>${FELD[1].x}</p>${wuerfelKnopf()}`;
  $("#wurf").onclick = wuerfeln;
  window.libelleStop = () => clearTimeout(timer);
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  if (window.libelleStop) window.libelleStop();
  $$(".konffeld").forEach(k => k.remove());
  if (location.hash.slice(1) === "spiel") seiteSpiel(); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
