<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Durchs Jahr! – Das Überlebensspiel · Bio Mibaso</title>
<meta name="description" content="Ein Lernspiel für Klasse 5/6: Als Kohlmeise oder Rauchschwalbe zwölf Monate überstehen – Revier, Nest und Junge, Feinde, Vogelzug und Winter. Mit Ereigniskarten, Zwischenspielen und zwei Leveln. Ohne Anmeldung.">
<meta name="theme-color" content="#233D5C">
<link rel="icon" href="../assets/icon.svg">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
/* Durchs Jahr! – Farben und Schrift wie die Forscherpässe von Fauna Mibaso */
:root{
  --blau:#233D5C; --blau-tief:#1a2f47; --blau-mittel:#33587c; --blau-hell:#bcd0e2;
  --creme:#F7F3E8; --creme-tief:#EEE7D5; --tile:#FFFFFF;
  --honig:#C28A3A; --honig-tief:#a9762c;
  --ink:#1c2e42; --ink-soft:#5d6b78; --linie:#d9d2c1;
  --ok:#2f6a45; --bad:#B23B2E; --mittel:#a9762c;
  --fruehling:#7fae5a; --sommer:#e0a630; --herbst:#c06a2c; --winter:#6f9cc4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--blau-tief);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100vh}
img{max-width:100%}
a{color:var(--blau)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:2px}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
section{padding-top:24px;display:grid;gap:14px}
.app-head{background:linear-gradient(180deg,var(--blau-tief) 0%,var(--blau-mittel) 100%);color:var(--creme);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) 24px;border-bottom:4px double var(--blau-hell);position:relative}
.app-head .zurueck-kopf{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);color:#dce8f3;font-family:var(--sans);font-size:14px;text-decoration:none;padding:6px}
.app-head .logo{font-size:40px;line-height:1;margin:14px 0 6px;letter-spacing:6px}
.app-head h1{font-size:clamp(30px,9vw,44px);letter-spacing:.02em}
.app-head .untertitel{font-style:italic;color:#dce8f3;margin-top:8px;font-size:clamp(14px,3.8vw,17px)}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:19px}
.klein{font-size:15px;color:var(--ink-soft)}
.h-blau{color:var(--blau);font-size:26px} .h-honig{color:var(--honig-tief);font-size:22px}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:5px}
.knopf{display:inline-block;border:1px solid var(--blau);background:var(--tile);color:var(--blau);border-radius:12px;padding:11px 18px;font-family:var(--sans);font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--blau);color:#fff;box-shadow:0 2px 0 var(--blau-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fuss{margin-top:34px;padding-top:16px;border-top:1px solid var(--linie);font-family:var(--sans);font-size:13px;color:var(--ink-soft);text-align:center;display:grid;gap:6px}
details.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 16px;font-size:16px}
details.lehrer summary{cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--blau);font-weight:bold}
details.lehrer .grid{display:grid;gap:10px;padding-top:10px}

/* Startseite: Regeln und Level */
.regeln{display:grid;gap:8px;font-family:var(--sans);font-size:15px}
.regel{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 12px}
.regel .e{font-size:26px;text-align:center;line-height:1}
.regel b{color:var(--blau)}
.level{display:grid;gap:12px}
.lv{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--tile);border:2px solid var(--blau-hell);border-radius:16px;padding:12px;text-align:left;cursor:pointer;width:100%;font-family:var(--serif)}
.lv img{width:96px;height:96px;object-fit:cover;border-radius:12px;display:block;background:var(--creme-tief)}
.lv .nr{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--honig-tief);font-weight:bold}
.lv .nm{font-size:23px;color:var(--blau);display:block;line-height:1.2}
.lv .mo{font-size:15px;color:var(--ink-soft);display:block;line-height:1.35;margin-top:2px}
.lv .st{font-family:var(--sans);font-size:14px;color:var(--ink);display:block;margin-top:6px}
@media (hover:hover){.lv:not(:disabled):hover{border-color:var(--blau);box-shadow:0 4px 14px rgba(35,61,92,.14)}}
.lv:disabled{cursor:default;opacity:.6;border-style:dashed}
.lv:disabled img{filter:grayscale(1)}
.stern-leer{opacity:.22;filter:grayscale(1)}

/* Spiel: Kopfzeile mit Anzeigen und Jahresweg */
.spielkopf{position:sticky;top:0;z-index:6;background:var(--creme);border-bottom:1px solid var(--linie);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.spielkopf .innen{max-width:720px;margin:0 auto;display:grid;gap:8px}
.sk-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:14px}
.sk-zeile a{color:var(--blau);text-decoration:none;padding:4px 2px}
.sk-zeile b{color:var(--blau)}
.anzeigen{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
.anz{display:grid;gap:3px}
.anz .lab{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.anz .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.balken{height:10px;border-radius:999px;background:var(--creme-tief);overflow:hidden;border:1px solid var(--linie)}
.balken i{display:block;height:100%;border-radius:999px;transition:width .5s ease,background-color .3s}
.balken.e i{background:var(--honig)} .balken.s i{background:var(--blau-mittel)}
.balken.knapp i{background:var(--bad)}
.anz.junge{text-align:center;background:var(--tile);border:1px solid var(--linie);border-radius:10px;padding:4px 10px;min-width:74px;font-size:11px;line-height:1.25}
.anz.junge b{display:block;font-size:17px;color:var(--ink)}
.weg{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.weg span{height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--sans);font-size:11px;font-weight:bold;color:#fff;opacity:.38}
.weg .fruehling{background:var(--fruehling)} .weg .sommer{background:var(--sommer)} .weg .herbst{background:var(--herbst)} .weg .winter{background:var(--winter)}
.weg .war{opacity:.8}
.weg .jetzt{opacity:1;outline:3px solid var(--ink);outline-offset:1px;font-size:14px}

/* Ereigniskarte */
.karte{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden;animation:rein .35s ease-out}
@keyframes rein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.szene{position:relative;min-height:120px;display:grid;place-items:center;color:#fff;overflow:hidden}
.szene.fruehling{background:linear-gradient(180deg,#bfe0f0 0%,#bfe0f0 46%,#9cc76f 46%,#7fae5a 100%)}
.szene.sommer{background:linear-gradient(180deg,#8fc7ee 0%,#bfe3f5 50%,#e8c95f 50%,#d9ac3c 100%)}
.szene.herbst{background:linear-gradient(180deg,#d9d2c0 0%,#e6dcc6 48%,#c98a46 48%,#a9652a 100%)}
.szene.winter{background:linear-gradient(180deg,#9fb6cf 0%,#c9d8e6 50%,#f2f5f8 50%,#dfe7ee 100%)}
.szene .zeichen{font-size:clamp(46px,14vw,64px);line-height:1;letter-spacing:8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));padding:18px 0}
.szene img{display:block;width:100%;aspect-ratio:16/8;object-fit:cover}
.szene .wann{position:absolute;left:10px;top:10px;font-family:var(--sans);font-size:12px;font-weight:bold;letter-spacing:.05em;background:rgba(28,46,66,.82);color:#fff;border-radius:999px;padding:4px 11px}
.szene .zw{position:absolute;right:10px;top:10px;font-family:var(--sans);font-size:11px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;background:var(--bad);color:#fff;border-radius:999px;padding:4px 10px}
.k-text{padding:14px 16px 4px;display:grid;gap:8px}
.k-text h2{font-size:24px;color:var(--blau)}
.basis{font-family:var(--sans);font-size:14px;color:var(--ink-soft);background:var(--creme);border-radius:10px;padding:7px 11px}
.wahl{display:grid;gap:8px;padding:10px 16px 16px}
.wahl button{text-align:left;background:var(--creme);border:2px solid var(--blau-hell);border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:16px;line-height:1.35;cursor:pointer;color:var(--ink);touch-action:manipulation}
@media (hover:hover){.wahl button:not(:disabled):hover{border-color:var(--blau);background:#fff}}
.wahl button:focus:not(:focus-visible){outline:none}
.wahl button:disabled{cursor:default;opacity:.45}
.wahl button.gewaehlt{opacity:1;border-color:var(--ink);background:#fff;font-weight:bold}
.folge{margin:0 16px 16px;border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-family:var(--sans);font-size:15px;line-height:1.45;animation:rein .3s ease-out}
.folge.r2{background:#e3f0e7;border:1px solid #b9d8c4}
.folge.r1{background:#f6ead2;border:1px solid #e3cf9f}
.folge.r0{background:#f7e3df;border:1px solid #e6bdb5}
.folge .urteil{font-weight:bold;font-size:16px}
.folge.r2 .urteil{color:var(--ok)} .folge.r1 .urteil{color:var(--mittel)} .folge.r0 .urteil{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.75);border-radius:999px;padding:3px 10px;font-weight:bold;font-size:14px;font-variant-numeric:tabular-nums}
.chip.plus{color:var(--ok)} .chip.minus{color:var(--bad)}
.weiter{display:flex;justify-content:center;padding:0 16px 18px}

/* Zwischenspiel: Fangen */
.fang-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:15px;padding:0 16px}
.fang-hud b{font-size:20px;color:var(--blau);font-variant-numeric:tabular-nums}
.fang-zeit{height:8px;background:var(--creme-tief);border-radius:999px;overflow:hidden;margin:8px 16px 0}
.fang-zeit i{display:block;height:100%;background:var(--ok);width:100%}
.fang-feld{position:relative;margin:10px 16px 16px;height:min(46vh,340px);border-radius:14px;overflow:hidden;border:1px solid var(--linie);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fang-feld.fruehling,.fang-feld.sommer{background:linear-gradient(180deg,#cfe8f5 0%,#e3f1d4 100%)}
.fang-feld.winter{background:linear-gradient(180deg,#dfe8f0 0%,#f5f7f9 100%)}
.fang-feld.herbst{background:linear-gradient(180deg,#eadfc8 0%,#e3c9a0 100%)}
.ding{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:0;background:rgba(255,255,255,.55);border-radius:50%;font-size:32px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;animation:auf .18s ease-out;touch-action:manipulation}
@keyframes auf{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.ding.flug{animation:auf .18s ease-out, flug var(--dauer,1.3s) linear forwards}
@keyframes flug{to{translate:var(--dx,60px) var(--dy,-20px)}}
.ding.treffer{background:#bfe3c9;transform:scale(1.25);opacity:0;transition:all .25s}
.ding.falsch{background:#f1b9b0;transform:scale(.8);opacity:0;transition:all .3s}
.fang-start{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;gap:10px;align-content:center;font-family:var(--sans);font-size:16px;background:rgba(247,243,232,.9)}
.fang-leg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:15px}
.fang-leg span{white-space:nowrap}

/* Ende */
.ende{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden;text-align:center;display:grid;gap:10px;padding-bottom:20px}
.ende > *{margin-left:16px;margin-right:16px}
.ende > .szene{margin:0}
.ende h2{font-size:28px;color:var(--blau)}
.ende .gross{font-size:44px;letter-spacing:6px;line-height:1}
.werte{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--sans)}
.werte div{background:var(--creme);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--ink-soft)}
.werte b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.merk{display:grid;gap:8px;font-family:var(--sans);font-size:15px}
.merk div{background:var(--tile);border:1px solid var(--linie);border-left:4px solid var(--honig);border-radius:10px;padding:10px 12px;line-height:1.45}
.merk b{color:var(--blau)}
.merk a{display:inline-block;margin-top:4px;font-size:14px}
.pfade{display:grid;gap:8px}
.pfade a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:11px 14px;text-decoration:none;font-family:var(--sans);font-size:15px;color:var(--blau)}
.konffeld{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.konf{position:absolute;top:-40px;font-size:22px;animation:fall 3.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media (max-width:420px){body{font-size:17px}.lv{grid-template-columns:76px 1fr}.lv img{width:76px;height:76px}.anzeigen{font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
/* ============ Daten: Monate, Lernpfade, Tiere, Ereigniskarten ============ */
// Das Spieljahr beginnt im März (Index 0) und endet im Februar (Index 11).
const MONATE = ["März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember", "Januar", "Februar"];
const ZEITEN = [["fruehling", "Frühling", "🌱"], ["sommer", "Sommer", "☀️"], ["herbst", "Herbst", "🍂"], ["winter", "Winter", "❄️"]];
const zeit = m => ZEITEN[Math.floor(m / 3)];
// Lernpfade, auf die das Spiel verweist
const PFADE = {
  vogel: ["vogelpass.html", "Vogelpass – gebaut zum Fliegen"],
  zug: ["zugvogelpass.html", "Zugvogel-Pass – auf großer Reise"],
  winter: ["winterpass.html", "Expedition Winter – Tiere im Winter"],
  futter: ["futterhauspass.html", "Futterhaus-Pass – Vögel am Futterhaus"],
  netz: ["nahrungsnetz.html", "Lernpfad „Wer frisst wen?“"],
  wiese: ["wiese-lebt.html", "Lernpfad „Wie hängt alles zusammen?“"]
};
const EMAX = 10, SMAX = 10;

/* Karte: { t: Titel, sz: Szene (Zeichen), bild?: Datei, x: Text, p: Lernpfad,
            w: [{ l: Antwort, e: Energie, s: Sicherheit, r: 2 gut / 1 geht so / 0 schlecht, k: Erklärung, fx?: st => … }] }
   Zwischenspiel: { fang: true, … }  */
const TIERE = {
/* ------------------------------------------------------------------ Level 1 */
meise: {
  name: "Kohlmeise", em: "🐦", bild: "../images/zug/kohlmeise.jpg", level: 1,
  motto: "Sie bleibt das ganze Jahr hier – und muss durch den Winter.",
  intro: "Du bist eine Kohlmeise. Es ist März. Vor dir liegen zwölf Monate: Junge aufziehen, Feinden entkommen – und den Winter überstehen.",
  start: { e: 8, s: 8 },
  basis: [0, 0, 0, 1, 1, 1, -1, -1, -1, -2, -2, -2],
  basisText: { 1: "Im Sommer ist der Tisch reich gedeckt.", "-1": "Die Tage werden kürzer, das Futter knapper.", "-2": "Kälte und lange Nächte zehren an deinen Kräften." },
  brut2: 5, sterne: [6, 11],
  schluss: "Der Winter ist überstanden – und draußen singen schon die ersten Meisen. Ein neues Jahr beginnt.",
  ueberleben: "In der Natur übersteht nur etwa jede zweite erwachsene Kohlmeise ein ganzes Jahr.",
  monate: [
    { t: "Ein Revier muss her", sz: "🎶🌳", p: "vogel",
      x: "Die Sonne wärmt, überall wird gesungen. Wer brüten will, braucht jetzt ein Revier.",
      w: [
        { l: "Laut singen und das Revier abstecken", e: -1, s: 0, r: 2, k: "Mit dem Gesang sagen Vögel: Hier ist besetzt! Das kostet etwas Kraft, erspart aber meist den Kampf." },
        { l: "Still bleiben und Kraft sparen", e: 1, s: 0, r: 0, k: "Ohne Gesang kein Revier: Die besten Brutplätze schnappen sich jetzt die anderen.", fx: st => { st.nest *= .7; } },
        { l: "Jeden Rivalen sofort angreifen", e: -3, s: -1, r: 0, k: "Kämpfe kosten viel Kraft und sind gefährlich. Fast immer reicht der Gesang." }
      ] },
    { t: "Wohin mit dem Nest?", sz: "🏠🌸", p: "vogel",
      x: "Es wird Zeit für den Nestbau. Drei Plätze stehen zur Wahl.",
      w: [
        { l: "In den Nistkasten am Apfelbaum", e: 0, s: 1, r: 2, k: "Kohlmeisen sind Höhlenbrüter: In der Höhle sind Eier und Junge vor Regen, Elster und Sperber geschützt." },
        { l: "Offen in eine Astgabel", e: 0, s: -2, r: 0, k: "Offene Nester bauen Amsel und Buchfink. Ein Meisennest wäre dort für Elster und Eichhörnchen leichte Beute.", fx: st => { st.nest *= .5; } },
        { l: "In den Briefkasten am Gartentor", e: 0, s: -1, r: 1, k: "Das kommt wirklich vor! Aber jedes Mal, wenn die Post kommt, gibt es Aufregung.", fx: st => { st.nest *= .8; } }
      ] },
    { t: "Wie viele Eier?", sz: "🥚🥚🥚", p: "vogel",
      x: "Das Nest ist mit Moos und Haaren gepolstert. Wie viele Eier sollen es werden?",
      w: [
        { l: "3 Eier – lieber wenige", e: 0, s: 0, r: 1, k: "Sicher, aber wenig. Kohlmeisen legen meist 6 bis 12 Eier, denn viele Junge überleben ihr erstes Jahr nicht.", fx: st => { st.eier = 3; } },
        { l: "9 Eier", e: -1, s: 0, r: 2, k: "Das passt: 6 bis 12 Eier sind bei Kohlmeisen normal. Etwa zwei Wochen wird gebrütet.", fx: st => { st.eier = 9; } },
        { l: "15 Eier – so viele wie möglich", e: -3, s: 0, r: 0, k: "Zu viel des Guten: So viele Schnäbel bekommt kein Meisenpaar satt.", fx: st => { st.eier = 15; } }
      ] },
    { fang: true, t: "Hungrige Schnäbel", sz: "🐣🐛", p: "netz", e: 0,
      x: "Die Jungen sind geschlüpft und sperren die Schnäbel auf. Sie brauchen weiches, eiweißreiches Futter: Raupen, Spinnen und andere Kleintiere. Körner können sie noch nicht verdauen.",
      auftrag: "Tippe an, was die Jungen fressen können!",
      gut: ["🐛", "🕷️", "🪰", "🦗"], schlecht: ["🌻", "🍞", "🥜", "🍒"], ziel: 9, dauer: 24,
      nach: (st, q) => { const n = Math.round(Math.min(st.eier, 12) * st.nest * q * (st.eier > 12 ? .6 : 1)); st.jung += n; const von = st.eier; st.eier = 0; return n + " von " + von + " Jungen sind flügge geworden."; },
      k: "Ein Meisenpaar trägt an einem einzigen Tag mehrere hundert Raupen ans Nest. Ohne Raupen keine jungen Meisen – und ohne Meisen zu viele Raupen." },
    { t: "Die Jungen fliegen aus", sz: "🐥🌿", p: "vogel",

/* ============ Spielregeln (ohne Anzeige) ============ */
const mische = (a, rnd) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Jahresplan: je Monat die Hauptkarte, dazu vier zufällige Zwischenfälle in passenden Monaten
function jahresplan(tid, rnd) {
  const T = TIERE[tid], plan = T.monate.map(k => [k]);
  let n = 0;
  mische(T.zwischen, rnd).forEach(z => {
    if (n >= 4) return;
    const frei = []; for (let m = z.von; m <= z.bis; m++) if (plan[m].length === 1) frei.push(m);
    if (!frei.length) return;
    const m = frei[Math.floor(rnd() * frei.length)];
    if (rnd() < .5) plan[m].unshift(z); else plan[m].push(z);
    n++;
  });
  return plan;
}
const neuerStand = tid => ({ tid, e: TIERE[tid].start.e, s: TIERE[tid].start.s, eier: 0, nest: 1, jung: 0, fehler: [], gut: 0 });
const begrenze = st => { st.e = Math.min(EMAX, st.e); st.s = Math.min(SMAX, st.s); };
const tot = st => st.e <= 0 ? "kraft" : st.s <= 0 ? "feind" : "";
function waehle(st, karte, w, m) {
  st.e += w.e; st.s += w.s; if (w.fx) w.fx(st); begrenze(st);
  if (w.r === 0) st.fehler.push({ m, t: karte.t, k: w.k, p: karte.p }); else if (w.r === 2) st.gut++;
}
function sterne(st) { const T = TIERE[st.tid]; return tot(st) ? 0 : 1 + (st.jung >= T.sterne[0] ? 1 : 0) + (st.jung >= T.sterne[1] ? 1 : 0); }
if (typeof module !== "undefined") module.exports = { TIERE, jahresplan, neuerStand, waehle, tot, sterne, begrenze, EMAX };

    buehne.innerHTML = `<div class="karte">${szene(k, false)}
      <div class="k-text">${schritt === 0 ? basisHinweis : ""}<h2>${k.t}</h2><p>${k.x}</p></div>
      <div class="fang-hud"><span>${k.auftrag}</span><span>✔ <b id="fTreffer">0</b></span></div>
      <div class="fang-zeit"><i id="fZeit"></i></div>
      <div class="fang-feld ${zeit(m)[0]}" id="feld"><div class="fang-start">
        <div class="fang-leg"><span>✔ ${k.gut.join(" ")}</span><span>✖ ${k.schlecht.join(" ")}</span></div>
        <button type="button" class="knopf prim" id="fLos">▶ Los!</button></div></div>
      <div id="folge"></div></div>`;
    const feld = $("#feld");
    const stopp = () => { aktiv = false; cancelAnimationFrame(raf); clearInterval(spawn); laufend = null; };
    function neu() {
      if (!aktiv) return;
      const gut = Math.random() < .62, liste = gut ? k.gut : k.schlecht;
      const d = document.createElement("button"); d.type = "button"; d.className = "ding" + (k.flug && !reduce ? " flug" : "");
      d.textContent = liste[Math.floor(Math.random() * liste.length)]; d.dataset.gut = gut ? "1" : "";
      d.setAttribute("aria-label", gut ? "passt" : "passt nicht");
      const x = 12 + Math.random() * 76, y = 14 + Math.random() * 72, leben = k.flug ? 3000 : 2800;
      d.style.cssText = `left:${x}%;top:${y}%;--dx:${(Math.random() < .5 ? -1 : 1) * (50 + Math.random() * 60)}px;--dy:${-25 + Math.random() * 50}px;--dauer:${leben}ms`;
      d.addEventListener("pointerdown", ev => {
        ev.preventDefault(); if (!aktiv || d.dataset.weg) return; d.dataset.weg = "1";
        if (d.dataset.gut) { treffer++; d.classList.add("treffer"); } else { fehler++; d.classList.add("falsch"); }
        $("#fTreffer").textContent = Math.max(0, treffer - fehler);
        setTimeout(() => d.remove(), 300);
      });
      feld.appendChild(d); setTimeout(() => { if (!d.dataset.weg) d.remove(); }, leben);
    }
    function tick() {
      if (!aktiv) return;
      const rest = 1 - (performance.now() - t0) / (k.dauer * 1000);
      $("#fZeit").style.width = Math.max(0, rest * 100) + "%";
      if (rest <= 0) return fertig();
      raf = requestAnimationFrame(tick);
    }
    function fertig() {
      stopp(); $$(".ding", feld).forEach(d => d.remove());
      const netto = Math.max(0, treffer - fehler), q = Math.min(1, netto / k.ziel);
      st.e += k.e; const ergebnis = k.nach(st, q); begrenze(st);
      const r = q >= .75 ? 2 : q >= .4 ? 1 : 0;
      if (r === 0) st.fehler.push({ m, t: k.t, k: k.k, p: k.p }); else if (r === 2) st.gut++;
      feld.innerHTML = `<div class="fang-start"><div style="font-size:40px">${r === 2 ? "🎉" : r === 1 ? "👍" : "😕"}</div><div><b>${treffer}</b> richtig${fehler ? `, <b>${fehler}</b> daneben` : ""}</div></div>`;
      const aus = pruefe("Deine Kraft war aufgebraucht.");
      $("#folge").innerHTML = `<div class="folge r${r}" role="status"><span class="urteil">${ergebnis}</span>${chips(k.e, 0, "")}<span>${k.k}</span></div>
        <div class="weiter"><button type="button" class="knopf prim" id="weiter">Weiter ›</button></div>`;
      $("#weiter").onclick = aus ? ende : weiter;
      $("#weiter").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
    }
    $("#fLos").onclick = () => {
      $(".fang-start", feld).remove(); aktiv = true; t0 = performance.now(); laufend = stopp;
      neu(); spawn = setInterval(neu, 1000); raf = requestAnimationFrame(tick);
      feld.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
    };
  }

  function ende() {
    const lebt = !tot(st), n = sterne(st), alt = S[tid] || {};
    S[tid] = { n: (alt.n || 0) + 1, ueberlebt: !!(alt.ueberlebt || lebt), sterne: Math.max(alt.sterne || 0, n), jung: Math.max(alt.jung || 0, lebt ? st.jung : 0) };
    speichern();
    const neuOffen = tid === "meise" && lebt && !alt.ueberlebt && !S.frei;
    const pf = [...new Set(st.fehler.map(f => f.p))];
    if (m > 11) m = 11;
    window.scrollTo(0, 0); anzeigen();
    buehne.innerHTML = `<div class="ende">
        <div class="szene ${lebt ? "fruehling" : zeit(m)[0]}"><div class="zeichen" aria-hidden="true">${lebt ? T.em + "🌱" : "🍃"}</div></div>
        <span class="eyebrow">${T.name} · Level ${T.level}</span>
        <h2>${lebt ? "Geschafft – ein ganzes Jahr!" : "Diesmal hat es nicht gereicht"}</h2>
        ${lebt ? `<div class="gross">${sterneHTML(n)}</div><p>${T.schluss}</p>` : `<p><b>${grund}</b> Dein Jahr endete im ${MONATE[m]}.</p>`}
        <p class="klein">${T.ueberleben}</p>
        <div class="werte"><div><b>${lebt ? 12 : m}</b>Monate überstanden</div><div><b>${st.jung}</b>Junge flügge</div><div><b>${st.gut}</b>gute Entscheidungen</div></div>
        ${lebt && n < 3 ? `<p class="klein">Für ${n + 1} Sterne brauchst du mindestens ${T.sterne[n - 1]} flügge Junge.</p>` : ""}
        ${neuOffen ? `<p><b>🔓 Level 2 ist jetzt offen:</b> die Rauchschwalbe.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf prim" id="noch">🔁 Noch ein Jahr</button>${tid === "meise" && (S.frei || S.meise.ueberlebt) ? `<a class="knopf honig" href="#schwalbe">Level 2: Rauchschwalbe ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a></div>
      </div>
      ${st.fehler.length ? `<h3 class="h-honig">Das war riskant – merk es dir fürs nächste Jahr</h3>
        <div class="merk">${st.fehler.slice(0, 5).map(f => `<div><b>${MONATE[f.m]} – ${esc(f.t)}:</b> ${f.k}</div>`).join("")}</div>` : lebt ? `<p class="lead" style="text-align:center">Keine einzige riskante Entscheidung – stark!</p>` : ""}
      ${pf.length ? `<h3 class="h-honig">Hier kannst du nachlesen</h3><div class="pfade">${pf.map(p => `<a href="${PFADE[p][0]}"><span>${PFADE[p][1]}</span><span>›</span></a>`).join("")}</div>` : ""}`;
    $("#noch").onclick = () => seiteSpiel(tid);
    if (lebt) konfetti();
  }

  buehne.innerHTML = `<div class="karte"><div class="szene fruehling"><img src="${T.bild}" alt="${T.name}" style="aspect-ratio:16/9;object-position:50% 25%"></div>
    <div class="k-text"><span class="eyebrow">Level ${T.level}</span><h2>Ein Jahr als ${T.name}</h2><p>${T.intro}</p>
    <p class="klein">Achte auf deine Kraft ⚡ und deine Sicherheit 🛡️ – beide dürfen nie auf null fallen.</p></div>
    <div class="weiter" style="padding-top:12px"><button type="button" class="knopf prim" id="los">▶ Das Jahr beginnt</button></div></div>`;
  $$("#weg span").forEach(el => el.className = zeit(+el.dataset.m)[0]);
  $("#eZahl").textContent = st.e + " / " + EMAX; $("#sZahl").textContent = st.s + " / " + SMAX;
  $("#eBalken i").style.width = (st.e / EMAX * 100) + "%"; $("#sBalken i").style.width = (st.s / SMAX * 100) + "%";
  $("#junge").innerHTML = `🐣 flügge<b>0</b>`;
  $("#los").onclick = monat;
}

/* ============ Navigation ============ */
function route() {
  if (laufend) laufend();
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (TIERE[h]) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
