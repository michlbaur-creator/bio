<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Durchs Jahr! – Das Überlebensspiel · Bio Mibaso</title>
<meta name="description" content="Ein Lernspiel für Klasse 5/6: Als Kohlmeise, Rauchschwalbe oder Igel zwölf Monate überstehen – Revier, Nest und Junge, Feinde, Vogelzug und Winterschlaf. Mit Ereigniskarten, Zwischenspielen und drei Leveln. Ohne Anmeldung.">
<meta name="theme-color" content="#233D5C">
<link rel="icon" href="../assets/icon.svg">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
/* Durchs Jahr! – Farben und Schrift wie die Forscherpässe von Fauna Mibaso */
:root{
  --blau:#233D5C; --blau-tief:#1a2f47; --blau-mittel:#33587c; --blau-hell:#bcd0e2;
  --creme:#F7F3E8; --creme-tief:#EEE7D5; --tile:#FFFFFF;
  --honig:#C28A3A; --honig-tief:#a9762c;
  --ink:#1c2e42; --ink-soft:#5d6b78; --linie:#d9d2c1;
  --ok:#2f6a45; --bad:#B23B2E; --mittel:#a9762c;
  --fruehling:#7fae5a; --sommer:#e0a630; --herbst:#c06a2c; --winter:#6f9cc4;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--blau-tief);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100vh}
img{max-width:100%}
a{color:var(--blau)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:2px}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
section{padding-top:24px;display:grid;gap:14px}
.app-head{background:linear-gradient(180deg,var(--blau-tief) 0%,var(--blau-mittel) 100%);color:var(--creme);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) 24px;border-bottom:4px double var(--blau-hell);position:relative}
.app-head .zurueck-kopf{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);color:#dce8f3;font-family:var(--sans);font-size:14px;text-decoration:none;padding:6px}
.app-head .logo{font-size:40px;line-height:1;margin:14px 0 6px;letter-spacing:6px}
.app-head h1{font-size:clamp(30px,9vw,44px);letter-spacing:.02em}
.app-head .untertitel{font-style:italic;color:#dce8f3;margin-top:8px;font-size:clamp(14px,3.8vw,17px)}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:19px}
.klein{font-size:15px;color:var(--ink-soft)}
.h-blau{color:var(--blau);font-size:26px} .h-honig{color:var(--honig-tief);font-size:22px}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:5px}
.knopf{display:inline-block;border:1px solid var(--blau);background:var(--tile);color:var(--blau);border-radius:12px;padding:11px 18px;font-family:var(--sans);font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--blau);color:#fff;box-shadow:0 2px 0 var(--blau-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fuss{margin-top:34px;padding-top:16px;border-top:1px solid var(--linie);font-family:var(--sans);font-size:13px;color:var(--ink-soft);text-align:center;display:grid;gap:6px}
details.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 16px;font-size:16px}
details.lehrer summary{cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--blau);font-weight:bold}
details.lehrer .grid{display:grid;gap:10px;padding-top:10px}

/* Startseite: Regeln und Level */
.regeln{display:grid;gap:8px;font-family:var(--sans);font-size:15px}
.regel{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 12px}
.regel .e{font-size:26px;text-align:center;line-height:1}
.regel b{color:var(--blau)}
.level{display:grid;gap:12px}
.lv{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;background:var(--tile);border:2px solid var(--blau-hell);border-radius:16px;padding:12px;text-align:left;cursor:pointer;width:100%;font-family:var(--serif)}
.lv img{width:132px;height:88px;object-fit:cover;border-radius:12px;display:block;background:var(--creme-tief)}
.lv .nr{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--honig-tief);font-weight:bold}
.lv .nm{font-size:23px;color:var(--blau);display:block;line-height:1.2}
.lv .mo{font-size:15px;color:var(--ink-soft);display:block;line-height:1.35;margin-top:2px}
.lv .st{font-family:var(--sans);font-size:14px;color:var(--ink);display:block;margin-top:6px}
@media (hover:hover){.lv:not(:disabled):hover{border-color:var(--blau);box-shadow:0 4px 14px rgba(35,61,92,.14)}}
.lv:disabled{cursor:default;opacity:.6;border-style:dashed}
.lv:disabled img{filter:grayscale(1)}
.stern-leer{opacity:.22;filter:grayscale(1)}

/* Spiel: Kopfzeile mit Anzeigen und Jahresweg */
.spielkopf{position:sticky;top:0;z-index:6;background:var(--creme);border-bottom:1px solid var(--linie);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.spielkopf .innen{max-width:720px;margin:0 auto;display:grid;gap:8px}
.sk-zeile{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--sans);font-size:14px}
.sk-zeile a{color:var(--blau);text-decoration:none;padding:4px 2px}
.sk-zeile b{color:var(--blau)}
.anzeigen{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
.anz{display:grid;gap:3px}
.anz .lab{display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.anz .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.balken{height:10px;border-radius:999px;background:var(--creme-tief);overflow:hidden;border:1px solid var(--linie)}
.balken i{display:block;height:100%;border-radius:999px;transition:width .5s ease,background-color .3s}
.balken.e i{background:var(--honig)} .balken.s i{background:var(--blau-mittel)}
.balken.knapp i{background:var(--bad)}
.anz.junge{text-align:center;background:var(--tile);border:1px solid var(--linie);border-radius:10px;padding:4px 10px;min-width:74px;font-size:11px;line-height:1.25}
.anz.junge b{display:block;font-size:17px;color:var(--ink)}
.weg{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.weg span{height:24px;border-radius:7px;display:grid;place-items:center;font-family:var(--sans);font-size:11px;font-weight:bold;color:#fff;opacity:.38}
.weg .fruehling{background:var(--fruehling)} .weg .sommer{background:var(--sommer)} .weg .herbst{background:var(--herbst)} .weg .winter{background:var(--winter)}
.weg .war{opacity:.8}
.weg .jetzt{opacity:1;outline:3px solid var(--ink);outline-offset:1px;font-size:14px}

/* Ereigniskarte */
.karte{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden;animation:rein .35s ease-out}
@keyframes rein{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.szene{position:relative;min-height:120px;display:grid;place-items:center;color:#fff;overflow:hidden}
.szene.fruehling{background:linear-gradient(180deg,#bfe0f0 0%,#bfe0f0 46%,#9cc76f 46%,#7fae5a 100%)}
.szene.sommer{background:linear-gradient(180deg,#8fc7ee 0%,#bfe3f5 50%,#e8c95f 50%,#d9ac3c 100%)}
.szene.herbst{background:linear-gradient(180deg,#d9d2c0 0%,#e6dcc6 48%,#c98a46 48%,#a9652a 100%)}
.szene.winter{background:linear-gradient(180deg,#9fb6cf 0%,#c9d8e6 50%,#f2f5f8 50%,#dfe7ee 100%)}
.szene .zeichen{font-size:clamp(46px,14vw,64px);line-height:1;letter-spacing:8px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));padding:18px 0}
.szene img{display:block;width:100%;aspect-ratio:2/1;object-fit:cover}
.szene .wann{position:absolute;left:10px;top:10px;font-family:var(--sans);font-size:12px;font-weight:bold;letter-spacing:.05em;background:rgba(28,46,66,.82);color:#fff;border-radius:999px;padding:4px 11px}
.szene .zw{position:absolute;right:10px;top:10px;font-family:var(--sans);font-size:11px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;background:var(--bad);color:#fff;border-radius:999px;padding:4px 10px}
.k-text{padding:14px 16px 4px;display:grid;gap:8px}
.k-text h2{font-size:24px;color:var(--blau)}
.basis{font-family:var(--sans);font-size:14px;color:var(--ink-soft);background:var(--creme);border-radius:10px;padding:7px 11px}
.wahl{display:grid;gap:8px;padding:10px 16px 16px}
.wahl button{text-align:left;background:var(--creme);border:2px solid var(--blau-hell);border-radius:12px;padding:12px 14px;font-family:var(--sans);font-size:16px;line-height:1.35;cursor:pointer;color:var(--ink);touch-action:manipulation}
@media (hover:hover){.wahl button:not(:disabled):hover{border-color:var(--blau);background:#fff}}
.wahl button:focus:not(:focus-visible){outline:none}
.wahl button:disabled{cursor:default;opacity:.45}
.wahl button.gewaehlt{opacity:1;border-color:var(--ink);background:#fff;font-weight:bold}
.folge{margin:0 16px 16px;border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-family:var(--sans);font-size:15px;line-height:1.45;animation:rein .3s ease-out}
.folge.r2{background:#e3f0e7;border:1px solid #b9d8c4}
.folge.r1{background:#f6ead2;border:1px solid #e3cf9f}
.folge.r0{background:#f7e3df;border:1px solid #e6bdb5}
.folge .urteil{font-weight:bold;font-size:16px}
.folge.r2 .urteil{color:var(--ok)} .folge.r1 .urteil{color:var(--mittel)} .folge.r0 .urteil{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.75);border-radius:999px;padding:3px 10px;font-weight:bold;font-size:14px;font-variant-numeric:tabular-nums}
.chip.plus{color:var(--ok)} .chip.minus{color:var(--bad)}
.weiter{display:flex;justify-content:center;padding:0 16px 18px}

/* Zwischenspiel: Fangen */
.fang-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:15px;padding:0 16px}
.fang-hud b{font-size:20px;color:var(--blau);font-variant-numeric:tabular-nums}
.fang-zeit{height:8px;background:var(--creme-tief);border-radius:999px;overflow:hidden;margin:8px 16px 0}
.fang-zeit i{display:block;height:100%;background:var(--ok);width:100%}
.fang-feld{position:relative;margin:10px 16px 16px;height:min(52vh,400px);border-radius:14px;overflow:hidden;border:1px solid var(--linie);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.fang-feld.fruehling,.fang-feld.sommer{background:linear-gradient(180deg,#cfe8f5 0%,#e3f1d4 100%)}
.fang-feld.winter{background:linear-gradient(180deg,#dfe8f0 0%,#f5f7f9 100%)}
.fang-feld.herbst{background:linear-gradient(180deg,#eadfc8 0%,#e3c9a0 100%)}
.ding{position:absolute;width:112px;margin:-42px 0 0 -56px;border:1px solid var(--linie);background:rgba(255,255,255,.92);border-radius:16px;display:grid;justify-items:center;gap:3px;cursor:pointer;padding:8px 4px 7px;animation:auf .25s ease-out;touch-action:manipulation;box-shadow:0 2px 8px rgba(35,61,92,.12)}
.ding .de{font-size:38px;line-height:1}
.ding small{font-family:var(--sans);font-size:13px;font-weight:bold;color:var(--ink);line-height:1.15;text-align:center}
@keyframes auf{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.ding.flug{animation:auf .25s ease-out, flug var(--dauer,4s) linear forwards}
@keyframes flug{to{translate:var(--dx,60px) var(--dy,-20px)}}
.ding.treffer{background:#bfe3c9;transform:scale(1.25);opacity:0;transition:all .25s}
.ding.falsch{background:#f1b9b0;transform:scale(.8);opacity:0;transition:all .3s}
.fang-start{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;gap:10px;align-content:center;font-family:var(--sans);font-size:16px;background:rgba(247,243,232,.9)}
.fang-leg{font-size:15px;color:var(--ink-soft);max-width:26em}
.fang-leg span{white-space:nowrap}

/* Die große Reise */
.r-bild img{aspect-ratio:3/1!important}
.r-oben{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:12px;padding:12px 16px 0;align-items:start}
.r-karte{border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:#dceaf3;line-height:0}
.r-svg{display:block;width:100%;height:auto}
.r-svg .r-name{font-family:var(--sans);font-size:12.5px;fill:#1c2e42;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.r-svg .r-name.hier{font-weight:bold;font-size:14px}
.r-svg .r-region{font-family:var(--serif);font-style:italic;font-size:12px;fill:#8a7a52;text-anchor:middle}
.r-lage{display:grid;gap:9px;font-family:var(--sans);font-size:15px;line-height:1.3}
.r-lage .eyebrow{display:block;font-size:10.5px;margin-bottom:1px}
.r-lage b{color:var(--ink)}
.r-ort{font-family:var(--serif);font-weight:normal;font-size:22px;color:var(--blau)!important;line-height:1.15}
.r-wetter small{display:block;font-size:11.5px;color:var(--ink-soft)}
.r-em{font-size:20px;vertical-align:-2px}
.r-frost{font-size:13px;color:var(--blau-mittel);background:#e6eef6;border-radius:9px;padding:6px 9px}
.r-frost.da{background:#cfe0f0;color:var(--blau-tief);font-weight:bold}
.reise > .folge{margin-top:4px}
.r-wahl button{display:grid;gap:3px;border-left:6px solid var(--f,var(--blau-hell))}
.r-wahl button b{font-size:16.5px;color:var(--blau)}
.r-wahl .r-sub{font-size:14px;color:var(--ink-soft)}
.r-werte{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;font-size:13px}
.r-werte span{background:#fff;border:1px solid var(--linie);border-radius:999px;padding:2px 9px;white-space:nowrap}
.r-werte .ris.gering{color:var(--ok);border-color:#b9d8c4}
.r-werte .ris.mittel{color:var(--mittel);border-color:#e3cf9f}
.r-werte .ris.hoch,.r-werte .ris.sehrhoch{color:var(--bad);border-color:#e6bdb5;font-weight:bold}
.r-wahl .r-rast{border-left-color:var(--ok)}
@media (min-width:600px){.r-oben{grid-template-columns:minmax(0,40%) 1fr;gap:18px}.r-lage{font-size:16px}}

/* Level 3: Nachtrunde und Winterschlaf */
.n-oben{display:grid;gap:12px;padding:4px 16px 16px}
.n-karte{border-radius:14px;overflow:hidden;line-height:0;max-width:440px;width:100%;margin:0 auto;box-shadow:0 2px 10px rgba(20,35,58,.25)}
.n-svg{display:block;width:100%;height:auto;touch-action:manipulation}
.n-weg{stroke:#dce8f3;stroke-opacity:.16;stroke-width:2;stroke-dasharray:3 5}
.n-weg.an{stroke:#f2c56b;stroke-opacity:.95;stroke-width:3}
.n-platz circle{fill:#2b4160;stroke:#7f95ad;stroke-width:1.5}
.n-platz.gut circle{fill:#27503a;stroke:#8fd0a3}
.n-platz.leer circle{fill:#2a3a35;stroke:#6f8a7a}
.n-platz.gefahr circle{fill:#5a2a26;stroke:#f09a8c}
.n-platz.hier circle{fill:#F7F3E8;stroke:#f2c56b;stroke-width:4}
.n-platz.nah{cursor:pointer}
.n-platz.nah circle{stroke-width:3}
.n-em{font-size:19px;text-anchor:middle}
.n-platz.hier .n-em{font-size:24px}
.n-name{font-family:var(--sans);font-size:10.5px;fill:#dce8f3;text-anchor:middle;paint-order:stroke;stroke:#14233a;stroke-width:2.5px;stroke-linejoin:round}
.n-seite{display:grid;gap:10px;align-content:start}
.n-seite .folge{margin:0}
.n-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--sans);font-size:14.5px;background:var(--creme);border-radius:10px;padding:8px 11px}
.n-hud b{color:var(--blau)}
.n-mond{display:inline-flex;gap:3px;vertical-align:-1px;margin-right:4px}
.n-mond i{width:11px;height:11px;border-radius:50%;background:#f2c56b;border:1px solid #c79a3d}
.n-mond i.um{background:transparent;border-color:var(--linie)}
.n-wahl{padding:0!important}
.n-wahl button{--f:var(--blau-hell)}
.n-wahl .gut{--f:#5fae78} .n-wahl .gefahr{--f:var(--bad)} .n-wahl .leer{--f:var(--linie)} .n-wahl .unklar{--f:var(--honig)}
.n-wahl .gefahr .r-sub{color:var(--bad);font-weight:bold}
.n-wahl .n-witter{border-left-color:var(--blau-mittel);background:#eef3f8}
.nachtrunde > .folge{margin-top:4px}
@media (min-width:640px){.n-oben{grid-template-columns:minmax(0,46%) 1fr;gap:18px;align-items:start}.n-karte{margin:0}}
.w-leiste{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;padding:12px 16px 0}
.w-leiste span{height:22px;border-radius:6px;display:grid;place-items:center;font-family:var(--sans);font-size:11px;font-weight:bold;color:#fff;background:var(--winter);opacity:.35}
.w-leiste .war{opacity:.85} .w-leiste .jetzt{opacity:1;outline:3px solid var(--ink);outline-offset:1px}
.w-werte{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 16px 0;font-family:var(--sans)}
.w-werte div{background:var(--creme);border-radius:12px;padding:9px 6px;font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.3}
.w-werte b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.w-werte small{display:block;font-size:11px}
.w-zzz{position:absolute;right:14px;bottom:10px;font-size:34px;animation:zzz 2.4s ease-in-out infinite}
@keyframes zzz{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-8px);opacity:1}}
.schlaf .szene img{aspect-ratio:5/2}
.nachtrunde > .szene img{aspect-ratio:5/2}
@media (min-width:600px){.w-werte{grid-template-columns:repeat(4,1fr)}}

/* Ende */
.ende{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden;text-align:center;display:grid;gap:10px;padding-bottom:20px}
.ende > *{margin-left:16px;margin-right:16px}
.ende > .szene{margin:0}
.ende h2{font-size:28px;color:var(--blau)}
.ende .gross{font-size:44px;letter-spacing:6px;line-height:1}
.werte{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--sans)}
.werte div{background:var(--creme);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--ink-soft)}
.werte b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.merk{display:grid;gap:8px;font-family:var(--sans);font-size:15px}
.merk div{background:var(--tile);border:1px solid var(--linie);border-left:4px solid var(--honig);border-radius:10px;padding:10px 12px;line-height:1.45}
.merk b{color:var(--blau)}
.merk a{display:inline-block;margin-top:4px;font-size:14px}
.pfade{display:grid;gap:8px}
.pfade a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:11px 14px;text-decoration:none;font-family:var(--sans);font-size:15px;color:var(--blau)}

/* ============ Spielregeln (ohne Anzeige) ============ */
const mische = (a, rnd) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// Jahresplan: je Monat die Hauptkarte, dazu vier zufällige Zwischenfälle in passenden Monaten
function jahresplan(tid, rnd) {
  const T = TIERE[tid], plan = T.monate.map(k => k.leer ? [] : [k]);
  let n = 0;
  mische(T.zwischen, rnd).forEach(z => {
    if (n >= 4) return;
    const frei = []; for (let m = z.von; m <= z.bis; m++) if (plan[m].length === 1 && !(z.nicht && z.nicht.includes(m))) frei.push(m);
    if (!frei.length) return;
    const m = frei[Math.floor(rnd() * frei.length)];
    if (rnd() < .5) plan[m].unshift(z); else plan[m].push(z);
    n++;
  });
  return plan;
}
const neuerStand = tid => ({ tid, e: TIERE[tid].start.e, s: TIERE[tid].start.s, eier: 0, nest: 1, jung: 0, fehler: [], gut: 0 });
// Beim Igel (gramm: true) ist „e“ das Gewicht in Gramm: höchstens emax, unter emin ist das Jahr vorbei
const begrenze = st => { st.e = Math.min(TIERE[st.tid].emax || EMAX, st.e); st.s = Math.min(SMAX, st.s); };
const tot = st => st.e <= (TIERE[st.tid].emin || 0) ? "kraft" : st.s <= 0 ? "feind" : "";
function waehle(st, karte, w, m) {
  st.e += w.e; st.s += w.s; if (w.fx) w.fx(st); begrenze(st);
  if (w.r === 0) st.fehler.push({ m, t: karte.t, k: w.k, p: karte.p }); else if (w.r === 2) st.gut++;
}
function sterne(st) { const T = TIERE[st.tid]; return tot(st) ? 0 : 1 + (st.jung >= T.sterne[0] ? 1 : 0) + (st.jung >= T.sterne[1] ? 1 : 0); }
if (typeof module !== "undefined") module.exports = { TIERE, jahresplan, neuerStand, waehle, tot, sterne, begrenze, EMAX };

    function tick() {

      $("#folge").innerHTML = `<div class="folge r${r}" role="status"><span class="urteil">${ergebnis}</span>${chips(k.e, 0, "")}<span>${k.k}</span></div>

  /* Die große Reise: Herbstzug mit Wetter, Rastplätzen, Abkürzung oder Umweg */

  /* Die Nachtrunde: drei Nächte im Garten – der Igel riecht mehr, als er sieht */

  /* Der Winterschlaf: dreizehn Wochen im Zeitraffer */
  function schlaf(k) {
    const W = schlafStart(st, Math.random);
    let takt = 0, letzte = { temp: 2, de: 0 };
    const stopp = () => { clearInterval(takt); takt = 0; laufend = null; };
    const leiste = () => `<div class="w-leiste" aria-hidden="true">${SCHLAF.monat.map((mo, i) => `<span class="${i < W.woche ? "war" : ""}${i === W.woche - 1 ? " jetzt" : ""}">${MONATE[mo][0]}</span>`).join("")}</div>`;
    const werte = () => `<div class="w-werte">
        <div><b>${letzte.temp > 0 ? "+" : letzte.temp < 0 ? "−" : ""}${Math.abs(letzte.temp)} °C</b>draußen</div>
        <div><b>5 °C</b>Körper <small>statt 35 °C</small></div>
        <div><b>8</b>Herzschläge je Minute <small>statt 180</small></div>
        <div><b>${Math.round(st.e)} g</b>Gewicht <small>${W.woche ? "−" + Math.round(W.start - st.e) + " g seit Dezember" : "beim Einschlafen"}</small></div></div>`;
    const kopf = (zusatz) => `<div class="szene winter">${k.bild ? `<img src="${k.bild}" alt="">` : `<div class="zeichen" aria-hidden="true">${k.sz}</div>`}<span class="wann">${zeit(m)[2]} ${MONATE[m]}${W.woche ? " · Woche " + W.woche + " von " + SCHLAF.wochen : ""}</span>${zusatz || ""}</div>`;
    // Zu leicht? Dann darf der Igel noch einmal los.
    function vorher(mel) {
      anzeigen(); window.scrollTo(0, 0);
      const g = Math.round(st.e), knapp = g < NACHT.knapp;
      buehne.innerHTML = `<div class="karte schlaf">${kopf()}
        <div class="k-text"><h2>${knapp ? "Zu leicht für den Winter?" : "Zeit zum Einschlafen"}</h2>
          <p>${knapp ? `Dezember. Du wiegst nur <b>${g} g</b> – wenig für dreizehn Wochen ohne Futter. Draußen friert es schon, und es krabbelt kaum noch etwas. Was tust du?`
            : `Dezember. Du wiegst <b>${g} g</b>. Du rollst dich in deinem Nest zusammen. Dein Herz schlägt immer langsamer, dein Körper kühlt ab – bis zum Frühling lebst du nur noch von deinem Fett.`}</p></div>
        ${mel ? `<div class="folge r${mel.de >= 30 ? 1 : 0}" role="status"><span class="urteil">${mel.de >= 30 ? "Ein paar späte Käfer und Würmer gefunden." : "Fast nichts gefunden – der Boden ist gefroren."}</span>${chips(mel.de, mel.ds, "")}
          <span>Untergewichtige Igel sind oft noch im Dezember unterwegs, manchmal sogar am Tag. Das ist gefährlich – solche Igel brauchen Hilfe von einer Igelstation.</span></div>` : ""}
        <div class="wahl r-wahl">
          ${knapp && W.suche < 4 ? `<button type="button" id="wSuch"><b>🌙 Noch eine Nacht auf Futtersuche gehen</b><span class="r-sub">bei Frost bringt das wenig und ist gefährlich</span><span class="r-werte"><span>+10 bis +30 g</span><span class="ris hoch">−1 🛡️</span></span></button>` : ""}
          <button type="button" id="wEin" class="r-rast"><b>😴 Einrollen und einschlafen</b>${knapp ? `<span class="r-sub">mit ${g} g in den Winter</span>` : ""}</button>
        </div></div>`;
      const su = $("#wSuch"); if (su) su.onclick = () => { const r = schlafSuche(st, W, Math.random); begrenze(st);
        if (pruefe("Bei Frost am hellen Tag unterwegs – das war eine Gefahr zu viel.")) return aus(); vorher(r); };
      $("#wEin").onclick = () => { if (knapp) st.fehler.push({ m: 9, t: "Zu leicht eingeschlafen", k: "Wer zu wenig Winterspeck hat, dem geht mitten im Winter der Brennstoff aus. Deshalb ist der Herbst für Igel die wichtigste Zeit des Jahres.", p: "winter" });
        W.start = st.e; bett(); };
    }
    function bett(text) {
      anzeigen(); window.scrollTo(0, 0);
      buehne.innerHTML = `<div class="karte schlaf">${kopf(`<span class="w-zzz" aria-hidden="true">💤</span>`)}
        ${leiste()}${werte()}
        <div class="k-text"><h2>${k.t}</h2><p id="wText">${text || "Du schläfst tief. Nur alle paar Sekunden ein Herzschlag, nur wenige Atemzüge in der Minute. Woche für Woche schmilzt dein Fettpolster."}</p></div>
        <div class="weiter"><button type="button" class="knopf prim" id="wWeiter">😴 Weiterschlafen</button></div></div>`;
      $("#wWeiter").onclick = lauf;
    }
    function lauf() {
      const b = $("#wWeiter"); if (b) { b.disabled = true; b.textContent = "💤 …"; }
      laufend = stopp;
      const schritt = () => {
        letzte = schlafWoche(st, W, Math.random); m = letzte.m;
        if (pruefe("Dein Fettpolster hat nicht bis zum Frühling gereicht.")) { stopp(); return aus(); }
        if (letzte.karte) { stopp(); return stoerung(letzte.karte); }
        if (W.woche >= SCHLAF.wochen) { stopp(); return wach(); }
        const l = $(".w-leiste", buehne), w = $(".w-werte", buehne), wann = $(".szene .wann", buehne);
        if (l) l.outerHTML = leiste(); if (w) w.outerHTML = werte(); if (wann) wann.textContent = `${zeit(m)[2]} ${MONATE[m]} · Woche ${W.woche} von ${SCHLAF.wochen}`;
      };
      schritt(); if (laufend) takt = setInterval(schritt, reduce ? 350 : 850);
    }
    function stoerung(kk) {
      anzeigen(); window.scrollTo(0, 0);
      buehne.innerHTML = `<div class="karte schlaf"><div class="szene winter">${kk.bild ? `<img src="${kk.bild}" alt="">` : `<div class="zeichen" aria-hidden="true">${kk.sz}</div>`}<span class="wann">${zeit(m)[2]} ${MONATE[m]} · Woche ${W.woche} von ${SCHLAF.wochen}</span><span class="zw">Störung</span></div>
        ${leiste()}${werte()}
        <div class="k-text"><h2>${kk.t}</h2><p>${kk.x}</p></div>
        <div class="wahl">${mische(kk.w.map((w, i) => i), Math.random).map(i => `<button type="button" data-i="${i}">${kk.w[i].l}</button>`).join("")}</div>
        <div id="folge"></div></div>`;
      $$(".wahl button", buehne).forEach(b => b.onclick = () => {
        const w = kk.w[+b.dataset.i]; waehle(st, kk, w, m); if (w.e <= -60) W.wach++;
        $$(".wahl button", buehne).forEach(x => { x.disabled = true; x.classList.toggle("gewaehlt", x === b); });
        const tod = pruefe(tot(st) === "kraft" ? "Dein Fettpolster hat nicht bis zum Frühling gereicht." : "Kälte und Feinde waren zu viel für dich.");
        const w2 = $(".w-werte", buehne); if (w2) w2.outerHTML = werte();
        $("#folge").innerHTML = `<div class="folge r${w.r}" role="status"><span class="urteil">${w.urteil || ["Das war riskant.", "Geht so.", "Gute Entscheidung!"][w.r]}</span>${chips(w.e, w.s, "")}<span>${w.k}</span></div>
          <div class="weiter"><button type="button" class="knopf prim" id="weiter">${tod ? "Weiter" : W.woche >= SCHLAF.wochen ? "Weiter ›" : "😴 Wieder einschlafen"}</button></div>`;
        $("#weiter").onclick = tod ? ende : W.woche >= SCHLAF.wochen ? wach : () => bett(w.e <= -60 ? "Du bist wieder eingeschlafen. Das Aufwachen hat ein großes Stück Winterspeck gekostet." : "Du schläfst wieder tief und fest.");
        $("#weiter").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
      });
    }
    function aus() {
      anzeigen(); window.scrollTo(0, 0);
      buehne.innerHTML = `<div class="karte schlaf">${kopf()}${W.woche ? leiste() + werte() : ""}
        <div class="folge r0" role="status" style="margin-top:14px"><span class="urteil">${grund}</span>
          <span>${W.woche ? `Du bist mit ${Math.round(W.start)} g eingeschlafen. Für dreizehn Wochen ohne Futter war das zu wenig – oder das Aufwachen zwischendurch zu teuer.` : "Wer im Dezember noch draußen suchen muss, hat im Herbst zu wenig gefressen."}</span></div>
        <div class="weiter"><button type="button" class="knopf prim" id="weiter">Weiter</button></div></div>`;
      $("#weiter").onclick = ende;
    }
    function wach() {
      m = 11; anzeigen(); window.scrollTo(0, 0);
      const weg = Math.round(W.start - st.e), anteil = Math.round(weg / W.start * 100);
      st.gut++;
      buehne.innerHTML = `<div class="karte schlaf">${kopf()}${leiste()}${werte()}
        <div class="k-text"><h2>Ende Februar</h2><p>Du schläfst noch – aber das Schwerste liegt hinter dir.</p></div>
        <div class="folge r2" role="status"><span class="urteil">Dreizehn Wochen ohne einen Bissen!</span>${chips(-weg, 0, "")}
          <span>Du hast im Winterschlaf ${weg} g verloren – ${anteil} % deines Gewichts${W.wach ? `, und du musstest ${W.wach === 1 ? "einmal" : W.wach + "-mal"} ganz aufwachen` : ""}. Echte Igel verlieren im Winter ein Viertel bis ein Drittel.</span></div>
        <div class="weiter"><button type="button" class="knopf prim" id="weiter">Das Jahr ist um ›</button></div></div>`;
      $("#weiter").onclick = weiter;
    }
    vorher(null);
  }

  function ende() {
    const lebt = !tot(st), n = sterne(st), alt = S[tid] || {};
    S[tid] = { n: (alt.n || 0) + 1, ueberlebt: !!(alt.ueberlebt || lebt), sterne: Math.max(alt.sterne || 0, n), jung: Math.max(alt.jung || 0, lebt ? st.jung : 0) };
    speichern();
    const next = danach(tid), neuOffen = next && lebt && !alt.ueberlebt && !S.frei;
    const pf = [...new Set(st.fehler.map(f => f.p))];
    if (m > 11) m = 11;
    window.scrollTo(0, 0); anzeigen();
    buehne.innerHTML = `<div class="ende">
        <div class="szene ${lebt ? "fruehling" : zeit(m)[0]}"><div class="zeichen" aria-hidden="true">${lebt ? T.em + "🌱" : "🍃"}</div></div>
        <span class="eyebrow">${T.name} · Level ${T.level}</span>
        <h2>${lebt ? "Geschafft – ein ganzes Jahr!" : "Diesmal hat es nicht gereicht"}</h2>
        ${lebt ? `<div class="gross">${sterneHTML(n)}</div><p>${T.schluss}</p>` : `<p><b>${grund}</b> Dein Jahr endete im ${MONATE[m]}.</p>`}
        <p class="klein">${T.ueberleben}</p>
        <div class="werte"><div><b>${lebt ? 12 : m}</b>Monate überstanden</div><div><b>${st.jung}</b>${T.jungEnde || "Junge flügge"}</div><div><b>${st.gut}</b>gute Entscheidungen</div></div>
        ${lebt && n < 3 ? `<p class="klein">Für ${n + 1} Sterne brauchst du mindestens ${T.sterne[n - 1]} ${T.jungAdj || "flügge"} Junge.</p>` : ""}
        ${neuOffen ? `<p><b>🔓 Level ${TIERE[next].level} ist jetzt offen:</b> ${TIERE[next].mit}.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf prim" id="noch">🔁 Noch ein Jahr</button>${next && offen(next) ? `<a class="knopf honig" href="#${next}">Level ${TIERE[next].level}: ${TIERE[next].name} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a></div>
      </div>
      ${st.fehler.length ? `<h3 class="h-honig">Das war riskant – merk es dir fürs nächste Jahr</h3>
        <div class="merk">${st.fehler.slice(0, 5).map(f => `<div><b>${MONATE[f.m]} – ${esc(f.t)}:</b> ${f.k}</div>`).join("")}</div>` : lebt ? `<p class="lead" style="text-align:center">Keine einzige riskante Entscheidung – stark!</p>` : ""}
      ${pf.length ? `<h3 class="h-honig">Hier kannst du nachlesen</h3><div class="pfade">${pf.map(p => `<a href="${PFADE[p][0]}"><span>${PFADE[p][1]}</span><span>›</span></a>`).join("")}</div>` : ""}`;
    $("#noch").onclick = () => seiteSpiel(tid);
    if (lebt) konfetti();
  }

  buehne.innerHTML = `<div class="karte"><div class="szene fruehling"><img src="${T.bild}" alt="${T.name}" style="aspect-ratio:3/2;max-height:52vh"></div>
    <div class="k-text"><span class="eyebrow">Level ${T.level}</span><h2>Ein Jahr als ${T.name}</h2><p>${T.intro}</p>
    <p class="klein">${T.achte || "Achte auf deine Kraft ⚡ und deine Sicherheit 🛡️ – beide dürfen nie auf null fallen."}</p></div>
    <div class="weiter" style="padding-top:12px"><button type="button" class="knopf prim" id="los">▶ Das Jahr beginnt</button></div></div>`;
  anzeigen();
  $("#los").onclick = monat;
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  if (laufend) laufend();
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (TIERE[h]) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
