<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Futterhaus-Pass – Vögel am Futterhaus · Bio Mibaso</title>
<meta name="description" content="Vögel am Futterhaus: der richtige Platz, gutes und schlechtes Futter, 21 Futterhausgäste mit Lehrtafeln, ein Film, eine Zählkarte und ein Bilderquiz mit 10 Fragen. Eine Expedition für Klasse 5/6 – mit Futterhaus-Pass, Abzeichen und Urkunde.">
<meta name="theme-color" content="#233D5C">
<link rel="icon" href="../assets/icon.svg">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
/* Futterhaus-Pass – Technik wie der Vogelpass, Farben wie Fauna Mibaso */
:root{
  --blau:#233D5C; --blau-tief:#1a2f47; --blau-mittel:#33587c; --blau-hell:#bcd0e2;
  --creme:#F7F3E8; --creme-tief:#EEE7D5; --tile:#FFFFFF;
  --honig:#C28A3A; --honig-tief:#a9762c; --nuss:#8a5a2b;
  --ink:#1c2e42; --ink-soft:#5d6b78; --linie:#d9d2c1;
  --ok:#2f6a45; --bad:#B23B2E;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--blau-tief);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100vh}
img{max-width:100%}
a{color:var(--blau)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:2px}
h1,h2,h3{font-weight:normal;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}

.app-head{background:linear-gradient(180deg,var(--blau-tief) 0%,var(--blau-mittel) 100%);color:var(--creme);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) max(20px,env(safe-area-inset-right,0px)) 24px;border-bottom:4px double var(--blau-hell);position:relative;overflow:hidden}
.app-head .zurueck-kopf{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);color:#dce8f3;font-family:var(--sans);font-size:14px;text-decoration:none;padding:6px}
.app-head .logo{font-size:44px;line-height:1;margin:14px 0 6px}
.app-head h1{font-size:clamp(28px,8vw,40px);letter-spacing:.02em}
.app-head .untertitel{font-style:italic;color:#dce8f3;margin-top:8px;font-size:clamp(13px,3.6vw,16px)}

.subkopf{position:sticky;top:0;z-index:6;background:var(--creme);border-bottom:1px solid var(--linie);
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.subkopf .row{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.zurueck{font-family:var(--sans);font-size:15px;text-decoration:none;color:var(--blau);padding:6px 4px}
.tchip{font-family:var(--sans);font-size:14px;background:var(--tile);border:1px solid var(--linie);border-radius:999px;padding:5px 12px;color:var(--blau);font-variant-numeric:tabular-nums;white-space:nowrap}

section{padding-top:26px;display:grid;gap:14px}
h2{font-size:25px}
h2::after{content:"";display:block;width:46px;height:3px;margin-top:8px;background:currentColor;border-radius:2px}
.h-blau{color:var(--blau)} .h-honig{color:var(--honig-tief)}
h3{font-size:19px;color:var(--blau)}
.eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.lead{font-size:19px}
.prose{display:grid;gap:12px}
.klein{font-size:15px;color:var(--ink-soft)}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:4px}

.kacheln{display:grid;gap:12px}
.kachel{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--tile);border:1px solid var(--linie);
  border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 4px rgba(35,61,92,.07);transition:transform .08s,box-shadow .08s}
a.kachel:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(35,61,92,.14)}
.kachel .ke{font-size:30px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--creme-tief)}
.kachel .kt{font-size:18px;color:var(--blau);display:block;font-weight:bold}
.kachel .kb{font-size:14px;color:var(--ink-soft);font-family:var(--sans)}
.kachel .pf{font-size:24px;color:var(--blau-mittel)}
.ablauf{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-family:var(--sans);font-size:15px;background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:14px 16px}
.ablauf b{color:var(--blau)}

.schalter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--sans);font-size:14px}
.schalter .lab{color:var(--ink-soft);margin-right:4px}
.sbtn{border:1px solid var(--linie);background:var(--tile);border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--ink-soft)}
.sbtn.an{background:var(--blau);border-color:var(--blau);color:#fff}
.hint{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}

/* Pass-Bühne mit Vorratshöhle */
.buehne{position:relative;background:linear-gradient(180deg,#f4efe4 0%,#fff 60%,var(--creme-tief) 100%);border:1px solid var(--linie);border-radius:16px;padding:68px 12px 10px;display:grid;place-items:center;overflow:hidden}
.buehne svg{width:min(240px,62vw);height:auto;display:block}
.buehne .boden{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#efe6d3 0 38px,#e2d6bd 38px 40px);border-top:1px solid var(--linie)}
.rangchip{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:6px 10px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);z-index:2}
.rangchip .med{font-size:24px}
.rangchip b{display:block;font-size:14px;color:var(--blau)}
.zaehler{position:absolute;right:12px;top:12px;background:var(--nuss);color:#fff;border-radius:12px;padding:6px 12px;font-family:var(--sans);font-size:15px;font-variant-numeric:tabular-nums;z-index:2}
.fbalken{height:10px;background:var(--creme-tief);border-radius:5px;overflow:hidden;border:1px solid var(--linie)}
.fbalken i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a46a,#a8743b,#8a5a2b);transition:width .8s}
.naechster{text-align:center;font-size:16px;color:var(--ink-soft)}
.kn-neu{animation:pop .5s both}

.stationen{display:grid;gap:10px}
.station{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.station .nr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--creme-tief);font-size:22px}
.station .st{font-size:17px;color:var(--blau);font-weight:bold;display:block}
.station .sk{font-size:14px;color:var(--ink-soft);font-family:var(--sans)}
.station .stand{font-family:var(--sans);font-size:13px;color:var(--ink-soft);text-align:right;white-space:nowrap}
.station.aktiv{border-color:var(--blau-hell);box-shadow:0 0 0 2px var(--blau-hell)}
.station.fertig .nr{background:#e3f0e7}
.station.gesperrt{opacity:.55}
.knochen{letter-spacing:1px;font-size:16px}
.knochen .leer{opacity:.22;filter:grayscale(1)}

.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.abz{background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 6px;text-align:center;font-family:var(--sans);font-size:12px;color:var(--ink-soft);display:grid;gap:4px;justify-items:center}
.abz .em{font-size:28px}
.abz.zu .em{filter:grayscale(1);opacity:.25}
.abz.auf{border-color:var(--honig);color:var(--ink)}

/* Bausteine */
.merke{border:1.5px dashed var(--blau-mittel);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:#f8fbfd}
.merke .eyebrow{color:var(--blau)}
.achtung{border-left:5px solid var(--honig);background:#fbf1e2;padding:12px 14px;border-radius:0 12px 12px 0;font-size:16px}
.achtung b{color:#8a5a17}
.box{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:16px;display:grid;gap:12px}
.box > .eyebrow{color:var(--blau)}
details{background:var(--creme-tief);border-radius:10px;padding:10px 14px}
details summary{cursor:pointer;color:var(--blau);font-family:var(--sans);font-size:15px}
details[open] summary{margin-bottom:8px}
details .grid{display:grid;gap:8px}

figure.bild{margin:0;background:var(--tile);border:1px solid var(--linie);border-radius:14px;overflow:hidden}
figure.bild .rahmen-bild{aspect-ratio:16/10;background:linear-gradient(160deg,#e9f0f6,#d6e2ec);position:relative}
figure.bild img{display:block;width:100%;height:100%;object-fit:cover}
figure.bild .platzhalter{position:absolute;inset:0;display:none;place-items:center;align-content:center;gap:6px;text-align:center;color:var(--ink-soft);font-family:var(--sans);font-size:13px}
figure.bild .platzhalter.zeigen{display:grid}
figure.bild .platzhalter span{font-size:64px;line-height:1}
figure.bild figcaption{padding:12px 14px;font-size:16px}
figure.bild figcaption b{color:var(--blau)}

.knopf{display:inline-block;border:1px solid var(--blau);background:var(--tile);color:var(--blau);border-radius:12px;padding:10px 16px;font-family:var(--sans);font-size:15px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--blau);color:#fff;box-shadow:0 2px 0 var(--blau-tief)}
.knopf.prim:hover{background:var(--blau-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopf:disabled{opacity:.4;cursor:default}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

/* Sortieren */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--linie);background:var(--creme);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:16px;font-family:var(--serif)}
.chip.sel{border-color:var(--blau);box-shadow:0 0 0 2px var(--blau) inset;background:#fff}
.chip.ok{border-color:var(--ok);color:var(--ok);cursor:default;background:#fff}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bins.drei{grid-template-columns:repeat(3,1fr)}
.bin{border:2px dashed var(--linie);border-radius:12px;padding:10px;min-height:110px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--creme)}
.bin h4{margin:0;font-weight:normal;font-size:16px;color:var(--blau)}
.feedback{min-height:1.5em;font-size:16px;color:var(--ink-soft)}
.feedback.good{color:var(--ok)} .feedback.bad{color:var(--bad)}

/* Karten */
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.karte{min-height:120px;border:1px solid var(--linie);border-radius:14px;background:var(--tile);padding:14px;text-align:left;cursor:pointer;display:grid;gap:6px;align-content:start}
.karte .kk{font-size:18px;color:var(--blau)}
.karte .kr{font-size:15px;color:var(--ink-soft)}
.karte.offen{background:#eef4f9;border-color:var(--blau-hell)}
.karte .tipp{font-family:var(--sans);font-size:12px;color:var(--blau-mittel)}

/* Animationen / Widgets */
.anim svg{width:100%;height:auto;display:block;background:#f3f7fa;border-radius:12px;border:1px solid var(--linie)}
.regler{width:100%;accent-color:var(--blau);height:28px}
.anim-text{min-height:4.6em;font-size:16px;background:var(--creme);border-radius:10px;padding:10px 12px}
.anim-text b{color:var(--blau)}
.lbl{font-family:var(--sans);font-size:11px;fill:var(--ink-soft)}
.lbl.b{font-weight:600;fill:var(--ink);font-size:12px}
.lbl.gross{font-size:15px;font-weight:700;fill:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.vgl{display:grid;gap:10px}
.vgl-zeile{display:grid;gap:4px}
.vgl-kopf{display:flex;justify-content:space-between;font-family:var(--sans);font-size:14px;color:var(--ink-soft)}
.vgl-balken{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:center;font-family:var(--sans);font-size:13px}
.vgl-balken .bb{height:14px;background:var(--creme-tief);border-radius:7px;overflow:hidden}
.vgl-balken .bb i{display:block;height:100%;border-radius:7px;transition:width .8s}
.vgl-balken .s i{background:#e3a447} .vgl-balken .w i{background:#6f9cc7}
.vgl-typ{text-align:center;font-size:20px;color:var(--blau)}
.feld{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feld button{aspect-ratio:1;border:1px solid #c9b48f;border-radius:12px;background:linear-gradient(180deg,#f4efe4,#e2d3b5);font-size:30px;cursor:pointer;display:grid;place-items:center}
.feld button:disabled{cursor:default}
.spur-svg{max-width:260px;margin:0 auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{text-align:left;background:var(--creme);border:1px solid var(--linie);border-radius:12px;padding:11px 13px;cursor:pointer;display:flex;gap:10px;font-size:17px}
.ans b{color:var(--blau-mittel);font-family:var(--sans);font-weight:normal}
.ans.ok{border-color:var(--ok);background:#e3f0e7}
.ans.bad{border-color:var(--bad);background:#f6e1de}
.ans:disabled{cursor:default}
.waerme{transition:opacity .4s}
.federkleid{transition:r .5s}

/* Quiz */
.quiz{display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--creme-tief);border:1px solid var(--linie)}
.dots i.ok{background:var(--ok);border-color:var(--ok)} .dots i.bad{background:var(--bad);border-color:var(--bad)} .dots i.now{background:var(--blau);border-color:var(--blau)}
.qq{font-size:20px}
.jokers{display:flex;gap:8px;flex-wrap:wrap}
.publikum{font-style:italic;color:var(--ink-soft);border-left:3px solid var(--honig);padding-left:12px}
.ergebnis{text-align:center;display:grid;gap:10px;justify-items:center}
.ergebnis .gross{font-size:40px;letter-spacing:4px}

/* Feier, Toast, Konfetti, Urkunde */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,32,45,.6);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto}
.feierkarte{background:var(--tile);border-radius:18px;padding:24px 20px;max-width:420px;width:100%;text-align:center;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.feierkarte .fmed{font-size:64px;animation:pop .6s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-family:var(--sans);font-size:15px;z-index:60;transition:transform .3s;max-width:90vw;text-align:center}
.toast.zeigen{transform:translateX(-50%) translateY(0)}
.konffeld{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.konf{position:absolute;top:-16px;font-size:18px;animation:fall 3.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.urkunde{background:#fffdf7;max-width:640px;width:100%;border-radius:6px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.rahmen{border:3px double var(--blau);outline:1px solid var(--honig);outline-offset:-10px;padding:26px 22px;text-align:center;display:grid;gap:8px;justify-items:center}
.urk-eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.urk-med{font-size:56px}
.urk-titel{font-size:44px;color:var(--blau);letter-spacing:.06em}
.urk-sub{font-size:18px;color:var(--honig-tief)}
.urk-satz{font-size:17px}
.urk-name{font:inherit;font-size:26px;text-align:center;border:0;border-bottom:1.5px solid var(--ink-soft);background:transparent;width:min(100%,380px);padding:4px;color:var(--ink)}
.urk-name-druck{display:none;font-size:26px;border-bottom:1.5px solid var(--ink-soft);min-width:300px;padding:4px}
.urk-tab{width:100%;max-width:440px;border-collapse:collapse;font-size:15px;margin-top:6px}
.urk-tab td{padding:4px 6px;border-bottom:1px solid var(--linie);text-align:left}
.urk-tab td:last-child{text-align:right;white-space:nowrap}
.urk-summe{font-size:17px;color:var(--blau)}
.urk-album{font-size:24px;letter-spacing:4px}
.urk-fuss{display:flex;justify-content:space-between;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:12px;gap:10px;flex-wrap:wrap}
.urk-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px}
.lehrer summary{font-size:16px}
.reset{display:grid;gap:8px;justify-items:center;text-align:center}
footer.fuss{border-top:1px solid var(--linie);margin-top:34px;padding-top:18px;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft);display:grid;gap:6px}

@media (max-width:480px){.answers{grid-template-columns:1fr} body{font-size:17px} .bins,.bins.drei{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  @page{size:A4 portrait;margin:12mm}
  html,body{background:#fff}
  body *{visibility:hidden}
  #urkunde,#urkunde *{visibility:visible}
  #urkunde{position:absolute;inset:0;background:#fff;display:block;padding:0}
  .urkunde{box-shadow:none;max-width:none}
  .urk-btns,.urk-name{display:none!important}
  .urk-name-druck{display:block}
}

.kn-neu{transform-box:fill-box;transform-origin:center}
.reihe{display:grid;gap:12px}
.reihe-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.reihe-punkte{display:flex;gap:6px}
.reihe-punkte i{width:10px;height:10px;border-radius:50%;background:var(--creme-tief);border:1px solid var(--linie)}
.reihe-punkte i.an{background:var(--blau);border-color:var(--blau)}
.reihe-zeit{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--honig-tief)}
.ordnen{display:grid;gap:8px}
.ordnen ol{margin:0;padding-left:1.4em;display:grid;gap:6px;min-height:1.5em}
.ordnen ol li{color:var(--ok)}
.zucht{display:grid;gap:10px}
.welpen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.welpe{border:1px solid var(--linie);border-radius:12px;background:var(--creme);cursor:pointer;display:grid;justify-items:center;gap:2px;padding:8px 2px;font-family:var(--sans);font-size:12px;color:var(--ink-soft)}
.welpe span{line-height:1}
.welpe:disabled{cursor:default;opacity:.55}
.welpe.gewaehlt{border-color:var(--ok);background:#e3f0e7;opacity:1}
.zucht-leiste{display:flex;gap:4px;align-items:flex-end;height:70px;padding:6px;background:var(--creme);border-radius:10px}
.zucht-leiste div{flex:1;background:var(--blau-mittel);border-radius:4px 4px 0 0;display:grid;place-items:start center;color:#fff;font-family:var(--sans);font-size:10px;padding-top:2px;transition:height .6s}
.eier{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ei{border:1px solid var(--linie);border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;background:linear-gradient(160deg,#fff8ec,#ead9bd);aspect-ratio:3/4;cursor:pointer;display:grid;place-items:center;font-family:var(--sans);font-size:11px;color:#7a1f15;padding:4px;text-align:center}
.ei.an{box-shadow:0 0 0 3px var(--honig)}
.fd-views{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px;align-items:start}
.anim svg.fd-draw{width:100%;height:290px;display:block;background:#f3f7fa;border:1px solid var(--linie);border-radius:12px}
.fd-cap{text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:6px}
.fd-leg{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.fd-sw{display:inline-block;width:20px;height:3px;background:#b08a55;vertical-align:middle;margin-right:6px}
.fd-sw.fein{height:2px;background:var(--ink)}
@media(max-width:520px){.fd-views{grid-template-columns:1fr;gap:10px}.anim svg.fd-over{height:230px}}
.anim svg.gr-szene{width:100%;height:420px;display:block}
.gr-leg{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.gr-leg span::before{content:"";display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px;background:#7d8a96}
.gr-leg .sehne::before{background:#c0392b}
.gr-kopf{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.gr-kopf output{color:var(--blau);font-weight:600}
.sb-bild .rahmen-bild{aspect-ratio:480/407;background:#fff}
.sb-bild img{object-fit:contain}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.galerie figure.bild .rahmen-bild{aspect-ratio:4/3}
.galerie figure.bild figcaption{font-size:15px}
.kn-svg svg,.anim .kn-svg svg{width:100%;height:auto;display:block}
.sk-opt{display:grid;gap:8px}
.sk-ende{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:14px;align-items:start}
.sk-ende img{width:100%;border-radius:8px;border:1px solid var(--linie);box-shadow:0 2px 8px rgba(35,61,92,.12)}
.sk-ende > div{display:grid;gap:8px;justify-items:start}
@media (max-width:480px){.sk-ende{grid-template-columns:1fr}.sk-ende img{max-width:260px}}

/* Futterhaus-Pass */
.tabs.links{justify-content:flex-start}
.garten{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--linie)}
.garten svg{display:block;width:100%;height:auto}
.pmark{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:var(--blau);color:#fff;font-family:var(--sans);font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.pmark.p-ja{background:var(--ok)} .pmark.p-nein{background:var(--bad)} .pmark.p-geht{background:var(--honig)}
.pmark.an{outline:3px solid var(--honig);outline-offset:2px}
.gaeste{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gast{display:grid;align-content:start;gap:4px;text-align:left;background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:0 0 12px;overflow:hidden;cursor:pointer;font-family:var(--serif)}
.gast:hover{box-shadow:0 4px 14px rgba(35,61,92,.14)}
.gbild{position:relative;display:block;aspect-ratio:12/5;background:#e9f0f6}
.gbild img{display:block;width:100%;height:100%;object-fit:cover}
.gname{font-size:18px;font-weight:bold;color:var(--blau);padding:6px 12px 0}
.gtext{font-size:14px;line-height:1.45;color:var(--ink-soft);font-family:var(--sans);padding:0 12px}
.marke{position:absolute;right:8px;top:8px;background:var(--blau);color:#fff;font-family:var(--sans);font-size:11px;letter-spacing:.04em;border-radius:999px;padding:3px 9px}
.marke.inline{position:static;vertical-align:middle;margin-left:6px}
.tafelkarte{background:var(--tile);border-radius:18px;padding:18px;max-width:560px;width:100%;display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.tk-kopf{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tk-kopf .knopf{padding:6px 12px}
.tk-bild{background:var(--creme);border-radius:10px;overflow:hidden;border:1px solid var(--linie)}
.tk-bild img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.vcopy{text-align:right;margin-top:-6px}
.zkarte{display:grid;gap:6px}
.zreihe{display:grid;grid-template-columns:72px 1fr 40px 34px 40px;gap:8px;align-items:center;background:var(--creme);border-radius:10px;padding:5px 8px}
.zreihe img{width:72px;height:30px;object-fit:cover;border-radius:6px}
.zname{font-size:16px}
.zreihe output{text-align:center;font-family:var(--sans);font-size:18px;color:var(--blau);font-variant-numeric:tabular-nums}
.zbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--blau);background:var(--tile);color:var(--blau);font-size:22px;line-height:1;cursor:pointer}
.zsumme{text-align:center;font-family:var(--sans);font-size:15px;color:var(--ink-soft)}
.bq-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bq{position:relative;border:2px solid var(--linie);border-radius:12px;padding:0;overflow:hidden;background:var(--tile);cursor:pointer;display:grid;text-align:left}
.bq img{display:block;width:100%;aspect-ratio:12/5;object-fit:cover}
.bq-buch{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--blau);font-family:var(--sans);font-size:15px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.bq-name{font-size:16px;padding:6px 10px;color:var(--blau);font-weight:bold}
.bq-poll{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 10px;font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.bq-poll i{display:block;height:10px;width:0;background:var(--honig);border-radius:5px;transition:width .8s}
.bq-poll em{font-style:normal}
.bq.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.bq.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.bq:disabled{cursor:default}
.bq:disabled:not(.ok):not(.bad) img{opacity:.6}
.fd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fd-karte{position:relative;border:2px solid var(--linie);border-radius:12px;padding:0;overflow:hidden;background:var(--tile);cursor:pointer;display:grid;text-align:left}
.fd-karte img{display:block;width:100%;aspect-ratio:12/5;object-fit:cover}
.fd-name{font-size:15px;padding:5px 9px;color:var(--blau);font-weight:bold}
.fd-haken{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--blau);color:#fff;font-family:var(--sans);font-size:15px;display:none;place-items:center}
.fd-karte.an{border-color:var(--blau);box-shadow:0 0 0 2px var(--blau)} .fd-karte.an .fd-haken{display:grid}
.fd-karte.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)} .fd-karte.ok .fd-haken{display:grid;background:var(--ok)}
.fd-karte.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)} .fd-karte.bad .fd-haken{display:grid;background:var(--bad)}
.fd-karte.verpasst{border:2px dashed var(--ok)}
.fd-karte.raus{opacity:.45}
.fd-karte:disabled{cursor:default}
.fd-schritt{display:grid;gap:12px}
.fd-schritt + .fd-schritt{border-top:1px solid var(--linie);padding-top:16px}
.fd-zahl{display:flex;align-items:center;justify-content:center;gap:18px}
.fd-zahl output{font-family:var(--sans);font-size:40px;color:var(--blau);min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
.fd-zahl .zbtn{width:52px;height:52px;font-size:28px}
.wb-karte{position:relative;display:grid;gap:6px;background:#fbf1e2;border:2px solid var(--honig);border-radius:14px;padding:14px 16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 10px rgba(194,138,58,.25)}
.wb-karte.flieg{opacity:.35}
.wb-frage{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--honig-tief)}
.wb-text{font-size:18px;line-height:1.45}
.wb-griff{position:absolute;right:10px;top:8px;font-family:var(--sans);font-size:12px;color:var(--honig-tief)}
.wb-geist{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) rotate(-3deg);opacity:.95;padding:10px 12px}
.wb-geist .wb-text{font-size:14px}
.wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wb-bild{position:relative;border:2px solid var(--linie);border-radius:12px;padding:0;overflow:hidden;background:var(--tile);cursor:pointer;display:grid;text-align:left}
.wb-bild img{display:block;width:100%;aspect-ratio:12/5;object-fit:cover}
.wb-name{font-size:15px;padding:5px 9px;color:var(--ok);font-weight:bold}
.wb-name.leer{color:var(--ink-soft);font-weight:normal}
.wb-bild.ziel{border-color:var(--honig);box-shadow:0 0 0 3px var(--honig)}
.wb-bild.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);cursor:default}
@media (max-width:520px){.bq-grid{grid-template-columns:1fr}.zreihe{grid-template-columns:56px 1fr 40px 30px 40px}.zreihe img{width:56px}}

/* ---------- Bonus-Spiel: Ansturm am Futterhaus ---------- */
.station.bonus{border-color:var(--honig);box-shadow:0 0 0 2px #ecd9b4}
.station.bonus .nr{background:#f6ead2}
.an-hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.an-leben{font-size:20px;letter-spacing:2px;white-space:nowrap}
.an-leben .weg{opacity:.2;filter:grayscale(1)}
.an-punkte{font-size:26px;font-weight:bold;color:var(--blau);text-align:center;line-height:1}
.an-punkte small{display:block;font-size:11px;font-weight:normal;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.an-serie{justify-self:end;font-size:14px;background:var(--tile);border:1px solid var(--linie);border-radius:999px;padding:5px 11px;color:var(--ink-soft);white-space:nowrap}
.an-serie.heiss{background:var(--honig);border-color:var(--honig);color:#fff;font-weight:bold}
.an-feld{position:relative;background:var(--tile);border:1px solid var(--linie);border-radius:16px;overflow:hidden}
.an-bild{position:relative;aspect-ratio:473/196;background:linear-gradient(180deg,#dfe8ef,#f4f1e8);display:grid;place-items:center;overflow:hidden}
.an-bild img{width:100%;height:100%;object-fit:cover;display:block}
.an-bild .an-emoji{font-size:clamp(64px,22vw,110px);line-height:1}
.an-karte{animation:anRein .32s cubic-bezier(.2,.9,.3,1.1)}
.an-karte.raus{animation:anRaus .22s ease-in forwards}
.an-karte.wackel{animation:anWackel .4s}
@keyframes anRein{from{transform:translateX(60%);opacity:0}to{transform:none;opacity:1}}
@keyframes anRaus{to{transform:translateX(-60%);opacity:0}}
@keyframes anWackel{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.an-name{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px 4px}
.an-name b{font-size:22px;color:var(--blau);font-weight:normal}
.an-name span{font-family:var(--sans);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.an-zeit{height:8px;background:var(--creme-tief);margin:6px 14px 14px;border-radius:999px;overflow:hidden}
.an-zeit i{display:block;height:100%;width:100%;background:var(--ok);border-radius:999px}
.an-zeit i.knapp{background:var(--bad)}
.an-plus{position:absolute;right:14px;top:10px;font-family:var(--sans);font-weight:bold;font-size:22px;color:#fff;background:var(--ok);border-radius:999px;padding:4px 12px;pointer-events:none;animation:anPlus .8s ease-out forwards}
@keyframes anPlus{from{transform:translateY(10px);opacity:0}25%{transform:none;opacity:1}to{transform:translateY(-26px);opacity:0}}
.an-info{min-height:3.2em;font-family:var(--sans);font-size:15px;line-height:1.4;border-radius:12px;padding:10px 12px;background:var(--creme-tief);color:var(--ink-soft)}
.an-info.falsch{background:#f7e3df;color:#7a2a20}
.an-info b{color:inherit}
.an-tasten{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.an-taste{border:0;border-radius:14px;padding:14px 8px;min-height:74px;font-family:var(--sans);font-size:16px;font-weight:bold;color:#fff;cursor:pointer;display:grid;gap:2px;justify-items:center;align-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.an-taste .e{font-size:26px;line-height:1}
.an-taste:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.an-taste.korn{background:var(--honig-tief)}
.an-taste.weich{background:var(--ok)}
.an-taste.fett{background:var(--nuss)}
.an-taste.weg{background:var(--bad)}
.an-taste:disabled{cursor:default}
.an-taste.blass{opacity:.3}
.an-taste.richtig{outline:4px solid #7fd19a;outline-offset:2px}
.an-regeln{display:grid;gap:10px;font-family:var(--sans);font-size:15px}
.an-regel{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 12px}
.an-regel .e{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff}
.an-regel b{display:block;color:var(--blau);font-size:16px}
.an-zahl{font-size:clamp(90px,34vw,150px);text-align:center;color:var(--blau);line-height:1.2;font-family:var(--sans);font-weight:bold;animation:anZahl .7s ease-out}
@keyframes anZahl{from{transform:scale(1.6);opacity:0}40%{opacity:1}to{transform:scale(.9);opacity:.85}}
.an-ende{text-align:center;display:grid;gap:10px;background:var(--tile);border:1px solid var(--linie);border-radius:16px;padding:20px 16px}
.an-ende .gross{font-family:var(--sans);font-weight:bold;font-size:clamp(54px,18vw,80px);line-height:1;color:var(--blau);font-variant-numeric:tabular-nums}
.an-ende .titel{font-size:22px;color:var(--honig-tief)}
.an-ende .rekord{justify-self:center;font-family:var(--sans);font-weight:bold;font-size:14px;background:var(--honig);color:#fff;border-radius:999px;padding:5px 14px}
.an-werte{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--sans)}
.an-werte div{background:var(--creme);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--ink-soft)}
.an-werte b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.an-merk{font-family:var(--sans);font-size:15px;display:grid;gap:8px}
.an-merk div{background:var(--tile);border:1px solid var(--linie);border-left:4px solid var(--honig);border-radius:10px;padding:9px 12px}
@media (min-width:600px){.an-tasten{grid-template-columns:repeat(4,1fr)}}
/* ---------- Gäste-Sammelalbum ---------- */
.ga-kopf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ga-zahl{font-family:var(--sans);font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ga-zahl b{font-size:22px;color:var(--blau)}
.ga-balken{height:8px;background:var(--creme-tief);border-radius:999px;overflow:hidden}
.ga-balken i{display:block;height:100%;background:var(--honig);border-radius:999px}
.ga-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ga{position:relative;display:grid;align-content:start;background:var(--tile);border:1px solid var(--linie);border-radius:12px;overflow:hidden;padding:0 0 8px;text-align:left;font-family:var(--sans);color:var(--ink)}
button.ga{cursor:pointer;font:inherit;font-family:var(--sans)}
.ga-bild{position:relative;display:block;aspect-ratio:3/2;background:#dfe6ec;overflow:hidden}
.ga-bild img{display:block;width:100%;height:100%;object-fit:cover;object-position:32% 50%}
.ga.zu .ga-bild img{filter:grayscale(1) blur(7px) brightness(.75);transform:scale(1.2)}
.ga.zu .ga-bild::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:38px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ga-name{font-size:14px;font-weight:bold;color:var(--blau);padding:7px 8px 0;line-height:1.2;overflow-wrap:anywhere}
.ga.zu .ga-name{color:var(--ink-soft)}
.ga-wie{font-size:12px;line-height:1.3;color:var(--ink-soft);padding:3px 8px 0}
.ga-art{position:absolute;left:6px;top:6px;z-index:1;font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 7px;background:rgba(255,255,255,.9);color:var(--ink-soft)}
.ga-art.selten{background:var(--blau);color:#fff}
.ga-art.sehr{background:var(--honig);color:#fff}
.ga.auf.selten{border-color:var(--blau-mittel)}
.ga.auf.sehr{border-color:var(--honig);box-shadow:0 0 0 2px #ecd9b4}
.ga-neu{position:absolute;right:6px;top:6px;z-index:1;font-size:10px;font-weight:bold;letter-spacing:.06em;border-radius:999px;padding:2px 7px;background:var(--bad);color:#fff}
.ga.neu{animation:gaNeu .7s ease-out}
@keyframes gaNeu{from{transform:scale(.8);opacity:0}60%{transform:scale(1.06)}to{transform:none;opacity:1}}
@media (min-width:600px){.ga-grid{grid-template-columns:repeat(4,1fr)}}

/* ---------- Rätselvogel des Tages ---------- */
.rv-sterne{font-size:26px;letter-spacing:3px;line-height:1}
.rv-sterne .weg{opacity:.2;filter:grayscale(1)}
.rv-stand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--sans);font-size:14px;color:var(--ink-soft)}
.rv-hinweise{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:rv}
.rv-hinweise li{counter-increment:rv;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:10px 12px;font-size:17px;line-height:1.4}
.rv-hinweise li::before{content:counter(rv);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--blau);color:#fff;font-family:var(--sans);font-weight:bold;font-size:15px}
.rv-hinweise li.zu{background:transparent;border-style:dashed;color:var(--ink-soft);font-family:var(--sans);font-size:14px}
.rv-hinweise li.zu::before{background:var(--creme-tief);color:var(--ink-soft)}
.rv-hinweise li.frisch{animation:gaNeu .5s ease-out;border-color:var(--honig)}
.rv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rv-wahl{display:grid;align-content:start;background:var(--tile);border:1px solid var(--linie);border-radius:12px;overflow:hidden;padding:0 0 7px;font-family:var(--sans);font-size:13px;font-weight:bold;color:var(--blau);cursor:pointer;text-align:center;line-height:1.2;touch-action:manipulation}
.rv-wahl img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;object-position:32% 50%;margin-bottom:6px}
.rv-wahl span{padding:0 3px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.rv-wahl:disabled{opacity:.3;cursor:default;text-decoration:line-through}
.rv-wahl:not(:disabled):hover{border-color:var(--blau);box-shadow:0 2px 10px rgba(35,61,92,.15)}
.rv-ende{text-align:center;display:grid;gap:10px;background:var(--tile);border:1px solid var(--linie);border-radius:16px;overflow:hidden;padding:0 0 18px}
.rv-ende > *{margin-left:16px;margin-right:16px}
.rv-ende > img{margin:0;width:100%;aspect-ratio:473/196;object-fit:cover;display:block}
.rv-ende h3{font-size:26px;color:var(--blau)}
@media (min-width:600px){.rv-grid{grid-template-columns:repeat(7,1fr)}.rv-wahl{font-size:11.5px}}
/* ---------- Schnabel-Duell (zwei Teams an einem Gerät) ---------- */
.du-sitz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.du-sitz button{background:var(--tile);border:2px solid var(--linie);border-radius:14px;padding:12px 10px;font-family:var(--sans);font-size:14px;color:var(--ink-soft);cursor:pointer;display:grid;gap:4px;justify-items:center;text-align:center}
.du-sitz button b{font-size:16px;color:var(--blau)}
.du-sitz button .e{font-size:28px;line-height:1}
.du-sitz button.an{border-color:var(--blau);box-shadow:0 0 0 2px var(--blau-hell)}
.du-buehne{position:fixed;inset:0;z-index:40;background:var(--blau-tief);display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);font-family:var(--sans);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);user-select:none;-webkit-user-select:none;touch-action:manipulation;overscroll-behavior:none}
.du-buehne.neben{grid-template-rows:auto auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.du-buehne .du-gem{display:none}
.du-buehne.neben .du-gem .du-text{font-size:clamp(19px,4.2vh,34px)}
.du-buehne.neben .du-gem{display:grid;grid-column:1 / -1;grid-row:2;flex:none;aspect-ratio:473/196;max-height:46vh;width:100%;border-radius:0;border:0;border-bottom:2px solid var(--blau-tief)}
.du-buehne.neben .du-gem .du-warte{color:var(--blau)}
.du-buehne.neben:not(.fertig) .du-haelfte .du-frage{display:none}
.du-buehne.neben.fertig .du-gem{display:none}
.du-buehne.neben .du-haelfte{grid-row:3}
.du-buehne.neben .du-mitte{grid-column:1 / -1;grid-row:1}
.du-buehne.gegen .du-haelfte[data-p="0"]{transform:rotate(180deg)}
.du-haelfte{min-height:0;min-width:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.du-haelfte.blau{background:#e3edf6;--team:#2c5f8f}
.du-haelfte.rot{background:#fbe9e0;--team:#c2542f}
.du-buehne.neben .du-haelfte.blau{border-right:2px solid var(--blau-tief)}
.du-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--team);font-weight:bold;font-size:16px}
.du-pkt{display:flex;gap:4px}
.du-pkt i{width:13px;height:13px;border-radius:50%;border:2px solid var(--team);display:block}
.du-pkt i.voll{background:var(--team)}
.du-frage{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center;position:relative;border:2px solid var(--team)}
.du-frage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:32% 50%}
.du-frage .du-text{padding:10px 16px;font-family:var(--serif);font-size:clamp(17px,2.6vh + 4px,24px);line-height:1.35;text-align:center;color:var(--ink)}
.du-frage .du-warte{font-size:clamp(20px,4vh,30px);color:var(--team);font-weight:bold;text-align:center;padding:8px}
.du-frage .du-gross{font-size:clamp(44px,9vh,80px);line-height:1}
.du-status{min-height:1.5em;text-align:center;font-size:15px;font-weight:bold;color:var(--ink-soft)}
.du-status.gut{color:var(--ok)}
.du-status.schlecht{color:var(--bad)}
.du-wahl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.du-wahl button{min-height:50px;border-radius:12px;border:2px solid var(--team);background:#fff;color:var(--ink);font:inherit;font-weight:bold;font-size:16px;padding:6px 6px;cursor:pointer;touch-action:manipulation;hyphens:auto;-webkit-hyphens:auto}
.du-wahl button:disabled{cursor:default}
.du-wahl button.blass{opacity:.35}
.du-wahl button.richtig{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.du-wahl button.falsch{background:var(--bad);border-color:var(--bad);color:#fff;opacity:1}
.du-mitte{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;color:#dce8f3;font-size:14px;background:var(--blau-tief)}
.du-mitte button,.du-mitte a{border:1px solid #6f8aa6;background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.du-mitte .haupt{background:var(--honig);border-color:var(--honig);font-weight:bold}
.du-mitte .gruppe{display:flex;gap:8px}
@media (min-width:700px){.du-buehne.gegen .du-wahl{grid-template-columns:repeat(4,1fr)}.du-wahl button{font-size:17px;min-height:58px}}
@media (max-width:520px){.du-buehne.neben .du-wahl{grid-template-columns:1fr}.du-buehne.neben .du-wahl button{min-height:44px;font-size:15px}.du-buehne.neben .du-kopf{font-size:13px}.du-buehne.neben .du-pkt i{width:9px;height:9px}}

<script>
"use strict";

  if (reduce) return;

  const zeichen = ["🌻", "🐦", "⭐", "🥜", "🌻", "✨"];

function fanfare(gross) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    const ctx = new Ctx(); if (ctx.state === "suspended") ctx.resume();
    const t0 = ctx.currentTime + .05;
    const noten = gross
      ? [[392, 0, .14], [523.25, .14, .14], [659.25, .28, .14], [783.99, .42, .28], [659.25, .72, .14], [783.99, .86, .9]]

    noten.forEach(([fr, st, du]) => {
      [1, 2].forEach(oct => {
        const o = ctx.createOscillator(), g = ctx.createGain();

      <path d="M-3 8 L-4 13 M2 8 L2 13" stroke="#6b5a45" stroke-width="1.2"/></g>`;
  const gaeste = [
    summe >= 1 ? vogel(62, 104, .9, "#f2d34f", "#1d1d1d", "#fff", false) : "",
    summe >= 5 ? vogel(138, 104, .8, "#f0dc6a", "#3d7ac2", "#fff", true) : "",
    summe >= 9 ? vogel(150, 176, .95, "#e8833a", "#8a7560", "", true) : "",
    summe >= 13 ? vogel(48, 176, .95, "#e4593f", "#1d1d1d", "", false) : ""
  ].join("");
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Futterhaus mit ${summe} von ${max} Sonnenblumenkernen">
    <rect x="96" y="128" width="8" height="62" fill="#8a5a2b"/>
    <ellipse cx="100" cy="190" rx="60" ry="6" fill="#e9e1cf"/>
    <rect x="52" y="120" width="96" height="10" rx="2" fill="#a8743b" stroke="#6b4a2b" stroke-width="1.5"/>
    <rect x="56" y="74" width="7" height="48" fill="#a8743b"/><rect x="137" y="74" width="7" height="48" fill="#a8743b"/>
    ${kerne.join("")}
    <path d="M38 78 L100 34 L162 78 Z" fill="#b23b2e" stroke="#7a2a20" stroke-width="2" stroke-linejoin="round"/>
    <path d="M44 76 L100 38 L156 76" fill="none" stroke="#fff" stroke-width="3" opacity=".75"/>
    ${gaeste}
  </svg>`;

  /* Film-Detektiv: Arten ankreuzen, dann fünf Fragen zum Film */
  filmdetektiv(el) {
    const ANZ = FILM_ARTEN.length;
    const film = new Set(FILM_ARTEN.map(a => a[0]));
    el.innerHTML = `<span class="eyebrow">Film-Detektiv</span>
      <div class="fd-schritt" id="fdZahl"></div>
      <div class="fd-schritt" id="fdBilder" hidden></div>
      <div class="fd-schritt" id="fdFragen" hidden></div>
      <div class="fd-schritt" id="fdWer" hidden></div>`;
    const weiter = (id, fn) => { const b = $("#" + id, el); b.hidden = false; fn(b); };

    /* Schritt 1: Wie viele Arten? – noch ohne Bilder */
    const zahl = box => {
      let n = 5;
      box.innerHTML = `<h3>1 · Wie viele verschiedene Vogelarten hast du im Film gesehen?</h3>
        <p class="klein">Zähle jede Art nur einmal – auch wenn sie mehrmals vorbeikommt.</p>
        <div class="fd-zahl"><button type="button" class="zbtn" data-d="-1" aria-label="weniger">−</button>
          <output aria-live="polite">${n}</output>
          <button type="button" class="zbtn" data-d="1" aria-label="mehr">+</button></div>
        <div class="knopfreihe"><button type="button" class="knopf prim" id="fdZ">Prüfen</button></div>
        <p class="feedback" aria-live="polite"></p>`;
      $$(".zbtn", box).forEach(b => b.onclick = () => { n = Math.max(1, Math.min(30, n + +b.dataset.d)); $("output", box).textContent = n; });
      $("#fdZ", box).onclick = () => {
        $$(".zbtn", box).forEach(b => b.disabled = true);
        const d = Math.abs(n - ANZ), fb = $(".feedback", box);
        fb.className = "feedback " + (d === 0 ? "good" : d <= 2 ? "" : "bad");
        fb.innerHTML = d === 0 ? `Genau! Es sind <b>${ANZ} Arten</b>. Super gezählt! 🎯`
          : d <= 2 ? `Knapp daneben – es sind <b>${ANZ} Arten</b>. Gleich siehst du, welche.`
          : `Es sind <b>${ANZ} Arten</b>. Nicht leicht – im nächsten Schritt siehst du sie alle.`;
        $("#fdZ", box).parentElement.remove();
        weiter("fdBilder", bilder);
      };
    };

    /* Schritt 2: Wen hast du gesehen? */
    const bilder = box => {
      const karten = shuffle([...FILM_ARTEN, ...FILM_NICHT]), gewaehlt = new Set();
      box.innerHTML = `<h3>2 · Wen hast du im Film gesehen?</h3>
        <p class="klein">Tippe alle Vögel an, die im Film vorkommen. Vorsicht: Ein paar sind nicht dabei! Du kannst den Film auch noch einmal schauen.</p>
        <div class="fd-grid">${karten.map(([s, n]) => `<button type="button" class="fd-karte" data-s="${s}" aria-pressed="false">
          <img src="../images/futterhaus/fp-${s}.jpg" alt="" loading="lazy"><span class="fd-name">${n}</span><span class="fd-haken" aria-hidden="true">✓</span></button>`).join("")}</div>
        <div class="knopfreihe"><button type="button" class="knopf prim" id="fdAuf">🔍 Auflösen</button></div>
        <p class="feedback" aria-live="polite"></p>`;
      $$(".fd-karte", box).forEach(b => b.onclick = () => {
        const s = b.dataset.s; gewaehlt.has(s) ? gewaehlt.delete(s) : gewaehlt.add(s);
        b.classList.toggle("an", gewaehlt.has(s)); b.setAttribute("aria-pressed", gewaehlt.has(s));
      });
      $("#fdAuf", box).onclick = () => {
        let treffer = 0, falsch = 0;
        $$(".fd-karte", box).forEach(b => {
          const s = b.dataset.s, im = film.has(s), an = gewaehlt.has(s); b.disabled = true;
          if (im && an) { b.classList.add("ok"); treffer++; }
          else if (im) b.classList.add("verpasst");
          else if (an) { b.classList.add("bad"); falsch++; }
          else b.classList.add("raus");
        });
        const fb = $(".feedback", box), gut = treffer >= ANZ - 2 && falsch <= 1;
        fb.className = "feedback " + (gut ? "good" : "");
        fb.innerHTML = `Du hast <b>${treffer} von ${ANZ}</b> Arten erkannt${falsch ? ` und ${falsch} Mal danebengetippt` : ""}. ${gut ? "Echte Detektiv-Augen! 🔍" : "Die gestrichelten hast du übersehen – schau den Film ruhig noch einmal."}`;
        $("#fdAuf", box).parentElement.remove();
        weiter("fdFragen", fragen);
      };
    };

    /* Schritt 3: Fragen zum Film */
    const fragen = box => {
      let i = 0, richtig = 0;
      const qs = FILM_FRAGEN.map(([q, a, w]) => ({ q, w, a: shuffle(a.map((t, k) => ({ t, ok: k === 0 }))) }));
      const zeig = () => {
        if (i >= qs.length) {
          box.innerHTML = `<h3>3 · Fragen zum Film: ${richtig} von ${qs.length} richtig!</h3>
            <p>${richtig === qs.length ? "Dir entgeht nichts. 🦉" : richtig >= 3 ? "Gut aufgepasst!" : "Schau den Film noch einmal – mit Detektiv-Blick."}</p>`;
          weiter("fdWer", werBinIch);
          return;
        }
        const q = qs[i];
        box.innerHTML = `<h3>3 · Fragen zum Film</h3><span class="eyebrow">Frage ${i + 1} von ${qs.length}</span><p class="qq">${q.q}</p>
          <div class="answers">${q.a.map((a, k) => `<button type="button" class="ans" data-k="${k}"><b>${"ABCD"[k]}</b><span>${a.t}</span></button>`).join("")}</div>
          <p class="feedback" aria-live="polite"></p>
          <div><button type="button" class="knopf prim" data-w hidden>${i + 1 < qs.length ? "Nächste Frage" : "Weiter"}</button></div>`;
        $$(".ans", box).forEach(b => b.onclick = () => {
          const ok = q.a[+b.dataset.k].ok; if (ok) richtig++;
          $$(".ans", box).forEach(x => { x.disabled = true; if (q.a[+x.dataset.k].ok) x.classList.add("ok"); });
          if (!ok) b.classList.add("bad");
          const fb = $(".feedback", box); fb.className = "feedback " + (ok ? "good" : "bad");
          fb.innerHTML = `${ok ? "Richtig!" : "Nicht ganz."} ${q.w}`;
          $("[data-w]", box).hidden = false;
        });
        $("[data-w]", box).onclick = () => { i++; zeig(); };
      };
      zeig();
    };

    /* Schritt 4: Wer bin ich? – Rätselkarte auf das passende Bild ziehen (oder Bild antippen) */
    const werBinIch = box => {
      const alle = shuffle(FILM_ARTEN.map(a => a[0]));
      const runden = [alle.slice(0, 7), alle.slice(7)];
      let r = 0, punkte = 0, versuche = 0;
      const runde = () => {
        const arten = runden[r], stapel = shuffle(arten);
        let k = 0, fehler = 0;
        box.innerHTML = `<h3>4 · Wer bin ich?</h3>
          <p class="klein">Lies das Rätsel und zieh die Karte auf den passenden Vogel – oder tippe den Vogel einfach an. Runde ${r + 1} von ${runden.length}.</p>
          <div class="wb-karte" tabindex="0" aria-live="polite"></div>
          <div class="wb-grid">${shuffle(arten).map(s => `<button type="button" class="wb-bild" data-s="${s}">
            <img src="../images/futterhaus/fp-${s}.jpg" alt="Ein Vogel – wer ist das?"><span class="wb-name leer">?</span></button>`).join("")}</div>
          <p class="feedback" aria-live="polite"></p>`;
        const karte = $(".wb-karte", box), fb = $(".feedback", box);
        const zeigKarte = () => {
          if (k >= stapel.length) return fertig();
          karte.innerHTML = `<span class="wb-frage">❓ Wer bin ich?</span><span class="wb-text">${WER_BIN_ICH[stapel[k]]}</span><span class="wb-griff" aria-hidden="true">⠿ ziehen</span>`;
          karte.classList.remove("flieg");
        };
        const pruefe = s => {
          if (k >= stapel.length) return;
          const ziel = $(`.wb-bild[data-s="${s}"]`, box); if (!ziel || ziel.disabled) return;
          versuche++;
          if (s === stapel[k]) {
            punkte++; ziel.disabled = true; ziel.classList.add("ok"); const nm = $(".wb-name", ziel); nm.textContent = FILM_NAME[s]; nm.classList.remove("leer");
            fb.className = "feedback good"; fb.textContent = `Richtig – das ist ${FILM_NAME[s]}!`;
            k++; zeigKarte();
          } else {
            fehler++; ziel.classList.add("shake"); setTimeout(() => ziel.classList.remove("shake"), 400);
            fb.className = "feedback bad"; fb.textContent = "Das bin ich nicht – lies noch einmal genau.";
          }
        };
        $$(".wb-bild", box).forEach(b => b.onclick = () => pruefe(b.dataset.s));
        /* Ziehen mit Finger oder Maus */
        let geist = null, start = null;
        karte.addEventListener("pointerdown", e => {
          if (k >= stapel.length) return;
          start = { x: e.clientX, y: e.clientY }; karte.setPointerCapture(e.pointerId);
        });
        karte.addEventListener("pointermove", e => {
          if (!start) return;
          if (!geist && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) {
            geist = karte.cloneNode(true); geist.classList.add("wb-geist"); geist.style.width = karte.offsetWidth * .6 + "px";
            document.body.appendChild(geist); karte.classList.add("flieg");
          }
          if (geist) {
            geist.style.left = e.clientX + "px"; geist.style.top = e.clientY + "px";
            const unter = document.elementFromPoint(e.clientX, e.clientY), t = unter && unter.closest(".wb-bild");
            $$(".wb-bild", box).forEach(b => b.classList.toggle("ziel", b === t && !b.disabled));
          }
        });
        const ende = e => {
          if (!start) return; start = null;
          if (geist) {
            geist.remove(); geist = null; karte.classList.remove("flieg");
            $$(".wb-bild", box).forEach(b => b.classList.remove("ziel"));
            const unter = document.elementFromPoint(e.clientX, e.clientY), t = unter && unter.closest(".wb-bild");
            if (t) pruefe(t.dataset.s);
          }
        };
        karte.addEventListener("pointerup", ende);
        karte.addEventListener("pointercancel", ende);
        const fertig = () => {
          karte.innerHTML = `<span class="wb-frage">${fehler ? "Geschafft!" : "Alles auf Anhieb! 🎉"}</span><span class="wb-text">Runde ${r + 1}: ${arten.length} Vögel erkannt${fehler ? `, ${fehler} Fehlversuch${fehler > 1 ? "e" : ""}` : ""}.</span>`;
          fb.textContent = "";
          r++;
          if (r < runden.length) {
            karte.insertAdjacentHTML("afterend", `<div class="knopfreihe"><button type="button" class="knopf prim" id="wbW">Nächste Runde ›</button></div>`);
            $("#wbW", box).onclick = runde;
          } else {
            karte.insertAdjacentHTML("afterend", `<p class="merke">Du kennst jetzt alle ${ANZ} Vögel aus dem Film – ${punkte} von ${versuche} Versuchen saßen. Am Futterhaus erkennst du sie wieder! 🐦</p>
              <div class="knopfreihe"><button type="button" class="knopf" id="fdNeu">↺ Film-Detektiv neu starten</button></div>`);
            $("#fdNeu", box).onclick = () => WIDGETS.filmdetektiv(el);
          }
        };
        zeigKarte();
      };
      runde();
    };

    zahl($("#fdZahl", el));
  },

/* ============ Tafel-Ansicht ============ */
function tafel(s) {
  const [, name, , text, foto, marke] = GAST[s];
  const o = document.createElement("div"); o.className = "overlay"; o.setAttribute("role", "dialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-label", name);
  o.innerHTML = `<div class="tafelkarte">
    <div class="tk-kopf"><h3>${name}${marke ? ` <span class="marke inline">${marke}</span>` : ""}</h3><button type="button" class="knopf" data-zu aria-label="Schließen">✕</button></div>
    <p>${text}</p>
    ${foto ? `<div class="tabs"><button type="button" class="sbtn an" data-v="tafel">🖼️ Lehrtafel</button><button type="button" class="sbtn" data-v="foto">📷 Foto</button></div>` : ""}
    <div class="tk-bild"><img src="../images/voegel/tafel-${s}.jpg" alt="Lehrtafel ${esc(name)}"></div>
    <p class="hint tk-hinweis">Lehrtafel: Fauna Mibaso</p>
    <div class="knopfreihe"><a class="knopf" href="https://fauna.mibaso.de/arten/${s}.html" target="_blank" rel="noopener">Zur Artseite ↗</a><button type="button" class="knopf prim" data-zu>Schließen</button></div></div>`;
  document.body.appendChild(o);
  const zu = () => { o.remove(); document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") zu(); };
  document.addEventListener("keydown", esc_);
  $$("[data-zu]", o).forEach(b => b.onclick = zu);
  o.onclick = e => { if (e.target === o) zu(); };
  $$("[data-v]", o).forEach(b => b.onclick = () => {
    $$("[data-v]", o).forEach(x => x.classList.toggle("an", x === b));
    const f = b.dataset.v === "foto";
    $(".tk-bild img", o).src = `../images/voegel/${f ? "foto" : "tafel"}-${s}.jpg`;
    $(".tk-hinweis", o).textContent = f ? "Foto: Michael Baur" : "Lehrtafel: Fauna Mibaso";
  });
  $("[data-zu]", o).focus();
}

/* ============ Bilderquiz: vier Bilder je Frage ============ */
function bilderquiz(el, data, fertig) {
  let i = 0, score = 0, j50 = false, jpub = false; const marks = [];
  const qs = data.map(([q, opts, warum]) => ({ q, warum, a: shuffle(opts.map((s, k) => ({ s, ok: k === 0 }))) }));
  const zeichne = () => {
    if (i >= qs.length) return fertig(score, qs.length);
    const q = qs[i];
    el.innerHTML = `<div class="quiz">
      <div class="qhead"><span class="eyebrow">Frage ${i + 1} von ${qs.length}</span><div class="dots">${qs.map((_, k) => `<i class="${marks[k] || (k === i ? "now" : "")}"></i>`).join("")}</div></div>
      <p class="qq">${q.q}</p>
      <div class="bq-grid">${q.a.map((a, k) => `<button type="button" class="bq" data-k="${k}">
        <img src="../images/futterhaus/fp-${a.s}.jpg" alt="Bild ${"ABCD"[k]}"><span class="bq-buch">${"ABCD"[k]}</span>
        <span class="bq-name" hidden>${GAST[a.s] ? GAST[a.s][1] : a.s === "star" ? "Star" : a.s}</span>
        <span class="bq-poll" hidden><i></i><em></em></span></button>`).join("")}</div>
      <div class="jokers"><button type="button" class="knopf" data-j="50" ${j50 ? "disabled" : ""}>50:50</button><button type="button" class="knopf" data-j="pub" ${jpub ? "disabled" : ""}>📣 Publikumsjoker</button></div>
      <p class="feedback" aria-live="polite"></p>
      <div><button type="button" class="knopf prim" data-weiter hidden>${i + 1 < qs.length ? "Nächste Frage" : "Auswertung"}</button></div></div>`;
    $$(".bq", el).forEach(b => b.onclick = () => antwort(+b.dataset.k));
    const b50 = $('[data-j="50"]', el), bp = $('[data-j="pub"]', el);
    b50.onclick = () => { j50 = true; b50.disabled = true;
      shuffle(q.a.map((a, k) => k).filter(k => !q.a[k].ok)).slice(0, 2).forEach(k => { $(`.bq[data-k="${k}"]`, el).hidden = true; }); };
    bp.onclick = () => { jpub = true; bp.disabled = true;
      const sichtbar = q.a.map((a, k) => k).filter(k => !$(`.bq[data-k="${k}"]`, el).hidden);
      // Die Klasse liegt meistens richtig – aber nicht immer
      const irrt = Math.random() < .15, fav = irrt ? shuffle(sichtbar.filter(k => !q.a[k].ok))[0] : q.a.findIndex(a => a.ok);
      const w = {}; sichtbar.forEach(k => w[k] = k === fav ? 40 + Math.random() * 30 : 5 + Math.random() * 20);
      const sum = Object.values(w).reduce((a, b) => a + b, 0);
      let pct = sichtbar.map(k => [k, Math.round(w[k] / sum * 100)]);
      pct[0][1] += 100 - pct.reduce((a, [, p]) => a + p, 0);
      pct.forEach(([k, p]) => { const pl = $(`.bq[data-k="${k}"] .bq-poll`, el); pl.hidden = false; $("em", pl).textContent = p + " %";
        requestAnimationFrame(() => { $("i", pl).style.width = p + "%"; }); });
    };
    $("[data-weiter]", el).onclick = () => { i++; zeichne(); };
  };
  const antwort = k => {
    const q = qs[i], ok = q.a[k].ok;
    $$(".bq", el).forEach(b => { b.disabled = true; $(".bq-name", b).hidden = false; if (q.a[+b.dataset.k].ok) b.classList.add("ok"); });
    if (!ok) $(`.bq[data-k="${k}"]`, el).classList.add("bad");
    $$("[data-j]", el).forEach(b => b.disabled = true);
    marks[i] = ok ? "ok" : "bad"; if (ok) score++;
    const fb = $(".feedback", el); fb.className = "feedback " + (ok ? "good" : "bad");
    fb.innerHTML = `${ok ? "Richtig!" : "Leider falsch."} ${q.warum}`;
    $("[data-weiter]", el).hidden = false; $("[data-weiter]", el).focus();

}


/* ============ Quiz ============ */
function quiz(el, data, jokers, fertig) {
  let i = 0, score = 0, j50 = false, jpub = false; const marks = [];

    el.innerHTML = `<div class="quiz">

      <p class="qq">${q.q}</p>
      <div class="answers">${q.a.map((a, k) => `<button type="button" class="ans" data-k="${k}"><b>${"ABCD"[k]}</b><span>${a.t}</span></button>`).join("")}</div>
      ${jokers ? `<div class="jokers"><button type="button" class="knopf" data-j="50" ${j50 ? "disabled" : ""}>50:50</button><button type="button" class="knopf" data-j="pub" ${jpub ? "disabled" : ""}>📣 Publikumsjoker</button></div>` : ""}

    $$(".ans", el).forEach(b => b.onclick = () => antwort(+b.dataset.k));
    const b50 = $('[data-j="50"]', el), bp = $('[data-j="pub"]', el);
    if (b50) b50.onclick = () => { j50 = true; b50.disabled = true;
      shuffle(q.a.map((a, k) => k).filter(k => !q.a[k].ok)).slice(0, 2).forEach(k => { $(`.ans[data-k="${k}"]`, el).hidden = true; }); };
    if (bp) bp.onclick = () => { jpub = true; bp.disabled = true; const p = $(".publikum", el); p.hidden = false;
      const r = Math.random(), h = q.hints[r < .45 ? 0 : r < .7 ? 1 : r < .88 ? 2 : 3];
      p.textContent = "„" + h.replace(/^([^:]+): /, "$1 ruft: ") + "“"; };
    $("[data-weiter]", el).onclick = () => { i++; zeichne(); };
  };
  const antwort = k => {
    const q = qs[i], ok = q.a[k].ok;
    $$(".ans", el).forEach(b => { b.disabled = true; if (q.a[+b.dataset.k].ok) b.classList.add("ok"); });
    if (!ok) $(`.ans[data-k="${k}"]`, el).classList.add("bad");
    $$("[data-j]", el).forEach(b => b.disabled = true);
    marks[i] = ok ? "ok" : "bad"; if (ok) score++;
    const fb = $(".feedback", el); fb.className = "feedback " + (ok ? "good" : "bad"); fb.textContent = ok ? "Richtig!" : "Leider falsch.";
    $("[data-weiter]", el).hidden = false; $("[data-weiter]", el).focus();
  };
  zeichne();
}

/* ============ Station abschließen ============ */
function abschliessen(eid, sid, score, total) {
  const X = EXPS[eid], n = X.stationen.length;
  const knochen = total === 3 ? score : (score >= 9 ? 3 : score >= 7 ? 2 : score >= 5 ? 1 : 0);
  const vorher = kennzahlen(eid), rangVorher = rangIndex(eid, vorher.summe), alleVorher = vorher.fertige === n;
  const abzVorher = X.abzeichen.map(a => a.ok(vorher));
  S[eid] = S[eid] || {};
  const alt = S[eid][sid];
  S[eid][sid] = { done: true, knochen: Math.max(knochen, alt ? alt.knochen || 0 : 0), ts: Date.now() };
  speichern();
  const nach = kennzahlen(eid), rangNach = rangIndex(eid, nach.summe);
  return { knochen, best: S[eid][sid].knochen, neuerRang: rangNach > rangVorher ? X.raenge[rangNach] : null,
    geschafft: !alleVorher && nach.fertige === n, neueAbz: X.abzeichen.filter((a, k) => !abzVorher[k] && a.ok(nach)) };
}

      <p class="lead">Zwei Teams, ein Gerät: Beide sehen denselben Vogel – wer zuerst den richtigen Namen antippt, holt den Punkt. Wer zuerst ${DU_ZIEL} Punkte hat, gewinnt.</p>
      <ul class="clean">
        <li><b>Erst schauen, dann tippen:</b> Wer daneben tippt, setzt für diesen Vogel aus – das andere Team darf in Ruhe antworten.</li>
        <li><b>Zwei Arten von Runden:</b> Meist seht ihr ein Bild. Manchmal stellt sich der Vogel mit einem Satz vor.</li>
        <li><b>Fair bleiben:</b> Finger weg vom Bildschirm, bis der Vogel erscheint!</li>
      </ul>
      <h3 class="h-honig" style="font-size:20px">Wie sitzt ihr?</h3>
      <div class="du-sitz">
        <button type="button" data-sitz="gegen" class="an"><span class="e">🔄</span><b>Gegenüber</b>Das Gerät liegt flach zwischen euch</button>
        <button type="button" data-sitz="neben"><span class="e">↔️</span><b>Nebeneinander</b>Ihr schaut gemeinsam auf den Bildschirm</button>
      </div>
      <div class="knopfreihe"><button type="button" class="knopf prim" id="duLos">▶ Duell starten</button></div>
    </section>${fuss()}</div>`;
    $$("[data-sitz]", app).forEach(b => b.onclick = () => { sitz = b.dataset.sitz; $$("[data-sitz]", app).forEach(x => x.classList.toggle("an", x === b)); });
    $("#duLos").onclick = start;
  }

  function start() {
    stopp(); spielStop = stopp; aktiv = true;
    GAESTE.forEach(g => { const i = new Image(); i.src = `../images/futterhaus/fp-${g[0]}.jpg`; });
    buehne = document.createElement("div"); buehne.className = "du-buehne " + sitz;
    buehne.innerHTML = `<div class="du-haelfte ${DU_TEAMS[0][0]}" data-p="0"></div>
      <div class="du-mitte"><span id="duInfo"></span><span class="gruppe" id="duKnoepfe"><button type="button" id="duEnde">✕ Beenden</button></span></div>
      <div class="du-frage du-gem"></div>
      <div class="du-haelfte ${DU_TEAMS[1][0]}" data-p="1"></div>`;
    document.body.appendChild(buehne);
    const H = [0, 1].map(p => $(`.du-haelfte[data-p="${p}"]`, buehne));
    H.forEach((el, p) => el.innerHTML = `<div class="du-kopf"><span>${DU_TEAMS[p][1]}</span><span class="du-pkt"></span></div><div class="du-frage"></div><div class="du-status"></div><div class="du-wahl"></div>`);
    $("#duEnde", buehne).onclick = () => { location.hash = eid; };
    const punkte = [0, 0]; let aus = [false, false], offen = false, ziel = null, opts = [], nr = 0, sack = [];
    const punkteHTML = p => { let s = ""; for (let k = 0; k < DU_ZIEL; k++) s += `<i class="${k < punkte[p] ? "voll" : ""}"></i>`; return s; };
    const kopf = () => { H.forEach((el, p) => { const e = $(".du-pkt", el); e.innerHTML = punkteHTML(p); e.setAttribute("aria-label", punkte[p] + " Punkte"); }); $("#duInfo", buehne).textContent = `Runde ${nr} · ${punkte[0]} : ${punkte[1]} · bis ${DU_ZIEL}`; };
    const frage = html => { H.forEach(el => $(".du-frage", el).innerHTML = html); $(".du-gem", buehne).innerHTML = html; };
    const status = (p, text, cls) => { const e = $(".du-status", H[p]); e.textContent = text; e.className = "du-status " + (cls || ""); };

    function runde() {
      if (!aktiv) return;
      nr++; aus = [false, false]; offen = false;
      if (!sack.length) sack = shuffle(GAESTE.map(g => g[0]));
      ziel = sack.pop();
      opts = shuffle([ziel].concat(shuffle(GAESTE.map(g => g[0]).filter(s => s !== ziel)).slice(0, 3)));
      const hinweis = nr % 3 === 0;
      kopf();
      frage(`<div class="du-warte">Runde ${nr}<br>Achtung …</div>`);
      H.forEach((el, p) => {
        $(".du-wahl", el).innerHTML = opts.map(s => `<button type="button" data-s="${s}" disabled class="blass">${GAST[s][1]}</button>`).join("");
        status(p, hinweis ? "Gleich stellt sich ein Vogel vor" : "Gleich kommt ein Bild");
        $$(".du-wahl button", el).forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); tipp(p, b); }));
      });
      t1 = setTimeout(() => {
        if (!aktiv) return;
        frage(hinweis ? `<div class="du-text">„${RAETSEL[ziel][4]}“</div>` : `<img src="../images/futterhaus/fp-${ziel}.jpg" alt="Wer ist das?">`);
        H.forEach((el, p) => {
          $$(".du-wahl button", el).forEach(b => { b.disabled = false; b.classList.remove("blass"); });
          status(p, "Wer ist das?");
        });
        offen = true;
        t2 = setTimeout(() => aufloesen(-1), DU_ZEIT);
      }, 1100 + Math.random() * 1100);
    }
    function tipp(p, b) {
      if (!aktiv || !offen || aus[p] || b.disabled) return;
      if (b.dataset.s === ziel) { punkte[p]++; return aufloesen(p); }
      aus[p] = true; b.classList.add("falsch");
      $$(".du-wahl button", H[p]).forEach(x => { x.disabled = true; if (x !== b) x.classList.add("blass"); });
      status(p, "Daneben! Ihr setzt aus.", "schlecht");
      if (aus[0] && aus[1]) aufloesen(-1);
      else status(1 - p, "Die anderen lagen daneben – eure Chance!");
    }
    function aufloesen(sieger) {
      if (!aktiv || !offen) return;
      offen = false; clearTimeout(t2); kopf();
      H.forEach((el, p) => {
        $$(".du-wahl button", el).forEach(x => { x.disabled = true; if (x.dataset.s === ziel) { x.classList.remove("blass"); x.classList.add("richtig"); } else if (!x.classList.contains("falsch")) x.classList.add("blass"); });
        if (sieger === p) status(p, "✔ Punkt für euch!", "gut");
        else if (sieger < 0) status(p, `Kein Punkt – es war: ${GAST[ziel][1]}`, "schlecht");
        else if (!aus[p]) status(p, `Zu langsam – es war: ${GAST[ziel][1]}`);
      });
      t1 = setTimeout(() => { if (sieger >= 0 && punkte[sieger] >= DU_ZIEL) ende(sieger); else runde(); }, 1900);
    }
    function ende(sieger) {
      aktiv = false; buehne.classList.add("fertig");
      const vorher = kennzahlen(eid), abzVorher = X.abzeichen.map(z => z.ok(vorher));
      S[eid] = S[eid] || {}; S[eid].duell = { n: ((S[eid].duell && S[eid].duell.n) || 0) + 1 }; speichern();
      const nach = kennzahlen(eid), neueAbz = X.abzeichen.filter((z, k) => !abzVorher[k] && z.ok(nach));
      H.forEach((el, p) => {
        $(".du-frage", el).innerHTML = `<div class="du-warte"><div class="du-gross">${p === sieger ? "🏆" : "👏"}</div>${p === sieger ? "Gewonnen!" : "Gut gekämpft!"}<br>${punkte[p]} : ${punkte[1 - p]}</div>`;
        $(".du-wahl", el).innerHTML = "";
        status(p, p === sieger ? "Ihr habt die schnelleren Schnäbel." : "Revanche?", p === sieger ? "gut" : "");
      });
      $("#duInfo", buehne).textContent = `${DU_TEAMS[sieger][1]} gewinnt ${punkte[sieger]} : ${punkte[1 - sieger]}`;
      $("#duKnoepfe", buehne).innerHTML = `<button type="button" class="haupt" id="duNoch">🔁 Revanche</button><button type="button" id="duEnde">Zum Pass</button>`;
      $("#duNoch", buehne).onclick = start;
      $("#duEnde", buehne).onclick = () => { location.hash = eid; };
      konfetti();
      if (neueAbz.length) setTimeout(() => toast("Neues Abzeichen: " + neueAbz.map(z => z.em + " " + z.name).join(", ")), 600);
    }
    runde();
  }
  anleitung();
}

/* ============ Navigation ============ */
let letzteSumme = {};
function route(behalteScroll) {
  $$(".overlay").forEach(o => o.remove());
  if (spielStop) { spielStop(); spielStop = null; }
  const h = location.hash.slice(1), m = h.match(/^(f1)-(s[1-5])$/);
  if (EXPS[h]) { const s = kennzahlen(h).summe; seitePass(h, letzteSumme[h] !== undefined && s > letzteSumme[h]); letzteSumme[h] = s; }
  else if (h === "f1-spiel") seiteSpiel("f1");
  else if (h === "f1-raetsel") seiteRaetsel("f1");
  else if (h === "f1-duell") seiteDuell("f1");
  else if (m) { if (letzteSumme[m[1]] === undefined) letzteSumme[m[1]] = kennzahlen(m[1]).summe; seiteStation(m[1], m[2]); }
  else seiteStart();
  if (behalteScroll !== true) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => route());
route();

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Neu geladen wird nur auf der Start- und Pass-Seite – nie mitten in einer Station, einem Spiel oder einem offenen Fenster. */
(() => {
  let stand = null, neu = false;
  const ruhig = () => !location.hash.slice(1).includes("-")
    && !document.querySelector(".overlay, .du-buehne, #urkunde.an, #feier.an")
    && !/^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || "");
  async function pruefen() {
    try {
      const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
      const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
      if (!s) return;
      if (stand === null) stand = s; else if (s !== stand) neu = true;
      if (neu && ruhig()) location.reload();
    } catch (e) {}
  }
  pruefen();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pruefen(); });
  window.addEventListener("pageshow", e => { if (e.persisted) pruefen(); });
  window.addEventListener("hashchange", () => { if (neu && ruhig()) setTimeout(() => { if (ruhig()) location.reload(); }, 50); });
  setInterval(() => { if (!document.hidden) pruefen(); }, 15 * 60 * 1000);
})();
</script>
