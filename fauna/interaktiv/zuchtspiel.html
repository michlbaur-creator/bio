<body>
<div id="app"></div>

<script>
"use strict";
/* ============ Spielregeln: Vererbung und Auslese (ohne Anzeige) ============
   Jedes Tier hat fünf Merkmale von 0 bis 10 (z Zutrauen, g Gehorsam, a Ausdauer, j Jagdtrieb, s Größe) und eine Fellzahl f (nur Aussehen).
   Ein Welpe liegt bei jedem Merkmal in der Mitte zwischen den Eltern – plus Zufall (STREUUNG). Gezeigt werden Stufen von 0 bis 5. */
const MERK = [{ k: "z", n: "Zutrauen" }, { k: "g", n: "Gehorsam" }, { k: "a", n: "Ausdauer" }, { k: "j", n: "Jagdtrieb" }, { k: "s", n: "Größe" }];
const GENERATIONEN = 10, STREUUNG = 2.2, KOPPLUNG = 2.1;
const WOLF = { z: 2.4, g: 2.4, a: 9, j: 9, s: 8, f: 0 };
const stufe = v => Math.max(0, Math.min(5, Math.round(v / 2)));
const passt = (h, k, ziel) => { const p = stufe(h[k]); return p >= ziel[k][0] && p <= ziel[k][1]; };
const treffer = (h, ziel) => MERK.filter(m => passt(h, m.k, ziel)).length;
const gauss = rnd => { let u = 0; for (let i = 0; i < 6; i++) u += rnd(); return (u - 3) / 0.707; };   // ungefähr normalverteilt, Streuung 1
const klemme = v => Math.max(0, Math.min(10, v));
let laufnr = 0;
function welpe(v, m, rnd, schwach) {
  const w = { id: ++laufnr, sex: rnd() < .5 ? "m" : "w" };
  const gemeinsam = gauss(rnd) * KOPPLUNG;   // Zutrauen und Gehorsam hängen zusammen: Wer Menschen vertraut, achtet auch auf sie
  for (const k of ["z", "g", "a", "j", "s", "f"]) w[k] = klemme((v[k] + m[k]) / 2 + (k === "z" || k === "g" ? gemeinsam + gauss(rnd) * 1.3 : gauss(rnd) * (k === "f" ? 2.2 : STREUUNG)));
  if (schwach) w.a = klemme(w.a - 1.5);
  return w;
}
// Wurfgröße sinkt mit der Verwandtschaft der Eltern (inz = Generationen Geschwisterpaarung in Folge)
const wurfzahl = inz => inz <= 3 ? 6 : inz === 4 ? 5 : inz === 5 ? 3 : 2;
function wurf(v, m, inz, rnd) {
  const n = wurfzahl(inz), w = Array.from({ length: n }, () => welpe(v, m, rnd, inz >= 6));
  if (w.every(x => x.sex === w[0].sex)) w[n - 1].sex = w[0].sex === "m" ? "w" : "m";   // immer beide Geschlechter
  return w;
}
// Hund aus dem Nachbardorf: ein gewöhnlicher Dorfhund – frisches Blut, aber kein Spezialist
function fremder(sex, rnd) {
  const B = { z: 5.4, g: 4.6, a: 6.6, j: 6.8, s: 6.4, f: 3 + rnd() * 6 }, h = { id: ++laufnr, sex, fremd: true };
  for (const k of ["z", "g", "a", "j", "s"]) h[k] = klemme(B[k] + gauss(rnd) * .7);
  h.f = B.f; return h;
}
// Läuft ein zu scheues Tier weg? (erst ab dem dritten Wurf, Stufe 0 oder 1 bei Zutrauen)
const laeuftWeg = (h, gen, rnd) => gen >= 3 && !h.fremd && stufe(h.z) <= 1 && rnd() < .6;
if (typeof module !== "undefined") module.exports = { MERK, GENERATIONEN, WOLF, stufe, passt, treffer, wurf, wurfzahl, fremder, laeuftWeg, welpe };

/* ============ Der Auftrag ============ */
const AUFTRAG = {
  id: "hueten", em: "🐑", titel: "Der Hütehund", kurz: "Züchte in zehn Würfen aus Wölfen einen Hund, der Schafe hüten kann.",
  ziel: { z: [4, 5], g: [4, 5], a: [4, 5], j: [2, 3], s: [2, 3] },
  wunsch: ["vertraut seinem Menschen", "hört aufs Wort", "läuft den ganzen Tag, ohne müde zu werden", "umkreist und treibt die Schafe – beißt aber nie zu", "ist flink und wendig"],
  gut: { z: "Vertraut dem Schäfer und weicht ihm nicht von der Seite.", g: "Hört auf jeden Pfiff.", a: "Läuft den ganzen Tag mit der Herde.", j: "Umkreist die Schafe und treibt sie zusammen – ohne zuzubeißen.", s: "Flink und wendig, und die Schafe nehmen ihn ernst." },
  tief: { z: "Sobald der Schäfer näher kommt, weicht er zurück. Ein Hütehund muss seinem Menschen vertrauen.", g: "Der Schäfer pfeift – und nichts passiert. Ein Hütehund muss aufs Wort hören.", a: "Nach einer Stunde liegt er hechelnd im Gras. Die Herde zieht aber den ganzen Tag.",
    j: "Die Schafe sind ihm völlig gleichgültig. Hüten ist gebremstes Jagen: anschleichen und umkreisen, nur ohne Zupacken. Ganz ohne Jagdtrieb geht es nicht!", s: "Er ist so klein, dass die Schafe ihn einfach nicht ernst nehmen." },
  hoch: { j: "Er hetzt die Schafe und schnappt nach ihren Beinen. Zu viel Jagdtrieb!", s: "Er ist groß und schwer – bei schnellen Wendungen kommt er nicht hinterher." }
};
// Urteil über ein Tier: je Merkmal 0 = passt, −1 = zu wenig, +1 = zu viel
const urteil = (h, k) => { const p = stufe(h[k]), z = AUFTRAG.ziel[k]; return p < z[0] ? -1 : p > z[1] ? 1 : 0; };
const urteilText = (h, k) => { const u = urteil(h, k); return u === 0 ? AUFTRAG.gut[k] : u < 0 ? AUFTRAG.tief[k] : AUFTRAG.hoch[k]; };

/* ============ Helfer und Speicher (nur auf diesem Gerät) ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEY = "mibaso.fauna.zuchtspiel";
function laden() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } }
let S = laden();
function speichern() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const app = $("#app");
const sterneHTML = n => `<span aria-label="${n} von 3 Sternen">${[0, 1, 2].map(k => `<span class="${k < n ? "" : "stern-leer"}">⭐</span>`).join("")}</span>`;
const fuss = () => `<footer class="fuss">
  <div>Dein Spielstand wird nur auf diesem Gerät gespeichert. Keine Anmeldung, keine Datensammlung.</div>
  <div><a href="../../index.html">⌂ Bio Mibaso</a> · <a href="../../ueber/">Über mich</a> · <a href="../../impressum/">Impressum &amp; Datenschutz</a></div>
  <div>© 2026 Michael Baur · Vom Wolf zum Hütehund</div></footer>`;
function konfetti() {
  if (reduce) return;
  const f = document.createElement("div"); f.className = "konffeld"; const z = ["🐾", "⭐", "🐑", "✨", "🦴"];
  for (let k = 0; k < 40; k++) { const e = document.createElement("span"); e.className = "konf"; e.textContent = z[k % z.length]; e.style.cssText = `left:${Math.random() * 100}%;animation-delay:${(Math.random() * .9).toFixed(2)}s`; f.appendChild(e); }
  document.body.appendChild(f); setTimeout(() => f.remove(), 4800);
}

/* ============ Das Tier zeichnen: Aussehen folgt den Merkmalen ============
   Größe aus s. Mit dem Zutrauen kommen – ungefragt – Schlappohren, Ringelschwanz, kürzere Schnauze und weiße Flecken
   (wie im Fuchs-Versuch von Dmitri Beljajew). Die Fellfarbe (f) ist reines Aussehen. */
function tierSVG(h) {
  const farben = h.f < 2.5 ? ["#8f918b", "#6c6e69"] : h.f < 5 ? ["#a68f70", "#7d6a50"] : h.f < 7.5 ? ["#a06c3c", "#7a4f28"] : ["#45454a", "#2b2b2f"];
  const [fell, dunkel] = farben, sk = .64 + h.s * .046, schn = 15 - h.z * .55;
  const ohr = h.z < 4.5 ? `<path d="M79 31 L82 15 L90 29 Z" fill="${dunkel}"/>` : h.z < 6.5 ? `<path d="M79 31 L82 19 L90 21 L89 30 Z" fill="${dunkel}"/>` : `<path d="M79 27 Q76 40 83 44 Q89 38 88 28 Z" fill="${dunkel}"/>`;
  const schwanz = h.z < 5.5 ? `<path d="M31 46 Q17 50 15 68" fill="none" stroke="${fell}" stroke-width="7" stroke-linecap="round"/>` : `<path d="M31 46 Q15 42 19 27 Q24 19 29 27" fill="none" stroke="${fell}" stroke-width="6" stroke-linecap="round"/>`;
  const weiss = h.z > 5 ? `<ellipse cx="74" cy="56" rx="7" ry="6" fill="#fff"/><rect x="36" y="74" width="6" height="7" rx="2.5" fill="#fff"/><rect x="72" y="74" width="6" height="7" rx="2.5" fill="#fff"/>` + (h.z > 7 ? `<ellipse cx="50" cy="45" rx="10" ry="7" fill="#fff"/><path d="M${89 + schn} 34 h-${(schn * .7).toFixed(1)} v9 h${(schn * .7).toFixed(1)} Z" fill="#fff"/><circle cx="20" cy="${h.z < 5.5 ? 66 : 28}" r="3.6" fill="#fff"/>` : "") : "";
  return `<svg viewBox="0 10 124 82" class="tier" role="img" aria-label="${h.z < 3.5 ? "wolfsähnliches Tier" : "Hund"}"><g transform="translate(62 81) scale(${sk.toFixed(3)}) translate(-62 -81)">
    ${schwanz}
    <rect x="36" y="56" width="6" height="25" rx="3" fill="${dunkel}"/><rect x="66" y="56" width="6" height="25" rx="3" fill="${dunkel}"/>
    <ellipse cx="56" cy="50" rx="27" ry="13.5" fill="${fell}"/><path d="M31 44 Q56 32 80 42 Q56 40 31 48 Z" fill="${dunkel}" opacity=".55"/>
    <rect x="43" y="56" width="6" height="25" rx="3" fill="${fell}"/><rect x="72" y="56" width="6" height="25" rx="3" fill="${fell}"/>
    <path d="M70 46 L80 30 L92 40 L82 56 Z" fill="${fell}"/>
    <rect x="86" y="33" width="${(schn + 4).toFixed(1)}" height="10.5" rx="5" fill="${fell}"/>
    <circle cx="86" cy="35" r="10.5" fill="${fell}"/>
    ${weiss}${ohr}
    <circle cx="${(89 + schn).toFixed(1)}" cy="36" r="2.3" fill="#1c1c1c"/><circle cx="88" cy="33" r="1.7" fill="#1c1c1c"/>
  </g></svg>`;
}
const punkte = v => `<span class="pkt" aria-label="Stufe ${stufe(v)} von 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= stufe(v) ? "an" : ""}"></i>`).join("")}</span>`;
const werteHTML = h => `<span class="werte">${MERK.map(m => `<span>${m.n}</span>${punkte(h[m.k])}`).join("")}</span>`;
const sexZ = h => h.sex === "m" ? "♂" : "♀";
const wer = h => h.wolf ? (h.sex === "m" ? "Wolf" : "Wölfin") : h.sex === "m" ? "Rüde" : "Hündin";

/* ============ Startseite ============ */
function seiteStart() {
  const d = S[AUFTRAG.id];
  app.innerHTML = `<header class="app-head">
    <a class="zurueck-kopf" href="haustierpass.html">‹ Wild &amp; zahm</a>
    <div class="logo">🐺➜🐕</div><h1>Vom Wolf zum Hütehund</h1><div class="untertitel">Das Zuchtspiel – zehn Würfe, ein Ziel</div></header>
  <div class="huelle">
    <section>
      <p class="lead">Dein Dorf hält Schafe – und braucht dringend Hilfe beim Hüten. Am Dorfrand leben zwei Wölfe, die sich an Menschen gewöhnt haben. Kannst du aus ihren Nachkommen einen Hütehund züchten? Du hast zehn Würfe Zeit.</p>
      <div class="regeln">
        <div class="regel"><span class="e">🐾</span><span><b>Auslese:</b> Aus jedem Wurf wählst du einen Rüden ♂ und eine Hündin ♀ als Eltern für den nächsten. Die Welpen kommen nach ihren Eltern – aber nie genau.</span></div>
        <div class="regel"><span class="e">📜</span><span><b>Der Auftrag:</b> Nicht der schönste oder größte Welpe ist der richtige, sondern der, der zur Aufgabe passt.</span></div>
        <div class="regel"><span class="e">🔗</span><span><b>Verwandtschaft:</b> Wer immer nur Geschwister verpaart, bekommt kleine, schwache Würfe. Ein Hund aus dem Nachbardorf bringt frisches Blut – wirft dich aber ein Stück zurück.</span></div>
      </div>
    </section>
    <section>
      <div class="level"><button type="button" class="lv" id="los"><span class="em">${AUFTRAG.em}</span>
        <span><span class="nr">Auftrag</span><span class="nm">${AUFTRAG.titel}</span><span class="mo">${AUFTRAG.kurz}</span>
        <span class="st">${d && d.n ? sterneHTML(d.sterne || 0) + " · " + d.n + "× gezüchtet" : "▶ Zucht beginnen"}</span></span></button></div>
      <p class="klein">Eine Zucht dauert etwa zehn Minuten. Drei Sterne gibt es nur, wenn am Ende alle fünf Eigenschaften passen.</p>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>Das Zuchtspiel ist ein Bonus-Spiel zum Forscherpass „Wild &amp; zahm“ (Teil 1 „Vom Wolf zum Hund“). Die Kinder erleben Züchtung als das, was sie ist: Auslese über viele Generationen. Der Mensch wählt aus, die Unterschiede zwischen den Geschwistern liefert die Natur.</p>
        <ul class="clean">
          <li><b>Ablauf:</b> Zehn Würfe. Aus jedem Wurf werden ein Rüde und eine Hündin gewählt; ihre Welpen liegen bei jedem Merkmal zwischen den Eltern, mit zufälliger Abweichung. Gezeigt werden fünf Merkmale in fünf Stufen.</li>
          <li><b>Was zu entdecken ist:</b> Mehrere Merkmale zugleich im Blick behalten; Hüten ist gebremstes Jagdverhalten (Jagdtrieb darf nicht verschwinden); Aussehen ist kein Zuchtziel; mit der Zahmheit kommen ungefragt Schlappohren, Ringelschwanz und Scheckung (Fuchs-Versuch von Beljajew); Inzucht schwächt, frisches Blut hilft; zu scheue Tiere laufen fort.</li>
          <li><b>Probe an der Herde:</b> Nach dem dritten, sechsten und neunten Wurf zeigt eine Probe, woran es noch fehlt.</li>
          <li><b>Vereinfachung:</b> In Wirklichkeit dauerte der Weg vom Wolf zum Hütehund viele tausend Jahre und hunderte Generationen, und die meisten Eigenschaften hängen von sehr vielen Erbanlagen und von der Erziehung ab. Das bitte im Gespräch aufgreifen.</li>
          <li><b>Zeit:</b> etwa 10 Minuten; ohne Ton, ohne Anmeldung. Gut zu zweit an einem Gerät: Jede Auswahl muss begründet werden.</li>
        </ul>
        <div class="knopfreihe"><button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $("#los").onclick = () => { location.hash = AUFTRAG.id; };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Die Zucht ============ */
function seiteZucht() {
  const A = AUFTRAG;
  let vater = { ...WOLF, sex: "m", wolf: true, id: -1 }, mutter = { ...WOLF, sex: "w", wolf: true, id: -2 };
  let gen = 1, inz = 0, welpen = wurf(vater, mutter, inz, Math.random), gast = fremder("m", Math.random);
  let wahl = { m: null, w: null }, hinweis = null, ohrGesehen = false, fremdN = 0, wegN = 0;
  const ahnen = [vater];
  app.innerHTML = `<div class="spielkopf"><div class="innen">
      <div class="sk-zeile"><a href="#">‹ Beenden</a><span><b id="genText"></b></span></div>
      <div class="leisten"><span>Würfe</span><div class="wuerfe" id="wuerfe">${"<i></i>".repeat(GENERATIONEN)}</div>
        <span>Verwandtschaft</span><div class="kette" id="kette">${"<i></i>".repeat(6)}</div></div>
    </div></div>
    <div class="huelle"><section id="buehne"></section>${fuss()}</div>`;
  const buehne = $("#buehne");
  function kopf() {
    $("#genText").textContent = "Wurf " + Math.min(gen, GENERATIONEN) + " von " + GENERATIONEN;
    $$("#wuerfe i").forEach((el, i) => { el.className = i < gen - 1 ? "war" : i === gen - 1 ? "jetzt" : ""; });
    $$("#kette i").forEach((el, i) => { el.className = i < inz ? (inz >= 4 ? "eng" : "an") : ""; });
  }
  const karte = (h, extra) => `<button type="button" class="welpe${extra || ""}" data-id="${h.id}" aria-pressed="false">
      <span class="wk"><span class="sex ${h.sex}">${sexZ(h)}</span>${h.fremd ? `<span class="fremd">Nachbardorf</span>` : ""}</span>
      ${tierSVG(h)}${werteHTML(h)}</button>`;
  const elternHTML = () => `<div class="eltern"><span class="eyebrow">Die Eltern</span>
      <div class="elt"><div>${tierSVG(vater)}<span>${wer(vater)} ♂${vater.fremd ? " · Nachbardorf" : ""}</span></div><div>${tierSVG(mutter)}<span>${wer(mutter)} ♀${mutter.fremd ? " · Nachbardorf" : ""}</span></div></div></div>`;
  const auftragHTML = offen => `<details class="auftrag"${offen ? " open" : ""}><summary>📜 Der Auftrag: ein Hütehund</summary><ul class="clean">${A.wunsch.map(w => `<li>${w}</li>`).join("")}</ul>
      <p class="klein">Wie viel von jeder Eigenschaft richtig ist, musst du selbst herausfinden. Das Aussehen ist dem Schäfer gleichgültig.</p></details>`;

  function zeigeWurf() {
    kopf(); window.scrollTo(0, 0);
    const letzter = gen >= GENERATIONEN, alle = welpen.concat(letzter ? [] : [gast]);
    const n = welpen.length, zahlwort = ["", "ein Welpe", "zwei Welpen", "drei Welpen", "vier Welpen", "fünf Welpen", "sechs Welpen"][n];
    buehne.innerHTML = `<div class="karte">
      <div class="k-text"><span class="eyebrow">Wurf ${gen} von ${GENERATIONEN}</span>
        <h2>${letzter ? "Der letzte Wurf" : gen === 1 ? "Der erste Wurf" : zahlwort[0].toUpperCase() + zahlwort.slice(1)}</h2>
        ${hinweis ? `<div class="folge ${hinweis.art}" role="status"><span class="urteil">${hinweis.t}</span><span>${hinweis.k}</span></div>` : ""}
        <p>${letzter ? "Jetzt gilt es: Wähle den einen Welpen, der als Hütehund zur Herde geht."
          : gen === 1 ? "Die Wölfin hat Junge bekommen. Schau genau hin: Kein Welpe ist wie der andere. Wähle einen Rüden ♂ und eine Hündin ♀ – sie werden die Eltern des nächsten Wurfs."
          : "Wähle wieder einen Rüden ♂ und eine Hündin ♀ für den nächsten Wurf."}</p></div>
      <div class="zeile2">${elternHTML()}${auftragHTML(gen === 1)}</div>
      <div class="wurf">${alle.map(h => karte(h)).join("")}</div>
      <div class="weiter"><button type="button" class="knopf prim" id="weiter" disabled>${letzter ? "Zur Prüfung an der Herde ›" : "Diese beiden verpaaren ›"}</button></div></div>`;
    hinweis = null; wahl = { m: null, w: null };
    const finde = id => alle.find(h => h.id === +id);
    const mark = () => { $$(".welpe", buehne).forEach(b => { const an = letzter ? wahl.m && wahl.m.id === +b.dataset.id : [wahl.m, wahl.w].some(x => x && x.id === +b.dataset.id); b.classList.toggle("gewaehlt", !!an); b.setAttribute("aria-pressed", an ? "true" : "false"); });
      $("#weiter").disabled = letzter ? !wahl.m : !(wahl.m && wahl.w); };
    $$(".welpe", buehne).forEach(b => b.onclick = () => { const h = finde(b.dataset.id);
      if (letzter) wahl.m = wahl.m === h ? null : h; else wahl[h.sex] = wahl[h.sex] === h ? null : h;
      mark(); });
    $("#weiter").onclick = () => letzter ? pruefung(wahl.m) : paaren(wahl.m, wahl.w);
  }

  function paaren(rue, hue) {
    // Zu scheue Tiere laufen fort: ein Wurf Zeit ist verloren
    const fort = [rue, hue].find(h => laeuftWeg(h, gen, Math.random));
    if (fort) {
      wegN++; welpen = welpen.filter(h => h !== fort); gen++;
      const fehltSex = ["m", "w"].find(x => !welpen.some(h => h.sex === x));     // fehlt jetzt ein Geschlecht, kommt es aus dem Nachbardorf
      if (fehltSex && gast.sex !== fehltSex) gast = fremder(fehltSex, Math.random);
      if (!welpen.length) welpen = [fremder(fort.sex, Math.random)];
      hinweis = { art: "r0", t: (fort.sex === "m" ? "Der scheue Rüde" : "Die scheue Hündin") + " ist fortgelaufen!", k: "Eines Nachts war " + (fort.sex === "m" ? "er" : "sie") + " verschwunden – zurück im Wald. Ein Tier, das Menschen kaum vertraut, bleibt nicht im Dorf. Du hast einen ganzen Wurf Zeit verloren und musst aus den übrigen Tieren neu wählen." };
      return gen >= GENERATIONEN ? zeigeLetzterOhneWurf() : zeigeWurf();
    }
    const istFremd = rue.fremd || hue.fremd, altInz = inz;
    inz = istFremd ? 0 : inz + 1; if (istFremd) fremdN++;
    vater = rue; mutter = hue; ahnen.push(rue.fremd ? hue : rue);
    const probe = [3, 6, 9].includes(gen);
    gen++; welpen = wurf(vater, mutter, inz, Math.random); gast = fremder(gen % 2 ? "m" : "w", Math.random);
    // Hinweis für den nächsten Wurf
    if (welpen.length < 6 && inz >= 4) hinweis = { art: "r0", t: "Nur " + ["", "ein Welpe", "zwei Welpen", "drei Welpen", "vier Welpen", "fünf Welpen"][welpen.length] + (inz >= 6 ? " – und sie sind schwächlich" : "") + "!", k: "Deine Hunde sind zu eng miteinander verwandt. Bei solcher Inzucht werden die Würfe kleiner und die Welpen anfälliger. Ein Tier aus dem Nachbardorf bringt frisches Blut." };
    else if (istFremd && altInz >= 2) hinweis = { art: "schnee", t: "Frisches Blut!", k: "Der Hund aus dem Nachbardorf ist kein Spezialist – die Welpen sind ein Stück vom Ziel abgerückt. Dafür ist der Wurf wieder groß und gesund." };
    else if (!ohrGesehen && (vater.z >= 5.2 || mutter.z >= 5.2) && welpen.some(h => h.z > 5)) { ohrGesehen = true; hinweis = { art: "schnee", t: "Nanu – weiße Flecken und geknickte Ohren?", k: "Danach hast du gar nicht ausgewählt! Das hat auch ein berühmter Versuch mit Füchsen gezeigt: Wer immer nur die zutraulichsten Tiere weiterzüchtet, bekommt nach einigen Generationen Schlappohren, Ringelschwänze und geschecktes Fell gleich mit dazu." }; }
    probe ? zeigeProbe() : zeigeWurf();
  }
  function zeigeLetzterOhneWurf() { zeigeWurf(); }

  // Probe an der Herde: Die gewählten Eltern zeigen, woran es noch fehlt
  function zeigeProbe() {
    kopf(); window.scrollTo(0, 0);
    const mitte = {}; MERK.forEach(m => { mitte[m.k] = (vater[m.k] + mutter[m.k]) / 2; });
    const fehlt = MERK.filter(m => urteil(mitte, m.k) !== 0), n = MERK.length - fehlt.length;
    buehne.innerHTML = `<div class="karte">
      <div class="k-text"><span class="eyebrow">Nach Wurf ${gen - 1}</span><h2>🐑 Probe an der Herde</h2>
        <p>Der Schäfer nimmt deine beiden Zuchttiere einen Tag lang mit zu den Schafen. Am Abend berichtet er:</p></div>
      <div class="probe">${fehlt.length ? fehlt.map(m => `<div class="nein"><b>${m.n}:</b> ${urteilText(mitte, m.k)}</div>`).join("") : `<div class="ja"><b>„So habe ich mir das vorgestellt!“</b> Alle fünf Eigenschaften passen. Jetzt nur nichts mehr verlieren.</div>`}
        ${fehlt.length && n ? `<div class="ja"><b>Das passt schon:</b> ${MERK.filter(m => urteil(mitte, m.k) === 0).map(m => m.n).join(", ")}.</div>` : ""}</div>
      <div class="weiter"><button type="button" class="knopf prim" id="weiter">Zum nächsten Wurf ›</button></div></div>`;
    $("#weiter").onclick = zeigeWurf;
  }

  function pruefung(h) {
    const n = treffer(h, A.ziel), st = n === 5 ? 3 : n === 4 ? 2 : n === 3 ? 1 : 0, alt = S[A.id] || {};
    S[A.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, st) }; speichern();
    ahnen.push(h); gen = GENERATIONEN; kopf(); window.scrollTo(0, 0);
    const titel = st === 3 ? "Ein Hütehund wie aus dem Bilderbuch!" : st === 2 ? "Ein brauchbarer Hütehund" : st === 1 ? "Ein Hütehund-Lehrling" : "Ein netter Dorfhund – aber kein Hütehund";
    buehne.innerHTML = `<div class="ende">
        <div class="held">${tierSVG(h)}</div>
        <span class="eyebrow">Prüfung an der Herde</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(st)}</div>
        <div class="probe">${MERK.map(m => `<div class="${urteil(h, m.k) === 0 ? "ja" : "nein"}"><b>${urteil(h, m.k) === 0 ? "✔" : "✘"} ${m.n}:</b> ${urteilText(h, m.k)}</div>`).join("")}</div>
        <p class="klein">${n} von 5 Eigenschaften passen.${fremdN ? " Du hast " + (fremdN === 1 ? "einmal" : fremdN + "-mal") + " frisches Blut ins Dorf geholt." : " Du hast nie frisches Blut geholt."}${wegN ? " " + (wegN === 1 ? "Ein Tier ist" : wegN + " Tiere sind") + " dir fortgelaufen." : ""}</p>
        <div class="knopfreihe"><button type="button" class="knopf prim" id="noch">🔁 Neue Zucht beginnen</button><a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="haustierpass.html">Zum Forscherpass</a></div>
      </div>
      <h3 class="h-honig">Deine Ahnenreihe</h3>
      <div class="ahnen">${ahnen.map((x, i) => `<div>${tierSVG(x)}<span>${i === 0 ? "Wolf" : i === ahnen.length - 1 ? "Dein Hund" : "Wurf " + i}</span></div>`).join("")}</div>
      <h3 class="h-honig">Was du gerade getan hast</h3>
      <div class="merk">
        <div><b>Züchten heißt auswählen.</b> Du hast keinen einzigen Welpen verändert. Du hast nur entschieden, welche Tiere Nachwuchs bekommen. Die Unterschiede zwischen den Geschwistern hat die Natur geliefert.</div>
        <div><b>In Wirklichkeit dauerte das viel länger.</b> Seit mehr als 15 000 Jahren leben Hunde bei den Menschen. Bis aus Wölfen Hütehunde wurden, vergingen Jahrtausende und hunderte Generationen.</div>
        <div><b>Hüten ist gebremstes Jagen.</b> Anschleichen, fixieren, umkreisen – das alles stammt vom Wolf. Nur das Zupacken am Ende wurde weggezüchtet.</div>
        <div><b>Zahmheit verändert das Aussehen.</b> Schlappohren, Ringelschwanz und Flecken kamen von selbst, als die Tiere zutraulicher wurden.</div>
        <div><b>Zucht hat Grenzen.</b> Wer nur enge Verwandte verpaart oder ein Merkmal übertreibt, bekommt kranke Tiere – beim Mops zum Beispiel Atemnot durch die viel zu kurze Schnauze.</div>
      </div>`;
    $("#noch").onclick = seiteZucht;
    if (st === 3) konfetti();
  }
  zeigeWurf();
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  $$(".konffeld").forEach(k => k.remove());
  if (location.hash.slice(1) === AUFTRAG.id) seiteZucht(); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
