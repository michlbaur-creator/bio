<script>
"use strict";
/* ============ Spielregeln (ohne Anzeige) ============
   Plan mit 7 × 5 Feldern. Ein Flug kostet so viel Kraft, wie er Felder weit ist. Kraft gibt es nur an Futterplätzen.
   Im Schnabel passen wenige Stücke Baumaterial. Am Nestplatz wird verbaut – aber immer in der richtigen Reihenfolge.
   Gewertet werden die verbauten Stücke. Ein fertiges Nest bringt drei Sterne. */
const BREIT = 7, HOCH = 5, NEST = 2 * BREIT + 6;
const STOFF = {
  zweig:  { n: "Zweig",        mehr: "Zweige",        ort: "busch" },
  halm:   { n: "Halm",         mehr: "Halme",         ort: "gras" },
  lehm:   { n: "Lehm",         mehr: "Lehm",          ort: "pfuetze" },
  moos:   { n: "Moos",         mehr: "Moos",          ort: "moos" },
  feder:  { n: "Feder",        mehr: "Federn",        ort: "huhn" },
  flechte:{ n: "Flechte",      mehr: "Flechten",      ort: "baum" },
  spinne: { n: "Spinnweben",   mehr: "Spinnweben",    ort: "zaun" }
};
const ORTE = {
  busch:   { n: "Gebüsch",           stoff: "zweig",  nach: 2, info: "Dürre Zweige sind das Gerüst vieler Nester. Sie halten alles zusammen." },
  gras:    { n: "Altgras",           stoff: "halm",   nach: 2, boden: true, info: "Vorjährige trockene Halme. Wer im Herbst nicht alles mäht, hilft den Nestbauern im Frühling." },
  pfuetze: { n: "Pfütze",            stoff: "lehm",   nach: 1, boden: true, nass: true, info: "Feuchte Erde wird zu Lehm. Trocknet die Pfütze aus, gibt es keinen mehr – erst wieder nach Regen." },
  moos:    { n: "Moospolster",       stoff: "moos",   nach: 2, boden: true, info: "Weich und warm: Moos polstert das Nest und hält die Eier warm." },
  huhn:    { n: "Hühnerhof",         stoff: "feder",  nach: 2, boden: true, info: "Hier liegen weiche Federn herum – die beste Daunendecke für die Küken." },
  baum:    { n: "Alter Apfelbaum",   stoff: "flechte",nach: 2, info: "Auf der Rinde wachsen graugrüne Flechten. Damit tarnt der Buchfink sein Nest." },
  zaun:    { n: "Zaun mit Spinnweben", stoff: "spinne", nach: 3, info: "Spinnenseide ist klebrig und reißfest – der Klebstoff für ein Buchfinkennest." },
  wurm:    { n: "Rasen",             futter: 4, nach: 3, boden: true, info: "Hier ziehen Amseln Regenwürmer aus dem Boden. Nach Regen kommen sie besonders gern nach oben." },
  muecke:  { n: "Mückenschwarm",     futter: 4, nach: 2, info: "Über dem Teich tanzen Mücken. Schwalben fangen ihr Futter im Flug." },
  raupe:   { n: "Knospen mit Räupchen", futter: 4, nach: 3, info: "Im Frühling schlüpfen kleine Raupen. Buchfinken fressen sonst Samen – Junge und Brutvögel brauchen Insekten." },
  leer:    { n: "Weg",               boden: true, info: "Hier gibt es nichts zu holen." },
  nest:    { n: "Nestplatz",         info: "Hier entsteht dein Nest." }
};

    + (anteil >= 1 ? `<ellipse cx="50" cy="${y - h + 14}" rx="${26}" ry="5" fill="#f2ead8" stroke="#4a3420" stroke-width="1"/>` : "") : `<circle cx="50" cy="${y}" r="10" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4 3"/>`;
  return grund + nest + `<text x="50" y="96" text-anchor="middle" ${SCHRIFT} font-size="11.5" font-weight="bold" fill="#fff" stroke="#3d2c1a" stroke-width="3" paint-order="stroke">Dein Nest</text>`;
}
const ortBild = (t, gr = 44) => `<svg viewBox="0 0 100 100" width="${gr}" height="${gr}" aria-hidden="true" style="background:#b4c98a">${t === "pfuetze" ? BILD.pfuetze({ wasser: 2 }) : BILD[t](0)}</svg>`;
const matBild = (s, gr = 22) => `<svg viewBox="-10 -10 20 20" width="${gr}" height="${gr}" aria-hidden="true">${MAT[s]}</svg>`;
// Die Vögel von oben (Mitte bei 0,0)
function vogelSVG(id) {
  const F = { amsel: { leib: "#2a2522", fl: "#1d1917", kopf: "#2a2522", schnabel: "#f2a516" }, schwalbe: { leib: "#24345e", fl: "#1c2848", kopf: "#24345e", schnabel: "#222" }, buchfink: { leib: "#8a6e5a", fl: "#4c5a4a", kopf: "#5d7590", schnabel: "#8c97a8" } }[id];
  const fl = s => id === "schwalbe"
    ? `<g transform="scale(${s} 1)"><path d="M-4 -4 Q-24 -10 -38 -2 Q-22 2 -4 5 Z" fill="${F.fl}"/></g>`
    : `<g transform="scale(${s} 1)"><path d="M-4 -5 Q-26 -10 -30 4 Q-18 8 -4 6 Z" fill="${F.fl}"/>${id === "buchfink" ? `<path d="M-8 -2 L-24 -1" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>` : ""}</g>`;
  const schwanz = id === "schwalbe" ? `<path d="M-3 12 L-9 30 L-1 16 L1 16 L9 30 L3 12 Z" fill="${F.fl}"/>` : `<path d="M-4 12 L4 12 L3.5 26 L-3.5 26 Z" fill="${F.fl}"/>`;
  return `<g transform="scale(1.15)"><g class="fluegel">${fl(1)}${fl(-1)}</g>${schwanz}<ellipse cx="0" cy="3" rx="7" ry="11" fill="${F.leib}"/>
    <circle cx="0" cy="-10" r="6.5" fill="${F.kopf}"/>${id === "schwalbe" ? `<circle cx="0" cy="-14" r="3" fill="#a8342a"/>` : ""}<path d="M-1.6 -16 L0 -21 L1.6 -16 Z" fill="${F.schnabel}"/>
    <g class="hoeschen"><path d="M-6 -21 L6 -19" stroke="#c9a94e" stroke-width="2.2" stroke-linecap="round"/></g></g>`;
}
const markeSVG = (x, y, em) => `<g transform="translate(${x} ${y})" pointer-events="none"><circle cx="0" cy="0" r="17" fill="#fff" opacity=".85"/><text x="0" y="8" font-size="23" text-anchor="middle">${em}</text></g>`;
const rahmen = (X, Y, i, farbe) => { const x1 = Math.max(0, X(i) - 100) + 3, y1 = Math.max(70, Y(i) - 100) + 3, x2 = Math.min(700, X(i) + 200) - 3, y2 = Math.min(570, Y(i) + 200) - 3;
  return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="12" fill="none" stroke="${farbe}" stroke-width="3.5" stroke-dasharray="8 6" pointer-events="none"/>`; };

/* ============ Übersicht ============ */
function seiteStart() {
  const alle = LEVEL.every((L, i) => offen(i)), B = Object.keys(ORTE).filter(t => t !== "leer" && t !== "nest"), kenn = buch();
  app.innerHTML = `<header class="app-head">
    <a class="zurueck-kopf" href="vogelpass.html">‹ Vogelpass</a>
    <div class="logo">🪺🐦🌿</div><h1>Nestwerk</h1><div class="untertitel">Drei Vögel, drei Nester</div></header>
  <div class="huelle">
    <section>
      <p class="lead">Bald kommen die Eier – höchste Zeit für ein Nest! Sammle Baumaterial, bring es zum Nestplatz und bau Schicht für Schicht. Jede Vogelart hat ihren eigenen Bauplan.</p>
      <div class="regeln">
        <div class="regel"><span class="e">🪵</span><span><b>Material holen:</b> Zweige, Halme, Lehm, Moos, Federn … Nur wenig passt in deinen Schnabel.</span></div>
        <div class="regel"><span class="e">📋</span><span><b>Der Bauplan zählt:</b> Erst das Gerüst, dann die Wand, zuletzt das Polster. Was noch nicht dran ist, passt noch nicht.</span></div>
        <div class="regel"><span class="e">💪</span><span><b>Kraft:</b> Jeder Flug kostet Kraft. Fressen gibt neue. Tippst du auf dein eigenes Feld, verschnaufst du kurz.</span></div>
      </div>
    </section>
    <section>
      <h2 class="h-blau">Drei Baumeister</h2>
      <div class="level">${LEVEL.map((L, i) => { const d = S[L.id], zu = !offen(i);
        return `<button type="button" class="lv" data-i="${i}" ${zu ? "disabled" : ""}><span class="em">${zu ? "🔒" : `<svg viewBox="-40 -40 80 80" width="62" height="62" aria-hidden="true">${vogelSVG(L.id)}</svg>`}</span>
          <span><span class="nr">${L.zeit} · ${L.nestN}</span><span class="nm">${L.titel}</span><span class="mo">${zu ? "Öffnet sich, wenn du mit " + LEVEL[i - 1].titel.replace(/^(Die|Der) /, (m, a) => a === "Die" ? "der " : "dem ") + " einen Stern geholt hast." : L.motto}</span>
          ${d && d.n ? `<span class="st">${sterneHTML(d.sterne || 0)} · ${d.fertig ? "🪺 Nest fertig gebaut" : "Rekord: " + (d.best || 0) + " von " + summe(L) + " Stücken"}</span>` : zu ? "" : `<span class="st">▶ Losbauen</span>`}</span></button>`; }).join("")}</div>
      <p class="klein">Ein Bautag dauert etwa drei Minuten.</p>
    </section>
    <section>
      <h2 class="h-blau">📖 Dein Baustoff-Buch <span class="klein">${kenn.filter(t => ORTE[t]).length} von ${B.length}</span></h2>
      <p class="klein">Jeder Ort, den du besuchst, wird hier eingetragen.</p>
      <div class="buch">${B.map(t => kenn.includes(t) ? `<div class="be"><span>${ortBild(t, 52)}</span><span><b>${ORTE[t].n}</b><br>${ORTE[t].info}</span></div>` : `<div class="be zu"><span>❓</span><span>Noch nicht entdeckt</span></div>`).join("")}</div>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>„Nestwerk“ ist ein Bonus-Spiel zum Vogelpass (Teil 2: Ei, Nest und Brutpflege). Die Kinder erleben, wie unterschiedlich Vögel bauen und wie viel Arbeit in einem Nest steckt.</p>
        <ul class="clean">
          <li><b>Amsel (März):</b> Napfnest in der Hecke – Zweige, Halme, Lehm-Mulde, Polster. Pfützen trocknen, Regen füllt sie wieder; eine Katze lauert am Boden.</li>
          <li><b>Rauchschwalbe (Mai):</b> Lehmnest im Stall – Lehm klümpchenweise, mit Halmen verstärkt, mit Federn gepolstert. Die Sonne trocknet die Pfützen schnell.</li>
          <li><b>Buchfink (April):</b> getarntes Napfnest aus Moos, Spinnweben, Flechten und Federn. Eine Elster beobachtet den Nestplatz.</li>
          <li><b>Regeln:</b> Ein Flug kostet je Feld eine Kraft. Material wird nur in der Reihenfolge des Bauplans verbaut. Gewertet werden die verbauten Stücke; ein fertiges Nest bringt drei Sterne.</li>
          <li><b>Vereinfachung:</b> In Wirklichkeit fliegt ein Vogel für ein Nest hunderte bis über tausend Male.</li>
          <li><b>Gesprächsanlässe:</b> Warum finden Schwalben heute oft keinen Lehm? Wie kann man Nestbauern im Garten helfen? Warum ist Tarnung so wichtig?</li>
        </ul>
        <div class="knopfreihe">${alle ? "" : `<button type="button" class="knopf" id="frei">🔓 Alle Vögel sofort öffnen</button>`}<button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $$(".lv", app).forEach(b => b.onclick = () => { location.hash = LEVEL[+b.dataset.i].id; });
  const f = $("#frei"); if (f) f.onclick = () => { S.frei = true; speichern(); seiteStart(); };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Ein Bautag ============ */
let timer = [];
const spaeter = (f, ms) => { timer.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); };
function seiteSpiel(id) {
  const nr = LEVEL.findIndex(L => L.id === id), L = LEVEL[nr];
  const st = neuesSpiel(L, Math.random);
  let sperre = false, meld = [{ art: "info", t: L.kurz + " · " + L.nestN, k: L.intro }];
  const X = i => spalte(i) * 100, Y = i => 70 + zeile(i) * 100;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span><b>${L.titel}</b> · ${L.zeit}</span><span id="rest"></span></div></div></div>
    <div class="spiel"><div class="planrahmen" id="rahmen">
      <svg id="plan" viewBox="0 0 700 570" role="group" aria-label="Plan mit ${BREIT * HOCH} Feldern">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0f2"/><stop offset="1" stop-color="#dff0fb"/></linearGradient></defs>
        <g id="himmel"></g><g id="felder"></g><g id="biene" class="biene">${vogelSVG(L.id)}</g><g id="fx"></g><g id="wetter"></g>
      </svg></div>
      <aside class="pult">
        <div class="anz"><span class="lab">💪 Kraft</span><div class="pips kraft" id="pE"></div></div>
        <div class="anz"><span class="lab">🐦 Im Schnabel</span><div class="pips sack" id="pL"></div></div>
        <div class="anz nestanz"><span class="lab">🪺 Verbaut: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div>
          <ol class="bauplan" id="plan2"></ol></div>
        <div id="meld" role="status" aria-live="polite"></div>
      </aside></div>`;
  const vogel = $("#biene"), fx = $("#fx");
  function himmel() {
    const p = Math.min(1, st.zug / L.zuege), sx = 40 + 620 * p, sy = 56 - 36 * Math.sin(Math.PI * p), abend = Math.max(0, (p - .75) * 4);
    const regenNah = st.regenAb > 0 && st.zug >= st.regenAb - 2 && st.zug < st.regenAb;
    $("#himmel").innerHTML = `<rect width="700" height="70" fill="url(#hg)"/><rect width="700" height="70" fill="#f08a3c" opacity="${(abend * .55).toFixed(2)}"/>${regenNah ? `<rect width="700" height="70" fill="#56657a" opacity=".4"/>` : ""}
      <circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="15" fill="#ffd23f" stroke="#f4a800" stroke-width="2.5"/>
      <text x="690" y="58" text-anchor="end" class="plantext">${L.ort}</text>`;
  }
  function felder() {
    const anteil = st.punkte / summe(L);
    $("#felder").innerHTML = st.feld.map((f, i) => { const o = ORTE[f.t], d = weite(st.pos, i), fern = d > st.energie;
      const leer = (o.stoff || o.futter) && (f.leer || (o.nass && f.wasser <= 0)), kn = o.boden && katzeNah(st, i);
      const name = (f.t === "nest" ? "Dein Nest" : o.n) + (o.nass ? (f.wasser > 0 ? ", Lehm da" : ", ausgetrocknet") : leer ? ", gerade leer" : "") + (kn ? ", die Katze lauert" : "");
      const grund = f.t === "nest" ? "#7da04e" : (spalte(i) + zeile(i)) % 2 ? "#b4c98a" : "#adc382";
      return `<g class="feld${fern ? " fern" : ""}${i === st.pos ? " hier" : ""}" data-i="${i}" transform="translate(${X(i)} ${Y(i)})" tabindex="0" role="button" aria-label="${name}, ${d} Felder entfernt${fern ? ", zu weit" : ""}">
        <rect width="100" height="100" fill="${grund}"/>
        ${f.t === "nest" ? nestBild(L, anteil) : `<g class="${leer && !o.nass ? "leer" : ""}">${f.t === "pfuetze" ? BILD.pfuetze(f) : BILD[f.t](i)}</g>`}
        ${fern ? `<rect width="100" height="100" fill="#22301c" opacity=".42"/>` : ""}<rect class="treffer" width="100" height="100" fill="transparent"/></g>`; }).join("")
      + (st.katze >= 0 ? rahmen(X, Y, st.katze, "#e08a1e") + markeSVG(X(st.katze) + 50, Y(st.katze) + 46, "🐈") : "")
      + (st.elster >= 0 ? `<rect x="${X(st.elster) + 3}" y="${Y(st.elster) + 3}" width="94" height="94" rx="10" fill="none" stroke="#B23B2E" stroke-width="3.5" stroke-dasharray="8 6" pointer-events="none"/>` + markeSVG(X(st.elster) + 50, Y(st.elster) + 46, "👀")
        + (elsterSieht(st) ? `<rect x="${X(NEST) + 3}" y="${Y(NEST) + 3}" width="94" height="94" rx="10" fill="rgba(178,59,46,.18)" stroke="#B23B2E" stroke-width="4" pointer-events="none"/><text x="${X(NEST) + 50}" y="${Y(NEST) + 20}" text-anchor="middle" class="plantext rot">beobachtet!</text>` : "") : "");
  }
  function pult() {
    $("#rest").textContent = vorbei(st) ? (fertig(st) ? "Fertig!" : "Abend") : "noch " + (L.zuege - st.zug) + (L.zuege - st.zug === 1 ? " Zug" : " Züge");
    $("#pE").innerHTML = Array.from({ length: L.emax }, (x, k) => `<i class="${k < st.energie ? "an" : ""}"></i>`).join(""); $("#pE").classList.toggle("knapp", st.energie <= 2);
    $("#pL").innerHTML = Array.from({ length: L.kap }, (x, k) => st.last[k] ? matBild(st.last[k], 24) : `<i class="pol"></i>`).join("");
    $("#nZahl").textContent = st.punkte + " von " + summe(L) + (sterneFuer(L, st.punkte) ? " · " + "⭐".repeat(sterneFuer(L, st.punkte)) : ""); $("#nBalk").style.width = Math.min(100, st.punkte / L.ziel[2] * 100) + "%";
    $("#plan2").innerHTML = L.rezept.map(([s, n], k) => { const fertigN = k < st.stufe ? n : k === st.stufe ? st.inStufe : 0;
      return `<li class="${k < st.stufe ? "ok" : k === st.stufe ? "jetzt" : ""}">${matBild(s, 18)}<span>${STOFF[s].mehr}</span><b>${fertigN}/${n}</b></li>`; }).join("");
    const rang = { pech: 0, regen: 1, buch: 3, gut: 2, mies: 2, info: 4 };
    $("#meld").innerHTML = meld.slice().sort((a, b) => rang[a.art] - rang[b.art]).slice(0, 3).map(m => `<div class="folge m-${m.art}"><span class="urteil">${m.t}</span><span>${m.k}</span></div>`).join("");
    vogel.classList.toggle("beladen", st.last.length > 0);
  }
  const setzeVogel = () => vogel.setAttribute("style", `transform:translate(${X(st.pos) + 66}px,${Y(st.pos) + 64}px)`);
  function zeichne() { himmel(); felder(); pult(); setzeVogel(); }
  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 30); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }
  function regenBild() { $("#wetter").innerHTML = Array.from({ length: 46 }, (x, k) => `<path class="tropfen" style="animation-delay:${(k % 9) * .08}s" d="M${(k * 97) % 700} ${70 + (k * 53) % 480} l-8 26" stroke="#3f6ea8" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>`).join("") + `<rect y="70" width="700" height="500" fill="#3c5878" opacity=".2"/>`; }
  function flug(i) {
    if (sperre || vorbei(st)) return;
    if (weite(st.pos, i) > st.energie) { meld = [{ art: "mies", t: "Zu weit!", k: "Dafür reicht deine Kraft nicht. Friss etwas oder tippe auf dein eigenes Feld, um kurz zu verschnaufen." }]; pult(); return; }
    const vor = { e: Math.max(0, st.energie - weite(st.pos, i)), p: st.punkte }, alt = buch().slice();
    const M = schritt(st, i); if (!M) return;
    sperre = true; setzeVogel();
    st.neu.forEach(t => { if (!alt.includes(t)) { buch().push(t); if (ORTE[t] && t !== "leer" && t !== "nest") M.push({ art: "buch", t: "📖 Neu im Baustoff-Buch: " + ORTE[t].n, k: ORTE[t].info }); } }); speichern();
    const pech = M.some(m => m.art === "pech"), nass = M.some(m => m.t === "Ein Regenschauer!");
    spaeter(() => {
      meld = M; zeichne();
      if (st.energie > vor.e && !pech) schwebe(i, "+" + (st.energie - vor.e) + " 💪", "blau");
      if (st.punkte > vor.p) schwebe(i, "+" + (st.punkte - vor.p) + " verbaut", "gruen");
      if (nass) { regenBild(); spaeter(() => { $("#wetter") && ($("#wetter").innerHTML = ""); }, 1700); }
      if (pech) { const r = $("#rahmen"); r.classList.remove("ruck"); void r.offsetWidth; r.classList.add("ruck"); }
      spaeter(() => { sperre = false; if (vorbei(st)) ende(); }, vorbei(st) ? 1900 : pech || nass ? 1100 : 120);
    }, 430);
  }
  $("#plan").addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) flug(+g.dataset.i); });
  $("#plan").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-i]"); if (g) { e.preventDefault(); flug(+g.dataset.i); } } });
  zeichne();

  function ende() {
    const pkt = st.punkte, n = sterneFuer(L, pkt), alt = S[L.id] || {}, rekord = pkt > (alt.best || 0) && alt.n, ganz = fertig(st);
    S[L.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.max(alt.best || 0, pkt), fertig: alt.fertig || ganz }; speichern();
    const next = LEVEL[nr + 1], neuOffen = n > 0 && next && !alt.sterne && !S.frei, s = st.stat;
    const pannen = [s.katze && "vor der Katze geflüchtet", s.elster && "von der Elster beobachtet worden", s.platt && "vor Erschöpfung liegen geblieben"].filter(Boolean);
    const titel = ganz ? "Das Nest ist fertig!" : n === 2 ? "Fast geschafft" : n === 1 ? "Ein guter Anfang" : "Da fehlt noch viel";
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Übersicht</a><span><b>${L.titel}</b> · ${L.zeit}</span><span>${ganz ? "Fertig!" : "Abend"}</span></div></div></div>
      <div class="huelle"><section><div class="ende">
        <div class="held"><svg viewBox="0 0 100 100" width="130" height="130" aria-hidden="true">${nestBild(L, pkt / summe(L))}</svg></div>
        <span class="eyebrow">${L.nestN}</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p><b>${pkt} von ${summe(L)} Stücken</b> sind verbaut${ganz ? " – noch " + (L.zuege - st.zug) + " Züge vor Sonnenuntergang. Jetzt können die Eier kommen!" : "."}${rekord ? " Das ist dein neuer Rekord!" : ""}</p>
        <p class="klein">${n < 3 ? "Für " + (n + 1) + (n ? " Sterne" : " Stern") + " brauchst du " + L.ziel[n] + " verbaute Stücke. " : ""}${s.falsch ? (s.falsch === 1 ? "Einmal" : s.falsch + "-mal") + " hattest du Material dabei, das noch nicht dran war. " : ""}${pannen.length ? "Heute bist du " + pannen.join(", ").replace(/, ([^,]*)$/, " und $1") + "." : ""}</p>
        ${neuOffen ? `<p><b>🔓 Freigeschaltet:</b> ${next.titel} wartet auf dich.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf${n ? "" : " prim"}" id="noch">🔁 Noch einmal</button>${n && next ? `<a class="knopf honig" href="#${next.id}">${next.titel} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="vogelpass.html">Zum Vogelpass</a></div>
      </div></section>
      <section><h3 class="h-honig">Was du beim Bauen gelernt hast</h3><div class="merk">${MERK[L.id].map(k => `<div>${k}</div>`).join("")}</div></section>${fuss()}</div>`;
    $("#noch").onclick = () => seiteSpiel(id);
    if (n === 3) konfetti(["🪺", "⭐", "🐦", "✨", "🥚"]);
  }
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
