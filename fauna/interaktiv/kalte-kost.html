/* Kalte Kost – Farben und Schrift wie die Forscherpässe von Fauna Mibaso */
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--blau-tief);-webkit-text-size-adjust:100%}

.huelle{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}

.weiter{display:flex;justify-content:center;padding:0 16px 18px}
.ende{background:var(--tile);border:1px solid var(--linie);border-radius:18px;overflow:hidden;text-align:center;display:grid;gap:10px;padding-bottom:20px}
.ende > *{margin-left:16px;margin-right:16px}

.fundbild,.titelbild{display:block;width:100%;height:auto;aspect-ratio:2/1;object-fit:cover}

.lv .em svg{display:block;margin:0 auto}
.buch{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.be{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:12px;padding:6px 10px;font-family:var(--sans);font-size:13.5px;line-height:1.35}

.be.zu{color:var(--ink-soft);border-style:dashed;background:transparent}

.spielkopf .innen{max-width:1010px}
.spiel{max-width:1010px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right,0px)) 30px max(10px,env(safe-area-inset-left,0px));display:grid;gap:10px}
.planrahmen{border-radius:16px;overflow:hidden;border:2px solid var(--blau);background:#9bc66b;line-height:0;box-shadow:0 4px 14px rgba(35,61,92,.16)}

"use strict";
/* ============ Spielregeln (ohne Anzeige) ============
   Garten- bzw. Waldplan mit 7 × 5 Feldern. Ein Flug kostet so viel Kraft, wie er Felder weit ist.
   Futter füllt zuerst die Kraft auf; was darüber hinausgeht, wird zu Fett. Die Kälte zehrt an der Kraft.
   Bei Sonnenuntergang muss die Meise in ihrer Schlafhöhle sein – die Nacht kostet Fett. Gewertet wird das Fett am Morgen. */

  hecke:    { n: "Hecke",                 deckung: true, info: "Dichte Zweige schützen vor dem Sperber. Hier sitzen Meisen gern zwischen zwei Futterflügen." },
  fichte:   { n: "Fichte",                deckung: true, info: "Im dichten Nadelkleid ist es windstill und etwas wärmer. Hier ist man vor dem Sperber sicher." },

const LEVEL = [
  { id: "dezember", em: "🏡", titel: "Im Garten", kurz: "Kohlmeise", zeit: "Ein Dezembertag", was: "kurzer Tag, Schneefall",

const rahmen = (X, Y, i, farbe) => { const x1 = Math.max(0, X(i) - 100) + 3, y1 = Math.max(70, Y(i) - 100) + 3, x2 = Math.min(700, X(i) + 200) - 3, y2 = Math.min(570, Y(i) + 200) - 3;
  return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" rx="12" fill="none" stroke="${farbe}" stroke-width="3.5" stroke-dasharray="8 6" pointer-events="none"/>`; };

/* ============ Übersicht ============ */
function seiteStart() {
  const alle = LEVEL.every((L, i) => offen(i)), B = Object.keys(ORTE), kenn = buch();
  app.innerHTML = `<header class="app-head">
    <a class="zurueck-kopf" href="winterpass.html">‹ Winterpass</a>
    <div class="logo">❄️🐦🌻</div><h1>Kalte Kost</h1><div class="untertitel">Ein Wintertag als Kohlmeise</div></header>
  <div class="huelle">
    <section>
      <p class="lead">Draußen friert es, und der Tag ist kurz. Als Kohlmeise musst du genug fressen, um die lange, kalte Nacht zu überstehen. Sammle Fett – und sei bei Sonnenuntergang in deinem Nistkasten!</p>
      <div class="regeln">
        <div class="regel"><span class="e">💪</span><span><b>Futter gibt Kraft:</b> Jedes Feld, das du fliegst, kostet Kraft. Und die Kälte zehrt dauernd daran.</span></div>
        <div class="regel"><span class="e">🟡</span><span><b>Was übrig ist, wird Fett:</b> Bist du satt, legt dein Körper Fett an. Es ist deine Heizung für die Nacht – und Reserve, wenn die Kraft ausgeht.</span></div>
        <div class="regel"><span class="e">🏠</span><span><b>Ab in den Nistkasten:</b> Bei Sonnenuntergang zählt, wie viel Fett du in die Nacht mitbringst.</span></div>
      </div>
    </section>
    <section>
      <h2 class="h-blau">Drei Wintertage</h2>
      <div class="level">${LEVEL.map((L, i) => { const d = S[L.id], zu = !offen(i);
        return `<button type="button" class="lv" data-i="${i}" ${zu ? "disabled" : ""}><span class="em">${zu ? "🔒" : `<span style="font-size:42px">${L.em}</span>`}</span>
          <span><span class="nr">${L.zeit}</span><span class="nm">${L.titel}</span><span class="mo">${zu ? "Öffnet sich, wenn du am Tag davor einen Stern geholt hast." : L.motto}</span>
          ${d && d.n ? `<span class="st">${sterneHTML(d.sterne || 0)} · Rekord: ${d.best || 0} Fett · ${d.n}× geflogen</span>` : zu ? "" : `<span class="st">▶ Losfliegen</span>`}</span></button>`; }).join("")}</div>
      <p class="klein">Ein Wintertag dauert etwa drei Minuten.</p>
    </section>
    <section>
      <h2 class="h-blau">📖 Dein Winterbuch <span class="klein">${kenn.length} von ${B.length}</span></h2>
      <p class="klein">Jeder Ort, den du besuchst, wird hier eingetragen.</p>
      <div class="buch">${B.map(t => kenn.includes(t) ? `<div class="be"><span>${ortBild(t, 52)}</span><span><b>${ORTE[t].n}</b><br>${ORTE[t].info}</span></div>` : `<div class="be zu"><span>❓</span><span>Noch nicht entdeckt</span></div>`).join("")}</div>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>„Kalte Kost“ ist ein Bonus-Spiel zur Expedition Winter. Die Kinder erleben die Energiebilanz eines gleichwarmen Tieres im Winter: Futter, Kälte, Fettreserve und die lange Nacht.</p>
        <ul class="clean">
          <li><b>Im Garten (Dezember):</b> kurzer Tag; Schneefall deckt Bodenfutter zu; Brot ist schlechtes Futter; eine Katze lauert am Boden.</li>
          <li><b>Eisiger Januar:</b> strenger Frost zehrt schneller; Knödel im Netz als Falle; der Sperber jagt am Futterhaus – Hecken geben Deckung.</li>
          <li><b>Im Winterwald (Februar):</b> kein Futterhaus; Rinde und Bucheckern; der Meisentrupp findet mehr Futter und warnt vor dem Sperber.</li>
          <li><b>Regeln:</b> Ein Flug kostet je Feld eine Kraft; reicht die Kraft nicht, wird Fett verbrannt. Futter füllt zuerst die Kraft, der Rest wird Fett. Alle paar Züge kostet die Kälte eine Kraft (im Nistkasten nicht). Die Nacht kostet Fett, draußen doppelt so viel.</li>
          <li><b>Bezug zum Winterpass:</b> gleichwarm (Station „Gleichwarm oder wechselwarm?“), Fett als Wärmespeicher („Fell, Federn, Fett“), richtig helfen („Helfen – aber richtig“).</li>
          <li><b>Gesprächsanlässe:</b> Warum frieren Meisen bei Frost nicht fest, Frösche aber erstarren? Was gehört ins Futterhaus, was nicht? Warum lohnt es sich, im Herbst Samenstände stehen zu lassen?</li>
        </ul>
        <div class="knopfreihe">${alle ? "" : `<button type="button" class="knopf" id="frei">🔓 Alle Tage sofort öffnen</button>`}<button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $$(".lv", app).forEach(b => b.onclick = () => { location.hash = LEVEL[+b.dataset.i].id; });
  const f = $("#frei"); if (f) f.onclick = () => { S.frei = true; speichern(); seiteStart(); };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Ein Wintertag ============ */
let timer = [];
const spaeter = (f, ms) => { timer.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); };
function seiteSpiel(id) {
  const nr = LEVEL.findIndex(L => L.id === id), L = LEVEL[nr];
  const st = neuesSpiel(L, Math.random);
  let sperre = false, meld = [{ art: "info", t: L.kurz + " · " + L.was, k: L.intro }], schneeZeigen = false;
  const X = i => spalte(i) * 100, Y = i => 70 + zeile(i) * 100;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span><b>${L.titel}</b> · ${L.zeit}</span><span id="rest"></span></div></div></div>
    <div class="spiel"><div class="planrahmen" id="rahmen">
      <svg id="plan" viewBox="0 0 700 570" role="group" aria-label="Winterplan mit ${BREIT * HOCH} Feldern">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9cfe0"/><stop offset="1" stop-color="#e8eef3"/></linearGradient>
          <pattern id="gefahr" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="rgba(178,59,46,.30)"/></pattern></defs>
        <g id="himmel"></g><g id="felder"></g><g id="biene" class="biene">${meiseSVG()}</g><g id="fx"></g><g id="wetter"></g>
      </svg></div>
      <aside class="pult">
        <div class="anz"><span class="lab">💪 Kraft</span><div class="pips kraft" id="pE"></div></div>
        <div class="anz nestanz"><span class="lab">🟡 Fettvorrat: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div></div>
        <div id="meld" role="status" aria-live="polite"></div>
        <details class="kunde"><summary>📖 Was gibt es hier?</summary><div id="kunde"></div></details>
      </aside></div>`;
  const vogel = $("#biene"), fx = $("#fx");
  function himmel() {
    const p = Math.min(1, st.zug / L.zuege), sx = 40 + 620 * p, sy = 60 - 30 * Math.sin(Math.PI * p), abend = Math.max(0, (p - .7) * 3.3);
    const sn = st.sperber.find(z => z > st.zug), hn = sn && sn - st.zug <= 3 ? sn - st.zug : 0;
    $("#himmel").innerHTML = `<rect width="700" height="70" fill="url(#hg)"/><rect width="700" height="70" fill="#e0703c" opacity="${(abend * .6).toFixed(2)}"/>${abend > .6 ? `<rect width="700" height="70" fill="#1d2a4a" opacity="${((abend - .6) * 1.4).toFixed(2)}"/>` : ""}
      ${st.schneeAb > 0 && st.zug >= st.schneeAb - 2 && st.zug < st.schneeAb ? `<rect width="700" height="70" fill="#8a96a6" opacity=".45"/>` : ""}
      <circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="14" fill="#ffd979" stroke="#f0b440" stroke-width="2.5"/>
      ${hn ? `<g transform="translate(${(700 - hn * 150).toFixed(0)} 34)"><path d="M-26 0 Q-12 -10 0 -2 Q12 -10 26 0 Q12 -3 0 4 Q-12 -3 -26 0 Z" fill="#4a4036"/><path d="M-2 3 L0 14 L2 3 Z" fill="#4a4036"/></g><text x="${(700 - hn * 150 + 36).toFixed(0)}" y="40" class="plantext rot">Sperber!</text>` : ""}`;
  }
  function felder() {
    const rw = reichweite(st);
    $("#felder").innerHTML = st.feld.map((f, i) => { const o = ORTE[f.t], d = weite(st.pos, i), fern = d > rw, reserve = !fern && d > st.energie && d <= st.energie + st.fett;
      const zu = o.wert && unterSchnee(st, f), leer = o.wert && f.leer, kn = o.boden && o.wert && !zu && katzeNah(st, i);
      const name = o.n + (zu ? ", unter Schnee" : leer ? ", leer" : "") + (kn ? ", die Katze lauert" : "");
      return `<g class="feld${fern ? " fern" : ""}${i === st.pos ? " hier" : ""}" data-i="${i}" transform="translate(${X(i)} ${Y(i)})" tabindex="0" role="button" aria-label="${name}, ${d} Felder entfernt${fern ? ", zu weit" : reserve ? ", kostet Fett" : ""}">
        <rect width="100" height="100" fill="${BODEN(st, f, i)}"/>
        ${zu ? `<path d="M10 70 Q30 50 50 62 Q70 48 90 68 L90 100 L10 100 Z" fill="#fff" stroke="#d6e2ee"/>` : `<g class="${leer ? "leer" : ""}">${BILD[f.t](i)}</g>`}
        ${reserve ? `<rect width="100" height="100" fill="#f6c94a" opacity=".16"/><text x="94" y="96" text-anchor="end" font-size="14">🟡</text>` : ""}
        ${fern ? `<rect width="100" height="100" fill="#22301c" opacity=".42"/>` : ""}<rect class="treffer" width="100" height="100" fill="transparent"/></g>`; }).join("")
      + (st.katze >= 0 ? rahmen(X, Y, st.katze, "#e08a1e") + markeSVG(X(st.katze) + 50, Y(st.katze) + 46, "🐈") : "")
      + (st.trupp >= 0 ? rahmen(X, Y, st.trupp, "#3f86d6") + markeSVG(X(st.trupp) + 50, Y(st.trupp) + 46, "🐦") : "")
      + (L.zuege - st.zug <= 4 && st.pos !== HOEHLE ? `<rect x="${X(HOEHLE) + 3}" y="${Y(HOEHLE) + 3}" width="94" height="94" rx="8" fill="none" stroke="#f0b440" stroke-width="5" class="puls" pointer-events="none"/>` : "");
  }
  function pult() {
    $("#rest").textContent = vorbei(st) ? "Nacht" : "noch " + (L.zuege - st.zug) + (L.zuege - st.zug === 1 ? " Zug" : " Züge");
    $("#pE").innerHTML = Array.from({ length: L.emax }, (x, k) => `<i class="${k < st.energie ? "an" : ""}"></i>`).join(""); $("#pE").classList.toggle("knapp", st.energie <= 1);
    $("#nZahl").textContent = st.fett + (sterneFuer(L, st.fett) ? " · " + "⭐".repeat(sterneFuer(L, st.fett)) : ""); $("#nBalk").style.width = Math.min(100, st.fett / L.ziel[2] * 100) + "%";
    const rang = { pech: 0, regen: 1, mahd: 1, buch: 3, gut: 2, mies: 2, info: 4 };
    $("#meld").innerHTML = meld.slice().sort((a, b) => rang[a.art] - rang[b.art]).slice(0, 3).map(m => `<div class="folge m-${m.art}"><span class="urteil">${m.t}</span><span>${m.k}</span></div>`).join("");
    const kenn = buch();
    $("#kunde").innerHTML = Object.keys(L.feld).filter(t => t !== "wiese").map(t => { const o = ORTE[t];
      return `<div class="be"><span>${ortBild(t, 40)}</span><span>${kenn.includes(t) ? `<b>${o.n}</b><br>${o.falle ? "Vorsicht, Falle!" : o.wert ? "+" + o.wert + (o.boden ? ", am Boden" : "") : "Deckung"}` : "<b>?</b><br>noch nicht besucht"}</span></div>`; }).join("");
    vogel.classList.toggle("beladen", st.fett > 0);
  }
  const setzeVogel = () => vogel.setAttribute("style", `transform:translate(${X(st.pos) + 66}px,${Y(st.pos) + 64}px)`);
  function zeichne() { himmel(); felder(); pult(); setzeVogel(); }
  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 30); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }
  function schneeBild() { $("#wetter").innerHTML = Array.from({ length: 50 }, (x, k) => `<circle class="flocke-svg" style="animation-delay:${(k % 10) * .12}s" cx="${(k * 97) % 700}" cy="${70 + (k * 53) % 480}" r="${2 + k % 3}" fill="#fff" opacity=".9"/>`).join(""); }
  function flug(i) {
    if (sperre || vorbei(st)) return;
    if (weite(st.pos, i) > reichweite(st)) { meld = [{ art: "mies", t: "Zu weit!", k: "Dafür reichen weder deine Kraft noch dein Fett. Die dunklen Felder erreichst du gerade nicht." }]; pult(); return; }
    const vor = { e: Math.max(0, st.energie - weite(st.pos, i)), f: st.fett }, alt = buch().slice();
    const M = schritt(st, i); if (!M) return;
    sperre = true; setzeVogel();
    st.neu.forEach(t => { if (!alt.includes(t)) { buch().push(t); M.push({ art: "buch", t: "📖 Neu im Winterbuch: " + ORTE[t].n, k: ORTE[t].info }); } }); speichern();
    const pech = M.some(m => m.art === "pech"), schnee = M.some(m => m.t === "Es schneit!");
    spaeter(() => {
      meld = M; zeichne();
      if (st.energie > vor.e && !pech) schwebe(i, "+" + (st.energie - vor.e) + " 💪", "blau");
      if (st.fett > vor.f && !vorbei(st)) spaeter(() => schwebe(i, "+" + (st.fett - vor.f) + " 🟡", "gelb"), 250);
      if (schnee) { schneeBild(); spaeter(() => { $("#wetter") && ($("#wetter").innerHTML = ""); }, 2200); }
      if (pech) { const r = $("#rahmen"); r.classList.remove("ruck"); void r.offsetWidth; r.classList.add("ruck"); }
      spaeter(() => { sperre = false; if (vorbei(st)) ende(); }, vorbei(st) ? 2200 : pech || schnee ? 1100 : 120);
    }, 430);
  }
  $("#plan").addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) flug(+g.dataset.i); });
  $("#plan").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-i]"); if (g) { e.preventDefault(); flug(+g.dataset.i); } } });
  zeichne();

  function ende() {
    const pkt = st.fett, n = sterneFuer(L, pkt), alt = S[L.id] || {}, rekord = pkt > (alt.best || 0) && alt.n;
    S[L.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.max(alt.best || 0, pkt) }; speichern();
    const next = LEVEL[nr + 1], neuOffen = n > 0 && next && !alt.sterne && !S.frei, s = st.stat;
    const pannen = [s.sperber && "dem Sperber knapp entkommen", s.katze && "vor der Katze geflüchtet", s.netz && "im Knödelnetz hängen geblieben", s.platt && "vor Erschöpfung liegen geblieben"].filter(Boolean);
    const titel = !st.daheim ? "Eine lange, kalte Nacht" : n === 3 ? "Gut gerüstet für die Nacht!" : n === 2 ? "Warm durch die Nacht" : n === 1 ? "Knapp, aber geschafft" : "Ein hungriger Morgen";
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Übersicht</a><span><b>${L.titel}</b> · ${L.zeit}</span><span>Morgen</span></div></div></div>
      <div class="huelle"><section><div class="ende">
        <div class="held"><svg viewBox="-40 -40 80 80" width="110" height="110" aria-hidden="true">${meiseSVG()}</svg></div>
        <span class="eyebrow">Der nächste Morgen</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p>${st.daheim ? "Die Nacht im Nistkasten" : "Die Nacht draußen im Wind"} hat dich <b>${st.nachtFett} Fett</b> gekostet. Am Morgen hast du noch <b>${pkt} Fett</b> übrig.${rekord ? " Das ist dein neuer Rekord!" : ""}</p>
        <p class="klein">${n < 3 ? "Für " + (n + 1) + (n ? " Sterne" : " Stern") + " brauchst du am Morgen " + L.ziel[n] + " Fett. " : ""}${s.brot ? "Brot hat dich kaum satt gemacht. " : ""}${pannen.length ? "Gestern bist du " + pannen.join(", ").replace(/, ([^,]*)$/, " und $1") + "." : "Keine Katze, kein Sperber hat dich erwischt – stark!"}</p>
        ${neuOffen ? `<p><b>🔓 Freigeschaltet:</b> ${next.titel} wartet auf dich.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf${n ? "" : " prim"}" id="noch">🔁 Noch einmal</button>${n && next ? `<a class="knopf honig" href="#${next.id}">${next.titel} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="winterpass.html">Zum Winterpass</a></div>
      </div></section>
      <section><h3 class="h-honig">Was dir der Winter heute gezeigt hat</h3><div class="merk">${MERK[L.id].map(k => `<div>${k}</div>`).join("")}</div></section>${fuss()}</div>`;
    $("#noch").onclick = () => seiteSpiel(id);
    if (n === 3) konfetti(["❄️", "⭐", "🐦", "✨", "🌻"]);
  }
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
