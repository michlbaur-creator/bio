<script>
"use strict";
/* ============ Spielregeln (ohne Anzeige) ============
   Wiesenplan mit 7 × 5 Feldern. Ein Flug kostet so viel Nektar, wie er Felder weit ist. Jede Blüte hat eine Tiefe (1 offen, 2 Glocke, 3 lange Röhre):
   Die Biene erreicht nur Nektar, der nicht tiefer liegt, als ihr Rüssel lang ist. Pollen wird im Nest abgeliefert – nur das zählt. */
const BREIT = 7, HOCH = 5, NACHWUCHS = 8, STREIFEN = 5;   // Spalten 5 und 6 sind der Wegrand: Dort wird nicht gemäht
const BLUETEN = {
  loewe:      { n: "Löwenzahn",        tiefe: 1, nektar: 3, pollen: 2, wo: "liegt offen zwischen den vielen kleinen Einzelblüten" },
  gaense:     { n: "Gänseblümchen",    tiefe: 1, nektar: 1, pollen: 1, wo: "liegt offen – aber es ist nur ein winziger Tropfen" },

  taub:       { n: "Taubnessel",       tiefe: 3, nektar: 3, pollen: 1, wo: "sitzt tief unten in der langen Blütenröhre" },

  glocke:     { n: "Glockenblume",     tiefe: 2, nektar: 2, pollen: 1, wo: "sitzt am Grund der Glocke – und die Glocke ist ein Regendach" },
  marg:       { n: "Margerite",        tiefe: 1, nektar: 2, pollen: 1, wo: "liegt offen im gelben Körbchen" },
  storch:     { n: "Storchschnabel",   tiefe: 1, nektar: 2, pollen: 1, wo: "liegt offen in der flachen Schale" },
  rotklee:    { n: "Rotklee",          tiefe: 3, nektar: 4, pollen: 1, wo: "sitzt tief in den langen, engen Röhren" },
  salbei:     { n: "Wiesensalbei",     tiefe: 3, nektar: 3, pollen: 1, wo: "sitzt tief in der Lippenblüte, hinter einer Schranke" },
  flocke:     { n: "Flockenblume",     tiefe: 2, nektar: 3, pollen: 1, wo: "sitzt in mittellangen Röhren" },

  mohn:       { n: "Klatschmohn",      tiefe: 1, nektar: 0, pollen: 3, wo: "fehlt hier ganz! Der Mohn bietet nur Pollen" }
};
const LEVEL = [
  { id: "sand", em: "🐝", titel: "Die Sandbiene", kurz: "Sandbiene", zeit: "Ein Apriltag", was: "kurzer Rüssel",

    feld: { loewe: 5, gaense: 6, hahn: 5, taub: 4, schluessel: 4 } },
  { id: "schere", em: "🔔", titel: "Die Scherenbiene", kurz: "Glockenblumen-Scherenbiene", zeit: "Ein Junitag", was: "mittellanger Rüssel · Pollen nur von Glockenblumen",
    motto: "Eine Spezialistin: Ihre Brut frisst nur Pollen von Glockenblumen. Und heute wird gemäht …",

    feld: { glocke: 7, marg: 5, storch: 4, rotklee: 4, salbei: 4 }, imStreifen: { glocke: 2 } },

function seiteStart() {
  const alle = LEVEL.every((L, i) => offen(i)), B = Object.keys(BLUETEN), kenn = buch();
  app.innerHTML = `<header class="app-head">
    <a class="zurueck-kopf" href="wiesenpass.html">‹ Wiesenpass</a>
    <div class="logo">🌼🐝🌦️</div><h1>Sammelflug</h1><div class="untertitel">Ein Tag als Wildbiene auf der Wiese</div></header>
  <div class="huelle">
    <section>
      <p class="lead">Du bist eine Wildbiene – und deine Brut hat Hunger. Flieg über die Wiese, trink Nektar und trag so viel Pollen ins Nest, wie du schaffst, bevor die Sonne untergeht!</p>
      <div class="regeln">
        <div class="regel"><span class="e">💧</span><span><b>Nektar ist dein Treibstoff:</b> Jedes Feld, das du fliegst, kostet einen Tropfen. Nachtanken kannst du nur an Blüten, die zu deinem Rüssel passen.</span></div>
        <div class="regel"><span class="e">🟡</span><span><b>Pollen zählt erst im Nest:</b> Was du unterwegs verlierst, ist weg.</span></div>
        <div class="regel"><span class="e">⛈️</span><span><b>Augen auf:</b> Das Wetter schlägt um, der Traktor kommt – und nicht auf jeder Blüte sitzt du allein.</span></div>
      </div>
    </section>
    <section>
      <h2 class="h-blau">Drei Bienen, drei Tage</h2>
      <div class="level">${LEVEL.map((L, i) => { const d = S[L.id], zu = !offen(i);
        return `<button type="button" class="lv" data-i="${i}" ${zu ? "disabled" : ""}><span class="em">${zu ? "🔒" : `<svg viewBox="-30 -30 60 60" width="60" height="60" aria-hidden="true">${bieneSVG(L.id)}</svg>`}</span>
          <span><span class="nr">${L.zeit}</span><span class="nm">${L.titel}</span><span class="mo">${zu ? "Öffnet sich, wenn du als " + LEVEL[i - 1].kurz + " einen Stern geholt hast." : L.motto}</span>
          ${d && d.n ? `<span class="st">${sterneHTML(d.sterne || 0)} · Rekord: ${d.best || 0} Pollen · ${d.n}× geflogen</span>` : zu ? "" : `<span class="st">▶ Losfliegen</span>`}</span></button>`; }).join("")}</div>
      <p class="klein">Ein Flugtag dauert etwa drei Minuten.</p>
    </section>
    <section>
      <h2 class="h-blau">📖 Dein Blütenbuch <span class="klein">${kenn.length} von ${B.length}</span></h2>
      <p class="klein">Jede Blüte, die du besuchst, wird hier eingetragen – mit dem Geheimnis, wo ihr Nektar steckt.</p>
      <div class="buch">${B.map(t => kenn.includes(t) ? `<div class="be"><span>${bluetenBild(t, 52)}</span><span><b>${BLUETEN[t].n}</b><br>Der Nektar ${BLUETEN[t].wo}.</span></div>` : `<div class="be zu"><span>❓</span><span>Noch nicht besucht</span></div>`).join("")}</div>
    </section>
    <section>
      <details class="lehrer"><summary>Für Lehrkräfte: Einsatz in Klasse 5/6</summary><div class="grid">
        <p>„Sammelflug“ ist ein Bonus-Spiel zum Wiesenpass. Die Kinder erleben aus der Sicht einer Wildbiene, was eine Wiese wert ist: Blüten und Bestäuber passen zusammen (Rüssellänge und Nektartiefe), Sammeln kostet Energie, und Wetter, Mahd und Fressfeinde entscheiden über den Bruterfolg.</p>
        <ul class="clean">
          <li><b>Sandbiene (April):</b> kurzer Rüssel, nur offene Blüten; Regenschauer.</li>
          <li><b>Glockenblumen-Scherenbiene (Juni):</b> Pollenspezialistin; die Wiese wird gemäht, nur der Wegrand bleibt.</li>
          <li><b>Gartenhummel (Juli):</b> langer Rüssel; offene Blüten sind karg, der Mohn hat keinen Nektar; Regen, Mahd und Krabbenspinnen.</li>
          <li><b>Regeln:</b> Ein Flug kostet je Feld einen Tropfen Nektar. Besuchte Blüten sind einige Züge lang leer. Gewertet wird der Pollen im Nest. Im Blütenbuch sammeln sich die Entdeckungen.</li>
          <li><b>Vereinfachung:</b> Wie viele Blüten eine Biene für eine Brutzelle anfliegt (oft mehrere hundert), ist stark verkürzt; die Nektartiefen sind in drei Stufen eingeteilt.</li>
          <li><b>Gesprächsanlässe:</b> Warum hilft ein ungemähter Streifen? Was bedeutet es für eine Spezialistin, wenn ihre Pflanze fehlt? Welche Blüten im Schulgarten passen zu welchen Besuchern?</li>
        </ul>
        <div class="knopfreihe">${alle ? "" : `<button type="button" class="knopf" id="frei">🔓 Alle Bienen sofort öffnen</button>`}<button type="button" class="knopf" id="reset">Spielstand löschen</button></div>
      </div></details>
    </section>
    ${fuss()}
  </div>`;
  $$(".lv", app).forEach(b => b.onclick = () => { location.hash = LEVEL[+b.dataset.i].id; });
  const f = $("#frei"); if (f) f.onclick = () => { S.frei = true; speichern(); seiteStart(); };
  $("#reset").onclick = () => { S = {}; speichern(); seiteStart(); };
}

/* ============ Ein Flugtag ============ */
let timer = [];
const spaeter = (f, ms) => { timer.push(setTimeout(f, reduce ? Math.min(ms, 60) : ms)); };
function seiteSpiel(id) {
  const nr = LEVEL.findIndex(L => L.id === id), L = LEVEL[nr];
  const st = neuesSpiel(L, Math.random);
  let sperre = false, meld = [{ art: "info", t: L.kurz + " · " + L.was, k: L.intro }], regenZeigen = false;
  const X = i => spalte(i) * 100, Y = i => 70 + zeile(i) * 100;
  app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Beenden</a><span><b>${L.kurz}</b> · ${L.zeit}</span><span id="rest"></span></div></div></div>
    <div class="spiel"><div class="planrahmen" id="rahmen">
      <svg id="plan" viewBox="0 0 700 570" role="group" aria-label="Wiesenplan mit ${BREIT * HOCH} Feldern">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0f2"/><stop offset="1" stop-color="#dff0fb"/></linearGradient>
          <pattern id="gefahr" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="rgba(178,59,46,.30)"/></pattern></defs>
        <g id="himmel"></g><g id="felder"></g><g id="biene" class="biene">${bieneSVG(L.id)}</g><g id="fx"></g><g id="wetter"></g>
      </svg></div>
      <aside class="pult">
        <div class="anz"><span class="lab">💧 Nektar</span><div class="pips" id="pE"></div></div>
        <div class="anz"><span class="lab">🟡 Pollen an Bord</span><div class="pips" id="pL"></div></div>
        <div class="anz nestanz"><span class="lab">🏠 Im Nest: <b id="nZahl">0</b></span><div class="nestbalken"><i id="nBalk"></i>${L.ziel.map(z => `<span style="left:${z / L.ziel[2] * 100}%">⭐</span>`).join("")}</div></div>
        <div id="meld" role="status" aria-live="polite"></div>
        <details class="kunde"><summary>📖 Blüten auf dieser Wiese</summary><div id="kunde"></div></details>
      </aside></div>`;
  const biene = $("#biene"), fx = $("#fx");
  function himmel() {
    const p = Math.min(1, st.zug / L.zuege), sx = 40 + 620 * p, sy = 56 - 36 * Math.sin(Math.PI * p), rn = regenNaht(st), abend = Math.max(0, (p - .75) * 4);
    const ms = mahdNaht(st) ? -1 : mahdSpalte(st, st.zug + 1);
    $("#himmel").innerHTML = `<rect width="700" height="70" fill="url(#hg)"/><rect width="700" height="70" fill="#f08a3c" opacity="${(abend * .55).toFixed(2)}"/>${rn || regenZeigen ? `<rect width="700" height="70" fill="#56657a" opacity="${regenZeigen ? .6 : .14 * (4 - rn)}"/>` : ""}
      <circle cx="${sx.toFixed(0)}" cy="${sy.toFixed(0)}" r="15" fill="#ffd23f" stroke="#f4a800" stroke-width="2.5"/>
      ${rn || regenZeigen ? `<g transform="translate(${(sx + (regenZeigen ? 0 : rn * 46)).toFixed(0)} ${(sy + 4).toFixed(0)})"><ellipse cx="0" cy="6" rx="34" ry="13" fill="#5b6675"/><circle cx="-14" cy="-2" r="13" fill="#6a7686"/><circle cx="8" cy="-7" r="16" fill="#5b6675"/><circle cx="24" cy="2" r="10" fill="#6a7686"/></g>` : ""}
      <text x="600" y="64" text-anchor="middle" class="plantext">Wegrand</text>
      ${mahdNaht(st) ? `<text x="8" y="62" font-size="34">🚜</text><text x="56" y="56" class="plantext rot">kommt gleich!</text>` : ms >= 0 ? `<text x="${ms * 100 + 50}" y="62" font-size="36" text-anchor="middle">🚜</text>` : ""}`;
  }
  function felder() {
    const ms = mahdNaht(st) ? -1 : mahdSpalte(st, st.zug + 1);
    $("#felder").innerHTML = st.feld.map((f, i) => { const b = BLUETEN[f.t], d = weite(st.pos, i), fern = d > st.energie, rand = spalte(i) >= STREIFEN;
      const name = f.weg ? "Gemäht" : f.t === "nest" ? "Nest" : b ? b.n + (f.leer ? ", leer" : "") : "Gras";
      return `<g class="feld${fern ? " fern" : ""}${i === st.pos ? " hier" : ""}" data-i="${i}" transform="translate(${X(i)} ${Y(i)})" tabindex="0" role="button" aria-label="${name}, ${d} Felder entfernt${fern ? ", zu weit" : ""}">
        <rect width="100" height="100" fill="${f.weg ? ((spalte(i) + zeile(i)) % 2 ? "#ddd396" : "#d6cb8a") : rand ? ((spalte(i) + zeile(i)) % 2 ? "#86b65c" : "#7fb055") : ((spalte(i) + zeile(i)) % 2 ? "#a3cc73" : "#9bc66b")}"/>
        ${f.weg ? BILD.stoppel(i) : f.t === "nest" ? BILD.nest() : b ? `<g class="${f.leer ? "leer" : ""}">${BILD[f.t](i)}</g>${f.spinne ? BILD.spinne() : ""}` : BILD.gras(i)}
        ${fern ? `<rect width="100" height="100" fill="#22301c" opacity=".42"/>` : ""}<rect class="treffer" width="100" height="100" fill="transparent"/></g>`; }).join("")
      + `<path d="M500 70 V570" stroke="#5b8a3c" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>`
      + (ms >= 0 ? `<rect x="${ms * 100}" y="70" width="100" height="500" fill="url(#gefahr)" stroke="#B23B2E" stroke-width="4" stroke-dasharray="12 8" pointer-events="none"/>` : "");
  }
  function pult() {
    $("#rest").textContent = vorbei(st) ? "Sonnenuntergang" : "noch " + (L.zuege - st.zug) + (L.zuege - st.zug === 1 ? " Zug" : " Züge");
    $("#pE").innerHTML = Array.from({ length: L.emax }, (x, k) => `<i class="${k < st.energie ? "an" : ""}"></i>`).join(""); $("#pE").classList.toggle("knapp", st.energie <= 2);
    $("#pL").innerHTML = Array.from({ length: L.kap }, (x, k) => `<i class="pol ${k < st.last ? "an" : ""}"></i>`).join("");
    $("#nZahl").textContent = st.nest + " Pollen" + (sterneFuer(L, st.nest) ? " · " + "⭐".repeat(sterneFuer(L, st.nest)) : ""); $("#nBalk").style.width = Math.min(100, st.nest / L.ziel[2] * 100) + "%";
    const rang = { pech: 0, regen: 1, mahd: 1, buch: 3, gut: 2, mies: 2, info: 4 };
    $("#meld").innerHTML = meld.slice().sort((a, b) => rang[a.art] - rang[b.art]).slice(0, 3).map(m => `<div class="folge m-${m.art}"><span class="urteil">${m.t}</span><span>${m.k}</span></div>`).join("");
    const kenn = buch();
    $("#kunde").innerHTML = Object.keys(L.feld).map(t => `<div class="be"><span>${bluetenBild(t, 40)}</span><span>${kenn.includes(t) ? `<b>${BLUETEN[t].n}</b><br>${TIEFE[BLUETEN[t].tiefe]}` : "<b>?</b><br>noch nicht besucht"}</span></div>`).join("");
    biene.classList.toggle("beladen", st.last > 0);
  }
  const setzeBiene = () => biene.setAttribute("style", `transform:translate(${X(st.pos) + 68}px,${Y(st.pos) + 66}px)`);
  function zeichne() { himmel(); felder(); pult(); setzeBiene(); }
  function schwebe(i, text, klasse) { const e = document.createElementNS("http://www.w3.org/2000/svg", "text"); e.setAttribute("x", X(i) + 50); e.setAttribute("y", Y(i) + 30); e.setAttribute("class", "schweb " + klasse); e.setAttribute("text-anchor", "middle"); e.textContent = text; fx.appendChild(e); setTimeout(() => e.remove(), 1400); }
  function regenBild() { $("#wetter").innerHTML = Array.from({ length: 46 }, (x, k) => `<path class="tropfen" style="animation-delay:${(k % 9) * .08}s" d="M${(k * 97) % 700} ${70 + (k * 53) % 480} l-8 26" stroke="#3f6ea8" stroke-width="2.6" stroke-linecap="round" opacity=".7"/>`).join("") + `<rect y="70" width="700" height="500" fill="#3c5878" opacity=".22"/>`; }
  function flug(i) {
    if (sperre || vorbei(st)) return;
    if (weite(st.pos, i) > st.energie) { meld = [{ art: "mies", t: "Zu weit!", k: "Für diesen Flug reicht dein Nektar nicht. Die dunklen Felder erreichst du gerade nicht." }]; pult(); return; }
    const vor = { e: st.energie - weite(st.pos, i), l: st.last, n: st.nest, gesehen: st.neu.length }, alt = buch().slice();
    const M = schritt(st, i); if (!M) return;
    sperre = true; setzeBiene();
    st.neu.forEach(t => { if (!alt.includes(t)) { buch().push(t); M.push({ art: "buch", t: "📖 Neu im Blütenbuch: " + BLUETEN[t].n, k: "Der Nektar " + BLUETEN[t].wo + "." }); } }); speichern();
    const pech = M.some(m => m.art === "pech"), nass = M.some(m => m.t === "Es regnet." || m.t === "Vom Regen erwischt!");
    spaeter(() => {
      meld = M; regenZeigen = nass; zeichne();
      if (st.energie > vor.e && !pech) schwebe(i, "+" + (st.energie - vor.e) + " 💧", "blau");
      if (st.last > vor.l) spaeter(() => schwebe(i, "+" + (st.last - vor.l) + " 🟡", "gelb"), 250);
      if (st.nest > vor.n) schwebe(i, "+" + (st.nest - vor.n) + " im Nest!", "gruen");
      if (nass) { regenBild(); spaeter(() => { $("#wetter") && ($("#wetter").innerHTML = ""); regenZeigen = false; himmel(); }, 1700); }
      if (pech) { const r = $("#rahmen"); r.classList.remove("ruck"); void r.offsetWidth; r.classList.add("ruck"); }
      spaeter(() => { sperre = false; if (vorbei(st)) ende(); }, vorbei(st) ? 1900 : pech || nass ? 1100 : 120);
    }, 430);
  }
  $("#plan").addEventListener("click", e => { const g = e.target.closest("[data-i]"); if (g) flug(+g.dataset.i); });
  $("#plan").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { const g = e.target.closest("[data-i]"); if (g) { e.preventDefault(); flug(+g.dataset.i); } } });
  zeichne();

  function ende() {
    const n = sterneFuer(L, st.nest), alt = S[L.id] || {}, rekord = st.nest > (alt.best || 0) && alt.n;
    S[L.id] = { n: (alt.n || 0) + 1, sterne: Math.max(alt.sterne || 0, n), best: Math.max(alt.best || 0, st.nest) }; speichern();
    const next = LEVEL[nr + 1], neuOffen = n > 0 && next && !alt.sterne && !S.frei, s = st.stat;
    const pannen = [s.regen && "vom Regen erwischt", s.mahd && "unters Mähwerk geraten", s.spinne && (s.spinne > 1 ? s.spinne + "-mal" : "einmal") + " der Krabbenspinne begegnet", s.platt && "vor Erschöpfung liegen geblieben"].filter(Boolean);
    const titel = n === 3 ? "Ein volles Nest!" : n === 2 ? "Ein guter Sammeltag" : n === 1 ? "Es reicht für ein paar Larven" : "Das war zu wenig";
    window.scrollTo(0, 0);
    app.innerHTML = `<div class="spielkopf"><div class="innen"><div class="sk-zeile"><a href="#">‹ Übersicht</a><span><b>${L.kurz}</b> · ${L.zeit}</span><span>Sonnenuntergang</span></div></div></div>
      <div class="huelle"><section><div class="ende">
        <div class="held"><svg viewBox="-36 -36 72 72" width="110" height="110" aria-hidden="true">${bieneSVG(L.id)}</svg></div>
        <span class="eyebrow">${L.zeit} geht zu Ende</span><h2>${titel}</h2>
        <div class="gross">${sterneHTML(n)}</div>
        <p><b>${st.nest} Portionen Pollen</b> liegen im Nest.${st.last ? " " + st.last + " hattest du noch an Bord – die zählen leider nicht." : ""}${rekord ? " Das ist dein neuer Rekord!" : ""}</p>
        <p class="klein">${n < 3 ? "Für " + (n + 1) + (n ? " Sterne" : " Stern") + " brauchst du " + L.ziel[n] + " Portionen. " : ""}${pannen.length ? "Heute bist du " + pannen.join(", ").replace(/, ([^,]*)$/, " und $1") + "." : "Kein Regen, kein Mähwerk, keine Spinne hat dich erwischt – stark!"}${s.zutief ? " " + (s.zutief === 1 ? "Einmal war" : s.zutief + "-mal war") + " dein Rüssel zu kurz." : ""}</p>
        ${neuOffen ? `<p><b>🔓 Neu:</b> ${next.titel} wartet auf dich.</p>` : ""}
        <div class="knopfreihe"><button type="button" class="knopf${n ? "" : " prim"}" id="noch">🔁 Noch einmal</button>${n && next ? `<a class="knopf honig" href="#${next.id}">${next.titel} ›</a>` : ""}<a class="knopf" href="#">Zur Übersicht</a><a class="knopf" href="wiesenpass.html">Zum Wiesenpass</a></div>
      </div></section>
      <section><h3 class="h-honig">Was dir die Wiese heute gezeigt hat</h3><div class="merk">${MERK[L.id].map(k => `<div>${k}</div>`).join("")}</div></section>${fuss()}</div>`;
    $("#noch").onclick = () => seiteSpiel(id);
    if (n === 3) konfetti(["🌼", "⭐", "🐝", "✨", "🌸"]);
  }
}

/* ============ Automatische Aktualisierung ============
   Prüft beim Zurückkehren zur Seite (und alle 15 Minuten), ob es eine neuere Fassung gibt.
   Auf der Übersicht wird sofort neu geladen, mitten im Spiel erst beim Zurückkehren zur Übersicht. */
let standAlt = null, neuDa = false;
async function standPruefen() {
  try {
    const r = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    const s = r.ok && (r.headers.get("etag") || r.headers.get("last-modified"));
    if (!s) return;
    if (standAlt === null) standAlt = s;
    else if (s !== standAlt) { neuDa = true; if (!location.hash.slice(1)) location.reload(); }
  } catch (e) {}
}
standPruefen();
document.addEventListener("visibilitychange", () => { if (!document.hidden) standPruefen(); });
window.addEventListener("pageshow", e => { if (e.persisted) standPruefen(); });
setInterval(() => { if (!document.hidden) standPruefen(); }, 15 * 60 * 1000);

/* ============ Navigation ============ */
function route() {
  if (neuDa && !location.hash.slice(1)) { location.reload(); return; }
  timer.forEach(clearTimeout); timer = [];
  $$(".konffeld").forEach(k => k.remove());
  const h = location.hash.slice(1);
  if (LEVEL.some(L => L.id === h && offen(LEVEL.indexOf(L)))) seiteSpiel(h); else seiteStart();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
