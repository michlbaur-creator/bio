<style>
:root{
  --gruen:#2F4F3E; --gruen-tief:#243d30; --gruen-mittel:#3A5F4A; --blau:#233D5C;
  --creme:#F7F3E8; --creme-tief:#EEE7D5; --tile:#FFFFFF;
  --honig:#C28A3A; --honig-tief:#a9762c;
  --ink:#26312b; --ink-soft:#5d6b78; --linie:#d9d2c1; --ok:#2f6a45;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--gruen-tief);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;min-height:100vh}
a{color:var(--gruen)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--honig);outline-offset:2px}
h1,h2,h3{font-weight:normal;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.kopf{background:linear-gradient(180deg,var(--gruen-tief) 0%,var(--gruen-mittel) 100%);color:var(--creme);text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 24px;border-bottom:4px double #c3d6c6;position:relative}
.kopf .zurueck{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);color:#dfeadf;font-family:var(--sans);font-size:14px;text-decoration:none;padding:6px}

.kopf h1{font-size:clamp(30px,9vw,44px)}
.kopf .unter{font-style:italic;color:#dfeadf;margin-top:8px;font-size:clamp(14px,3.8vw,17px)}
.huelle{max-width:760px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 40px}
section{padding-top:26px;display:grid;gap:12px}
.lead{font-size:19px}
.klein{font-size:15px;color:var(--ink-soft)}
.h-gruen{color:var(--gruen);font-size:26px}
.gruppe{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--honig-tief);border-bottom:1px solid var(--linie);padding-bottom:6px;margin-top:8px}
/* Diplom-Box */
.diplom{background:linear-gradient(160deg,#fffaf0,#f4ead2);border:2px solid #e2c98e;border-radius:20px;padding:18px;display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;box-shadow:0 4px 18px rgba(169,118,44,.14)}

.diplom .rang{font-size:26px;color:var(--gruen);line-height:1.15}
.diplom .eyebrow{font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--honig-tief);font-weight:700}
.diplom .zahl{font-family:var(--sans);font-size:15px;margin-top:4px}
.balken{height:12px;border-radius:999px;background:#fff;border:1px solid #e2c98e;overflow:hidden;margin:8px 0 4px}

.naechst{font-family:var(--sans);font-size:13.5px;color:var(--ink-soft)}
.diplom .knopfreihe{grid-column:1/-1}
@media (max-width:440px){.diplom{grid-template-columns:72px 1fr}.diplom .orden{width:72px;height:72px;font-size:34px}.diplom .rang{font-size:22px}}
.raenge{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--sans);font-size:12.5px}
.raenge span{border:1px solid var(--linie);border-radius:999px;padding:3px 10px;background:#fff;color:var(--ink-soft)}
.raenge span.auf{background:#2f6a45;border-color:#2f6a45;color:#fff}
/* Spielkarten */
.spiele{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.spiel{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;background:var(--tile);border:1px solid var(--linie);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}

.spiel .em{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:var(--creme-tief)}
.spiel.fauna .em{background:#e3ebf3}
.spiel.flora .em{background:#e4efe6}
.spiel .t{display:block;font-size:20px;color:var(--gruen);line-height:1.2}
.spiel.fauna .t{color:var(--blau)}
.spiel .s{display:block;font-family:var(--sans);font-size:13.5px;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.spiel .st{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--sans);font-size:12.5px;margin-top:6px;color:var(--ink-soft)}
.spiel .sterne{letter-spacing:1px}
.spiel .pass{border-radius:999px;padding:1px 8px;background:var(--creme-tief);font-size:11.5px}
.leer{opacity:.25;filter:grayscale(1)}
.knopf{display:inline-block;border:1px solid var(--gruen);background:var(--tile);color:var(--gruen);border-radius:12px;padding:11px 18px;font-family:var(--sans);font-size:16px;cursor:pointer;text-decoration:none;text-align:center}
.knopf.prim{background:var(--gruen);color:#fff;box-shadow:0 2px 0 var(--gruen-tief)}
.knopf.honig{background:var(--honig);border-color:var(--honig);color:#fff;box-shadow:0 2px 0 #8a5a17}
.knopfreihe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
details.lehrer{background:var(--tile);border:1px solid var(--linie);border-radius:14px;padding:12px 16px;font-size:16px}
details.lehrer summary{cursor:pointer;font-family:var(--sans);font-size:15px;color:var(--gruen);font-weight:bold}
details.lehrer .grid{display:grid;gap:10px;padding-top:10px}
ul.clean{margin:0;padding-left:1.2em;display:grid;gap:5px}

.ov{position:fixed;inset:0;background:rgba(20,30,24,.62);z-index:50;display:none;overflow:auto;padding:20px 12px}
.ov.an{display:block}
.ov .innen{max-width:760px;margin:0 auto;display:grid;gap:12px}

.ov input{border:1px solid var(--linie);border-radius:10px;padding:10px 12px;font-size:17px;width:100%}
.urkunde{background:#fffdf6;border-radius:6px;aspect-ratio:1.414/1;width:100%;position:relative;overflow:hidden;color:#2b2925;

.urkunde .unten{position:absolute;left:6cqw;right:6cqw;bottom:5.5cqw;display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--sans);font-size:1.6cqw;color:#5d6b78}

.bogen .b-fuss{position:absolute;left:6cqw;right:6cqw;bottom:3.6cqw;display:flex;justify-content:space-between;font-size:1.9cqw;color:#8a8577;border-top:.15cqw solid #d9d2c1;padding-top:1cqw}
@media print{

<script>
"use strict";
/* ============ Alle Spiele ============
   Jedes Spiel speichert seinen Stand auf diesem Gerät (localStorage) unter einem eigenen Schlüssel.
   Hier wird nur gelesen: Sterne je Stufe (0–3) werden zusammengezählt. */
const SPIELE = [
  { gruppe: "Wiese", app: "fauna", em: "🐝", t: "Sammelflug", s: "Ein Tag als Wildbiene: Nektar und Pollen sammeln, bevor Regen und Traktor kommen.", pass: "Expedition Wiese · Tiere", href: "../fauna/interaktiv/sammelflug.html", key: "mibaso.fauna.sammelflug", stufen: ["sand", "schere", "hummel"], namen: ["Sandbiene", "Scherenbiene", "Gartenhummel"] },
  { gruppe: "Wiese", app: "flora", em: "🌼", t: "Pollenpost", s: "Als Hummel und Nachtfalter Pollen tragen – aber nur zur gleichen Art.", pass: "Expedition Wiese · Pflanzen", href: "../flora/interaktiv/pollenpost.html", key: "mibaso.flora.pollenpost", stufen: ["fruehling", "sommer", "nacht"], namen: ["Frühlingswiese", "Sommerwiese", "Sommernacht"] },
  { gruppe: "Wiese", app: "fauna", em: "🦋", t: "Vom Ei zum Falter", s: "Das Leiterspiel zur Verwandlung des Schmetterlings.", pass: "Expedition Wiese · Tiere", href: "../fauna/interaktiv/falterspiel.html", key: "mibaso.fauna.falterspiel", stufen: ["spiel"], namen: ["Leiterspiel"] },
  { gruppe: "Wiese", app: "fauna", em: "💧", t: "Vom Wasser in die Luft", s: "Das Leiterspiel zur Verwandlung der Libelle.", pass: "Expedition Wiese · Tiere", href: "../fauna/interaktiv/libellenspiel.html", key: "mibaso.fauna.libellenspiel", stufen: ["spiel"], namen: ["Leiterspiel"] },
  { gruppe: "Wald", app: "flora", em: "🌰", t: "Hähersaat", s: "Als Eichelhäher Eicheln verstecken – was du vergisst, wird zum Baum.", pass: "Expedition Wald", href: "../flora/interaktiv/haehersaat.html", key: "mibaso.flora.haehersaat", stufen: ["eichen", "buchen", "rand"], namen: ["Eichenwald", "Buchenwald", "Waldrand"] },
  { gruppe: "Wald", app: "flora", em: "🌸", t: "Wettlauf ums Licht", s: "Als Frühblüher Licht sammeln, bevor sich das Blätterdach schließt.", pass: "Expedition Wald", href: "../flora/interaktiv/lichtrennen.html", key: "mibaso.flora.lichtrennen", stufen: ["windroeschen", "scharbock", "baerlauch"], namen: ["Buschwindröschen", "Scharbockskraut", "Bärlauch"] },
  { gruppe: "Winter", app: "fauna", em: "🐦", t: "Kalte Kost", s: "Ein Wintertag als Kohlmeise: Fett anlegen und rechtzeitig in den Nistkasten.", pass: "Expedition Winter", href: "../fauna/interaktiv/kalte-kost.html", key: "mibaso.fauna.kaltekost", stufen: ["dezember", "januar", "februar"], namen: ["Im Garten", "Eisiger Januar", "Winterwald"] },
  { gruppe: "Winter", app: "fauna", em: "🐾", t: "Fährtenleser", s: "Wer war das im Schnee? Folge der Spur, bevor es dunkel wird.", pass: "Expedition Winter", href: "../fauna/interaktiv/faehrtenleser.html", key: "mibaso.fauna.faehrtenleser", stufen: ["eich", "fuchs", "hase"], namen: ["Nussknacker", "Hühnerdieb", "Knospendieb"] },
  { gruppe: "Rund ums Jahr", app: "fauna", em: "📅", t: "Durchs Jahr!", s: "Zwölf Monate als Kohlmeise, Rauchschwalbe oder Igel überstehen.", pass: "Lernspiel", href: "../fauna/interaktiv/durchs-jahr.html", key: "mibaso.fauna.durchsjahr", stufen: ["meise", "schwalbe", "igel"], namen: ["Kohlmeise", "Rauchschwalbe", "Igel"] },
  { gruppe: "Vögel", app: "fauna", em: "🪺", t: "Nestwerk", s: "Als Amsel, Rauchschwalbe oder Buchfink ein Nest nach Bauplan bauen.", pass: "Vogelpass", href: "../fauna/interaktiv/nestwerk.html", key: "mibaso.fauna.nestbau", stufen: ["amsel", "schwalbe", "buchfink"], namen: ["Amsel", "Rauchschwalbe", "Buchfink"] },
  { gruppe: "Haustiere", app: "fauna", em: "🐕", t: "Vom Wolf zum Hütehund", s: "Das Zuchtspiel: In sechs Würfen zum perfekten Hütehund.", pass: "Wild & zahm", href: "../fauna/interaktiv/zuchtspiel.html", key: "mibaso.fauna.zuchtspiel", stufen: ["hueten"], namen: ["Hütehund"] }
];
const RAENGE = [
  { ab: 0,  em: "🌱", n: "Naturneuling",          txt: "Jeder Forscher fängt klein an." },
  { ab: 5,  em: "🥾", n: "Wiesenläufer",          txt: "Du hast die ersten Spiele gemeistert." },
  { ab: 15, em: "🔍", n: "Spurenleser",           txt: "Du entdeckst, was andere übersehen." },
  { ab: 30, em: "🌳", n: "Waldläufer",            txt: "Wiese, Wald und Winter sind dir vertraut." },
  { ab: 50, em: "🦉", n: "Naturkenner",           txt: "Du weißt, wie die Natur zusammenhängt." },
  { ab: 70, em: "🏅", n: "Meister-Naturforscher", txt: "Fast alle Sterne – eine echte Meisterleistung!" }
];
const $ = (s, el = document) => el.querySelector(s);
function stand(sp) {
  let d = {}; try { d = JSON.parse(localStorage.getItem(sp.key) || "{}") || {}; } catch (e) {}
  const sterne = sp.stufen.map(k => Math.max(0, Math.min(3, (d[k] && d[k].sterne) || 0)));
  const gespielt = sp.stufen.some(k => d[k] && d[k].n);
